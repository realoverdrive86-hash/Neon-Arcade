<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON ARCADE</title>
<style>
  :root{
    --bg:#0a0612;
    --panel:#150c26;
    --cyan:#2de3ff;
    --magenta:#ff2ea6;
    --amber:#ffb62d;
    --green:#3dff8a;
    --red:#ff3b3b;
    --blue:#3b8bff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); overflow:hidden;
    font-family:'Courier New', monospace;
    touch-action:none;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    background:
      radial-gradient(ellipse at 50% 0%, #2a1240 0%, #0a0612 60%);
  }
  /* ---- Neon room ambience behind the hub ---- */
  #roomFX{
    position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0;
  }
  #roomFX .ceiling{
    position:absolute; top:0; left:0; right:0; height:26px;
    background:linear-gradient(90deg,
      var(--cyan) 0 8%, transparent 8% 12%,
      var(--magenta) 12% 20%, transparent 20% 24%,
      var(--cyan) 24% 32%, transparent 32% 36%,
      var(--magenta) 36% 44%, transparent 44% 48%,
      var(--cyan) 48% 56%, transparent 56% 60%,
      var(--magenta) 60% 68%, transparent 68% 72%,
      var(--cyan) 72% 80%, transparent 80% 84%,
      var(--magenta) 84% 92%, transparent 92% 100%);
    filter:blur(3px); opacity:.75;
    box-shadow:0 6px 24px -2px var(--magenta);
  }
  #roomFX .floor{
    position:absolute; left:0; right:0; bottom:0; height:38%;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 34px),
      linear-gradient(180deg, transparent, rgba(45,227,255,.05));
    transform:perspective(240px) rotateX(55deg);
    transform-origin:bottom;
    opacity:.6;
  }

  /* ---------- HUB (now a real WebGL 3D scene) ---------- */
  #hub{
    flex:1; position:relative; overflow:hidden; z-index:1;
  }
  #hub3d{ position:absolute; inset:0; }
  #hub3d canvas{ display:block; width:100%; height:100%; touch-action:none; }
  #hubTitle{
    position:absolute; top:14px; left:0; right:0; text-align:center;
    pointer-events:none; z-index:2;
  }
  #hubTitle h1{
    color:var(--cyan); margin:0;
    font-size:clamp(20px,6vw,30px); letter-spacing:4px;
    text-shadow:0 0 8px var(--cyan), 0 0 22px var(--magenta);
  }
  #hubTitle .sub{
    color:#a89bd0; font-size:10px; letter-spacing:2px; margin-top:2px;
  }
  #hubLoading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--cyan); font-size:12px; letter-spacing:2px; z-index:3;
    background:#0a0612;
  }
  #hubMuteBtn{
    position:absolute; top:12px; right:12px; z-index:4;
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,6,18,.6); border:1px solid var(--cyan);
    color:var(--cyan); font-size:16px; cursor:pointer;
    box-shadow:0 0 8px rgba(45,227,255,.4);
  }
  #muteBtn{ margin-left:8px; }

  /* ---------- GAME SCREEN ---------- */
  #gameScreen{
    display:none; flex:1; flex-direction:column;
  }
  #hud{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 14px; color:var(--green);
    font-size:13px; letter-spacing:1px;
    text-shadow:0 0 4px var(--green);
    background:#0d0818;
    border-bottom:1px solid #2a1a44;
  }
  #hud .backBtn{
    color:var(--amber); border:1px solid var(--amber); border-radius:4px;
    padding:3px 8px; font-size:11px; text-shadow:none; cursor:pointer;
  }
  #canvasWrap{
    flex:1; position:relative; display:flex; align-items:stretch; justify-content:stretch;
    background:#000; overflow:hidden;
  }
  canvas{ display:block; max-width:100%; max-height:100%; touch-action:none; }
  #canvasWrap::before{
    content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  #canvasWrap::after{
    content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 60%, rgba(0,0,0,.55) 100%);
  }
  #overlayMsg{
    position:absolute; inset:0; display:none;
    align-items:center; justify-content:center; flex-direction:column;
    background:rgba(5,2,12,.82); color:var(--cyan); text-align:center; padding:20px;
  }
  #overlayMsg h2{ font-size:22px; text-shadow:0 0 10px var(--cyan); margin-bottom:6px;}
  #overlayMsg p{ font-size:12px; color:#b6a9d6; margin:4px 0 16px; }
  #overlayMsg button{
    background:var(--magenta); color:#fff; border:none; padding:10px 22px;
    border-radius:6px; font-family:inherit; font-size:13px; letter-spacing:1px;
    box-shadow:0 0 12px var(--magenta);
  }

  /* ---------- CONTROLS (real arcade cabinet control panel) ---------- */
  /* Wrapper gives the panel somewhere to recede into visually, and casts
     the panel's own shadow onto the "floor" behind it. */
  #controlsWrap{
    flex-shrink:0; height:clamp(170px, 25vh, 250px);
    position:relative; overflow:visible;
    background:#0a0b0d;
  }
  #controls{
    position:absolute; left:50%; top:0; width:min(92%, 460px); margin-left:calc(min(92%, 460px) / -2);
    height:clamp(190px, 27vh, 270px);
    background:
      repeating-linear-gradient(100deg, rgba(255,255,255,.05) 0 2px, rgba(0,0,0,.08) 2px 4px),
      linear-gradient(180deg, #4a3a68 0%, #2c2044 55%, #1c1430 100%);
    border-top:3px solid #6a5590;
    border-left:2px solid #4a3d64; border-right:2px solid #4a3d64;
    border-radius:0 0 10px 10px;
    box-shadow:
      inset 0 3px 6px rgba(255,255,255,.10),
      inset 0 -8px 16px rgba(0,0,0,.55),
      0 30px 40px rgba(0,0,0,.6);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 22px;
    transform:perspective(650px) rotateX(52deg);
    transform-origin:50% 0%;
    will-change:transform;
    backface-visibility:hidden;
  }
  /* corner bolts, like a real bolted-on control panel */
  #controls::before, #controls::after{
    content:''; position:absolute; top:9px; width:9px; height:9px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #cfd4da, #6b7078 60%, #3a3d43);
    box-shadow:0 1px 2px rgba(0,0,0,.6), inset 0 0 2px rgba(0,0,0,.5);
  }
  #controls::before{ left:10px; }
  #controls::after{ right:10px; }
  .ctl-label{ display:none !important; }

  /* Joystick (Claw / Maze / Astroblasters) — chrome plate + real ball-top stick on a shaft */
  #joyBase{
    width:108px; height:108px; border-radius:50%;
    background:
      radial-gradient(circle at 32% 26%, #eef2f6 0%, #b7bcc4 22%, #6f747d 55%, #3a3d43 100%);
    box-shadow:
      0 5px 8px rgba(0,0,0,.55),
      inset 0 -4px 6px rgba(0,0,0,.35),
      inset 0 3px 4px rgba(255,255,255,.5);
    position:relative; touch-action:none;
  }
  #joyBase::before{
    content:''; position:absolute; inset:13px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2b2e34, #101114 75%);
    box-shadow:inset 0 3px 6px rgba(0,0,0,.85), inset 0 -1px 2px rgba(255,255,255,.05);
  }
  /* rubber gaiter/boot the shaft pivots inside — gives the ball something to visibly sit on */
  #joyBoot{
    position:absolute; left:50%; top:50%; width:56px; height:56px;
    margin:-28px 0 0 -28px; border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, #3a3d43 0 3px, #26282d 3px 6px);
    box-shadow:inset 0 4px 8px rgba(0,0,0,.75), inset 0 -2px 3px rgba(255,255,255,.06);
    z-index:1;
  }
  /* the shaft: pivots from the center, stretches toward wherever the ball is dragged */
  #joyShaft{
    position:absolute; left:50%; top:50%; width:16px; height:30px;
    margin-left:-8px; margin-top:0; transform-origin:top center;
    background:linear-gradient(90deg,#1c1e22,#7d828b 45%,#1c1e22);
    border-radius:8px 8px 3px 3px;
    box-shadow:inset 0 0 3px rgba(0,0,0,.7), 1px 0 2px rgba(0,0,0,.4);
    transform:rotate(0deg) scaleY(0.14);
    z-index:2;
  }
  #joyStick{
    width:42px; height:42px; border-radius:50%;
    background:radial-gradient(circle at 32% 26%, #ffffff 0%, var(--red) 38%, #7a0000 100%);
    box-shadow:
      0 4px 6px rgba(0,0,0,.65),
      inset 0 3px 5px rgba(255,255,255,.55),
      inset 0 -7px 9px rgba(0,0,0,.4);
    position:absolute; left:33px; top:33px;
    z-index:3;
  }

  /* Action buttons — deep glossy convex arcade buttons (Sanwa/Seimitsu style), no labels */
  .btnCluster{ display:flex; gap:18px; align-items:center; }
  .actBtnMount{
    width:66px; height:66px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 30%, #4a4d53, #1a1b1e 75%);
    box-shadow:inset 0 4px 8px rgba(0,0,0,.8), inset 0 -1px 2px rgba(255,255,255,.06);
  }
  .actBtn{
    width:50px; height:50px; border-radius:50%;
    position:relative;
    box-shadow:
      0 6px 2px -1px rgba(0,0,0,.55),
      0 8px 10px rgba(0,0,0,.6),
      inset 0 -9px 12px rgba(0,0,0,.4),
      inset 0 5px 6px rgba(255,255,255,.35);
    border:2px solid rgba(0,0,0,.35);
  }
  .actBtn:active{ transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,.4), inset 0 -5px 8px rgba(0,0,0,.4); }
  .btn-red{
    background:
      radial-gradient(circle at 32% 24%, #ffffff 0%, rgba(255,255,255,0) 35%),
      radial-gradient(circle at 50% 65%, #ff6b6b 40%, #c62828 70%, #7a0000 100%);
  }
  .btn-blue{
    background:
      radial-gradient(circle at 32% 24%, #ffffff 0%, rgba(255,255,255,0) 35%),
      radial-gradient(circle at 50% 65%, #6ba8ff 40%, #1f5fc4 70%, #003c8a 100%);
  }

  /* Steering wheel (Highway Rush) — open 3-spoke racing wheel, rubber rim, red hub cap */
  #wheelColumn{
    position:absolute; left:50%; bottom:-18px; width:50px; height:70px;
    margin-left:-25px; border-radius:8px 8px 4px 4px;
    background:linear-gradient(180deg,#3a3d43,#17181b 70%);
    box-shadow:inset 2px 0 3px rgba(255,255,255,.08), inset -2px 0 4px rgba(0,0,0,.6), 0 4px 6px rgba(0,0,0,.5);
    z-index:0;
  }
  #wheelWrap{
    width:160px; height:160px; margin:0 auto; position:relative; touch-action:none;
  }
  #wheel{
    width:100%; height:100%; border-radius:50%;
    position:relative; z-index:2;
    will-change:transform; backface-visibility:hidden;
  }
  /* rubber rim: a ring with a see-through center so the spokes/hub read as
     genuinely open, plus a fake round cross-section via layered gradients.
     (uses cheap repeating-radial-gradient, not conic — conic-gradient is
     costly to rasterize on mobile GPUs and was causing the wheel-drag jank) */
  #wheel::before{
    content:''; position:absolute; inset:0; border-radius:50%; z-index:1;
    background:
      radial-gradient(circle, transparent 60%, #2c2f34 61% 66%, #17181b 67% 84%, #08090a 85% 100%);
    box-shadow:
      0 10px 16px rgba(0,0,0,.65),
      inset 0 5px 9px rgba(255,255,255,.10),
      inset 0 -7px 16px rgba(0,0,0,.75);
  }
  /* small marker at 12 o'clock so wheel rotation reads clearly at a glance */
  .wheelMarker{
    position:absolute; left:50%; top:3%; width:10px; height:16px; margin-left:-5px;
    border-radius:3px; z-index:2; background:linear-gradient(180deg,#ff8a75,#c62410);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.4);
  }
  .wheelSpoke{
    position:absolute; left:50%; top:50%; width:15px; height:44%;
    margin-left:-7.5px; transform-origin:top center; z-index:2;
    background:linear-gradient(90deg,#0e0f11,#787c84 45%,#0e0f11);
    border-radius:0 0 6px 6px;
    box-shadow:0 0 0 1px rgba(0,0,0,.4), inset 0 0 3px rgba(0,0,0,.5);
  }
  .wheelSpoke.s1{ transform:rotate(0deg); }
  .wheelSpoke.s2{ transform:rotate(120deg); }
  .wheelSpoke.s3{ transform:rotate(240deg); }
  #wheelHub{
    position:absolute; left:50%; top:50%; width:38%; height:38%;
    transform:translate(-50%,-50%); border-radius:50%; z-index:3;
    background:radial-gradient(circle at 35% 28%, #4a4d53, #17181b 70%);
    box-shadow:0 4px 8px rgba(0,0,0,.65), inset 0 2px 4px rgba(255,255,255,.15), inset 0 -5px 9px rgba(0,0,0,.6);
  }
  #wheelHub::after{
    content:''; position:absolute; left:50%; top:50%; width:60%; height:60%;
    transform:translate(-50%,-50%); border-radius:50%;
    background:radial-gradient(circle at 38% 30%, #ff6b5c, #b21f0f 70%, #6a0f04 100%);
    box-shadow:0 2px 3px rgba(0,0,0,.5), inset 0 2px 3px rgba(255,255,255,.4), inset 0 -3px 5px rgba(0,0,0,.4);
  }

  /* Paddle slider (Brick Buster) — metal fader knob riding in a recessed slot */
  #paddleZone{
    position:absolute; left:0; right:0; bottom:0; height:180px;
    touch-action:none;
  }
  #paddleTrack{
    position:absolute; bottom:24px; left:16px; right:16px; height:16px;
    background:linear-gradient(180deg,#050506,#26282d 30%,#050506);
    border-radius:8px; border:1px solid #4a4d53;
    box-shadow:inset 0 4px 6px rgba(0,0,0,.9), inset 0 -1px 1px rgba(255,255,255,.06);
  }
  #paddleTrack::before, #paddleTrack::after{
    content:''; position:absolute; top:50%; width:6px; height:6px; margin-top:-3px;
    border-radius:50%; background:radial-gradient(circle at 35% 30%,#8a8d92,#26282d);
    box-shadow:inset 0 1px 1px rgba(0,0,0,.6);
  }
  #paddleTrack::before{ left:6px; }
  #paddleTrack::after{ right:6px; }
  #paddleHandle{
    position:absolute; bottom:9px; width:64px; height:38px; border-radius:9px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 6px),
      linear-gradient(180deg,#f2f4f7,#a7acb4 40%,#54585f 60%,#33363b);
    box-shadow:
      0 6px 8px rgba(0,0,0,.55),
      inset 0 3px 3px rgba(255,255,255,.7),
      inset 0 -5px 6px rgba(0,0,0,.4);
    border:1px solid #202226;
    left:calc(50% - 32px);
  }
  #paddleHandle::before{
    content:''; position:absolute; left:50%; top:50%; width:26px; height:4px; margin:-2px 0 0 -13px;
    border-radius:2px; background:rgba(0,0,0,.35); box-shadow:0 3px 0 rgba(0,0,0,.35);
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- ============ HUB (WebGL 3D room) ============ -->
  <div id="hub">
    <div id="hub3d"></div>
    <div id="hubTitle">
      <h1>NEON ARCADE</h1>
      <div class="sub">— свайпните, чтобы посмотреть на другие автоматы, коснитесь чтобы играть —</div>
    </div>
    <div id="hubLoading">ЗАГРУЗКА 3D…</div>
    <div id="hubMuteBtn">🔊</div>
  </div>

  <!-- ============ GAME ============ -->
  <div id="gameScreen">
    <div id="hud">
      <div id="backBtn" class="backBtn">◀ ЗАЛ</div>
      <div id="hudScore">SCORE: 0</div>
      <div id="hudLives">LIVES: 3</div>
      <div id="muteBtn" class="backBtn">🔊</div>
    </div>
    <div id="canvasWrap">
      <canvas id="game"></canvas>
      <div id="overlayMsg">
        <h2 id="overTitle">GAME OVER</h2>
        <p id="overText"></p>
        <button id="overBtn">ИГРАТЬ СНОВА</button>
      </div>
    </div>

    <!-- Control schemes: only the relevant one is shown per game -->
    <div id="controlsWrap">
    <div id="controls">
      <div class="ctl-label" id="ctlLabel">JOYSTICK</div>

      <!-- Joystick + buttons layout (claw / maze / shooter) -->
      <div id="ctlJoystick" class="hidden" style="display:flex; width:100%; justify-content:space-between; align-items:center;">
        <div id="joyBase"><div id="joyBoot"></div><div id="joyShaft"></div><div id="joyStick"></div></div>
        <div class="btnCluster" id="joyBtnCluster"></div>
      </div>

      <!-- Steering wheel layout (racing) -->
      <div id="ctlWheel" class="hidden" style="width:100%; display:flex; justify-content:center;">
        <div id="wheelWrap"><div id="wheelColumn"></div><div id="wheel">
          <div class="wheelSpoke s1"></div><div class="wheelSpoke s2"></div><div class="wheelSpoke s3"></div>
          <div class="wheelMarker"></div>
          <div id="wheelHub"></div>
        </div></div>
      </div>

      <!-- Paddle drag layout (brick buster) -->
      <div id="ctlPaddle" class="hidden" style="width:100%; height:100%; position:relative;">
        <div id="paddleZone">
          <div id="paddleTrack"></div>
          <div id="paddleHandle"></div>
        </div>
      </div>
    </div>
    </div>
  </div>

</div>

<script>
/* =====================================================================
   NEON ARCADE — 5 original mini-games, each with a control scheme that
   matches the physical control on its cabinet (joystick+button, wheel,
   or paddle-drag), instead of one generic on-screen d-pad.
   ===================================================================== */

const CABINETS = [
  { id:'claw',   name:'COW ABDUCTION', color:0x3b8bff, icon:'🛸', desc:'Джойстик + ЛУЧ',    ctl:'joy1' },
  { id:'racing', name:'HIGHWAY RUSH',  color:0xff2ea6, icon:'🏎️', desc:'Руль',               ctl:'wheel' },
  { id:'maze',   name:'DOT MUNCHER',  color:0xffb62d, icon:'🟡', desc:'Джойстик',           ctl:'joy0' },
  { id:'shooter',name:'ASTROBLASTERS',color:0x2de3ff, icon:'🚀', desc:'Джойстик + FIRE',    ctl:'joy1' },
  { id:'brick',  name:'BRICK BUSTER',  color:0x3dff8a, icon:'🧱', desc:'Платформа пальцем', ctl:'paddle' },
];

const hub = document.getElementById('hub');
const gameScreen = document.getElementById('gameScreen');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false; // crisp pixel-art, no blurry scaling
const hudScore = document.getElementById('hudScore');
const hudLives = document.getElementById('hudLives');
const overlay = document.getElementById('overlayMsg');
const overTitle = document.getElementById('overTitle');
const overText = document.getElementById('overText');
const overBtn = document.getElementById('overBtn');
const ctlLabel = document.getElementById('ctlLabel');
const ctlJoystick = document.getElementById('ctlJoystick');
const ctlWheel = document.getElementById('ctlWheel');
const ctlPaddle = document.getElementById('ctlPaddle');
const joyBtnCluster = document.getElementById('joyBtnCluster');
const joyBase = document.getElementById('joyBase');
const joyStick = document.getElementById('joyStick');
const joyShaft = document.getElementById('joyShaft');
const wheel = document.getElementById('wheel');
const paddleZone = document.getElementById('paddleZone');
const paddleHandle = document.getElementById('paddleHandle');

/* =====================================================================
   SFX — tiny procedural retro sound engine (WebAudio oscillators/noise,
   zero external audio files needed). One shared AudioContext, unlocked
   on the first user gesture (tapping a cabinet). All games call into
   this via short named helpers below.
   ===================================================================== */
const SFX = (function(){
  let actx = null, muted = false;
  const loops = {}; // name -> {osc, gain}
  try{ muted = localStorage.getItem('neonArcadeMuted')==='1'; }catch(e){}

  function getCtx(){
    if(!actx){
      try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ actx = null; }
    }
    if(actx && actx.state==='suspended') actx.resume();
    return actx;
  }

  // simple synth "blip": one oscillator with a percussive volume envelope,
  // optionally sliding frequency for laser/explosion/power-up style sweeps
  function tone(freq, dur, type, vol, slideTo, delay){
    if(muted) return;
    const c = getCtx(); if(!c) return;
    const t0 = c.currentTime + (delay||0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo), t0+dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol!=null?vol:0.2, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  }

  // two detuned oscillators for a fatter "chord-y" blip (power-ups, fanfares)
  function toneStack(freq, dur, type, vol, slideTo, detune){
    tone(freq, dur, type, vol, slideTo);
    tone(freq*(detune||1.5), dur*0.9, type, (vol!=null?vol:0.2)*0.6, slideTo?slideTo*(detune||1.5):null, 0.01);
  }

  // short filtered noise burst — explosions, crashes, static
  function noiseBurst(dur, vol, lowpass){
    if(muted) return;
    const c = getCtx(); if(!c) return;
    const t0 = c.currentTime;
    const n = Math.max(1, Math.floor(c.sampleRate*dur));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const data = buf.getChannelData(0);
    for(let i=0;i<n;i++) data[i] = (Math.random()*2-1) * (1-i/n);
    const src = c.createBufferSource(); src.buffer = buf;
    const gain = c.createGain();
    gain.gain.setValueAtTime(vol!=null?vol:0.2, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    let node = src;
    if(lowpass){
      const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lowpass;
      src.connect(f); node = f;
    }
    node.connect(gain); gain.connect(c.destination);
    src.start(t0);
  }

  // sustained oscillator that persists until explicitly stopped — engine
  // hums, tractor-beam drone, thruster idle. Re-calling with the same name
  // just glides the pitch/volume instead of retriggering.
  function loopStart(name, freq, type, vol, filterHz){
    if(muted){ loopStop(name); return; }
    const c = getCtx(); if(!c) return;
    let L = loops[name];
    if(!L){
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type||'sine';
      osc.frequency.setValueAtTime(freq, c.currentTime);
      let tail = osc, filter = null;
      if(filterHz){
        filter = c.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(filterHz, c.currentTime);
        filter.Q.value = 0.7;
        osc.connect(filter);
        tail = filter;
      }
      gain.gain.setValueAtTime(0.0001, c.currentTime);
      gain.gain.linearRampToValueAtTime(vol!=null?vol:0.08, c.currentTime+0.06);
      tail.connect(gain); gain.connect(c.destination);
      osc.start();
      loops[name] = {osc, gain, filter};
    } else {
      L.osc.frequency.setTargetAtTime(freq, c.currentTime, 0.06);
      if(vol!=null) L.gain.gain.setTargetAtTime(vol, c.currentTime, 0.06);
      if(filterHz && L.filter) L.filter.frequency.setTargetAtTime(filterHz, c.currentTime, 0.06);
    }
  }
  function loopStop(name){
    const L = loops[name]; if(!L) return;
    const c = getCtx();
    if(c){
      const t0 = c.currentTime;
      L.gain.gain.cancelScheduledValues(t0);
      L.gain.gain.setValueAtTime(Math.max(0.0001,L.gain.gain.value), t0);
      L.gain.gain.linearRampToValueAtTime(0.0001, t0+0.08);
      try{ L.osc.stop(t0+0.12); }catch(e){}
    }
    delete loops[name];
  }
  function stopAllLoops(){ Object.keys(loops).forEach(loopStop); }

  // ---- tiny procedural background music (chiptune arpeggio) — hub only;
  // per-game loops/schedulers were costing frame time, so the games now
  // rely on cheap one-shot cues tied to actual events instead ----
  let musicTimer = null, musicStep = 0, musicOn = false;
  const hubMusicNotes = [110,110,164.81,146.83,130.81,130.81,196,174.61];
  function musicTick(){
    if(!musicOn){ musicTimer=null; return; }
    if(!muted){
      tone(hubMusicNotes[musicStep%hubMusicNotes.length], 0.19, 'triangle', 0.045);
      if((musicStep%4)===0) tone(hubMusicNotes[musicStep%hubMusicNotes.length]/2, 0.19, 'sine', 0.03);
    }
    musicStep++;
    musicTimer = setTimeout(musicTick, 260);
  }

  const api = {
    unlock(){ getCtx(); },
    setMuted(m){
      muted = !!m;
      try{ localStorage.setItem('neonArcadeMuted', muted?'1':'0'); }catch(e){}
      if(muted) stopAllLoops();
    },
    toggleMuted(){ api.setMuted(!muted); return muted; },
    isMuted(){ return muted; },
    stopAllLoops,
    musicStart(){ if(!musicOn){ musicOn=true; musicStep=0; musicTick(); } },
    musicStop(){ musicOn=false; if(musicTimer){ clearTimeout(musicTimer); musicTimer=null; } },
    // ---- generic UI ----
    uiClick(){ tone(560,0.05,'square',0.12); },
    uiTick(){ tone(720,0.03,'square',0.06); },
    cabinetSelect(){ toneStack(440,0.09,'square',0.15,880); },
    // ---- shared ----
    hit(){ tone(140,0.16,'square',0.22,50); },
    score(){ tone(880,0.07,'square',0.14); },
    levelUp(){ toneStack(440,0.12,'square',0.16,880); tone(660,0.14,'square',0.16,1320,0.09); },
    gameOver(){ tone(420,0.18,'sawtooth',0.2,90); tone(300,0.24,'sawtooth',0.2,60,0.16); },
    gameStart(){ tone(440,0.09,'square',0.15,660); tone(660,0.09,'square',0.15,880,0.09); },
    lowLives(){ tone(700,0.1,'square',0.15); tone(700,0.1,'square',0.15,null,0.14); },
    countdownBeep(final){ tone(final?880:520, final?0.22:0.09, 'square', 0.16, final?1320:null); },
    // ---- Cow Abduction ----
    // sawtooth core kept for character, but run through a lowpass that
    // opens up as the beam heats (starts muffled/soft, brightens with charge)
    beamStart(freq, filterHz){ loopStart('beam', freq||360, 'sawtooth', 0.06, filterHz||700); },
    beamStop(){ loopStop('beam'); },
    abduct(){ toneStack(420,0.22,'sine',0.18,1100); },
    bark(){ tone(180,0.08,'square',0.14,90); },
    throwFork(){ tone(700,0.06,'square',0.1,300); },
    overheat(){ noiseBurst(0.2,0.12,900); },
    tractorRumble(on){ if(on) loopStart('tractor',55,'sawtooth',0.035); else loopStop('tractor'); },
    farmerBonk(){ tone(160,0.09,'square',0.16,60); },
    powerup(){ toneStack(500,0.16,'sine',0.16,1050); },
    quota(){ toneStack(440,0.12,'square',0.16,880); tone(660,0.14,'square',0.16,1320,0.09); },
    // ---- Highway Rush ----
    crash(){ noiseBurst(0.35,0.26,1200); tone(90,0.3,'sawtooth',0.16,30); },
    gearShift(){ tone(160,0.09,'sawtooth',0.14,320); }, // quick rev blip, fires once per speed tier instead of a continuous hum
    nearMiss(){ tone(1400,0.09,'sine',0.1,700); }, // quick descending whoosh when a car passes close without a hit
    policeSiren(on, freq){ if(on) loopStart('siren', freq||700, 'sawtooth', 0.05, 1500); else loopStop('siren'); },
    busted(){ noiseBurst(0.3,0.22,900); tone(160,0.3,'sawtooth',0.18,50); },
    chaseEscape(){ toneStack(500,0.16,'square',0.18,1000); tone(750,0.14,'square',0.16,1500,0.09); },
    // ---- Dot Muncher ----
    chomp(){ tone(220,0.045,'square',0.11,420); },
    powerPellet(){ toneStack(150,0.16,'square',0.18,520); },
    eatGhost(){ tone(600,0.2,'square',0.18,1400); },
    ghostDeath(){ tone(300,0.5,'sawtooth',0.18,50); },
    fruitBonus(){ tone(660,0.06,'square',0.14,1320); },
    warp(){ toneStack(300,0.22,'sine',0.14,900); tone(200,0.2,'sine',0.1,700,0.05); },
    // ---- Astroblasters ----
    shoot(){ tone(880,0.06,'square',0.1,220); },
    explosion(){ noiseBurst(0.3,0.22,1400); tone(80,0.28,'sawtooth',0.14,20); },
    bossWarn(){ tone(90,0.35,'sawtooth',0.16,60); tone(90,0.35,'sawtooth',0.14,60,0.2); },
    waveStart(){ tone(300,0.09,'square',0.16,600); tone(600,0.11,'square',0.16,900,0.08); }, // short fanfare, fires once per wave instead of a running loop
    shieldHit(){ tone(500,0.1,'triangle',0.14,150); },
    // ---- Brick Buster ----
    paddleHit(){ toneStack(300,0.08,'triangle',0.2,460); },
    wallHit(){ tone(240,0.045,'triangle',0.08); },
    brickHit(){ tone(520,0.08,'square',0.16,760); },
    lastBrick(){ toneStack(700,0.18,'square',0.18,1400); }
  };
  return api;
})();

/* =====================================================================
   3D HUB — real WebGL scene (Three.js): lit cabinets, emissive neon,
   glow sprites, reflective floor, drifting camera. Tap/click a cabinet
   to raycast into startGame(id) (defined further below, unchanged).
   ===================================================================== */
let hub3d = null;
function initHub3D(){
  const THREE = window.THREE;
  const container = document.getElementById('hub3d');
  const W3 = container.clientWidth, H3 = container.clientHeight;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0612, 0.03);

  const camera = new THREE.PerspectiveCamera(55, W3/H3, 0.1, 100);
  camera.position.set(0, 2.0, 6.2);

  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(W3, H3);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.5;
  container.appendChild(renderer.domElement);

  // ---- glow sprite texture (cheap fake-bloom for lights/marquees) ----
  function glowTexture(){
    const c = document.createElement('canvas'); c.width=c.height=128;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(64,64,0,64,64,64);
    grad.addColorStop(0,'rgba(255,255,255,1)');
    grad.addColorStop(0.4,'rgba(255,255,255,.5)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=grad; g.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  const glowTex = glowTexture();
  function addGlow(pos, color, scale, opacity){
    const mat = new THREE.SpriteMaterial({ map:glowTex, color, transparent:true, opacity:(opacity??1), blending:THREE.AdditiveBlending, depthWrite:false });
    const spr = new THREE.Sprite(mat);
    spr.position.copy(pos); spr.scale.set(scale,scale,1);
    scene.add(spr);
    return spr;
  }

  // ---- floor: dark tile pattern (canvas texture) with a reflective sheen ----
  function floorTexture(){
    const c = document.createElement('canvas'); c.width=c.height=256;
    const g = c.getContext('2d');
    g.fillStyle = '#221a38'; g.fillRect(0,0,256,256);
    const tile = 32;
    for(let y=0;y<256;y+=tile){
      for(let x=0;x<256;x+=tile){
        const alt = ((x/tile)+(y/tile))%2===0;
        g.fillStyle = alt ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)';
        g.fillRect(x,y,tile,tile);
      }
    }
    g.strokeStyle='rgba(140,100,220,0.14)'; g.lineWidth=1;
    for(let x=0;x<=256;x+=tile){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,256); g.stroke(); }
    for(let y=0;y<=256;y+=tile){ g.beginPath(); g.moveTo(0,y); g.lineTo(256,y); g.stroke(); }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(4.5,3);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  const floorMat = new THREE.MeshStandardMaterial({ map:floorTexture(), color:0xffffff, metalness:0.85, roughness:0.22 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30,20), floorMat);
  floor.rotation.x = -Math.PI/2;
  scene.add(floor);

  // faint grid overlay for an extra depth cue on top of the tile texture
  const grid = new THREE.GridHelper(30, 30, 0x2de3ff, 0x1a1030);
  grid.material.opacity = 0.08; grid.material.transparent = true;
  scene.add(grid);

  // flat colored glow decals, lying on the floor — added per-cabinet below,
  // right beneath each machine, tying the floor lighting to its own neon
  function addFloorGlow(pos, color, scale, opacity){
    const mat = new THREE.MeshBasicMaterial({ map:glowTex, color, transparent:true, opacity:(opacity??1), blending:THREE.AdditiveBlending, depthWrite:false });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(scale,scale), mat);
    mesh.rotation.x = -Math.PI/2;
    mesh.position.copy(pos);
    scene.add(mesh);
    return mesh;
  }


  // ---- ceiling neon strips — three rows receding into the fog, so the
  // hall reads as a long arcade rather than a single lit alcove ----
  const stripGroup = new THREE.Group();
  const stripRows = [ {z:-4.5, y:3.6, count:9, scale:1, glow:2.2}, {z:-8, y:3.9, count:7, scale:0.75, glow:1.5}, {z:-11.5, y:4.1, count:5, scale:0.55, glow:1.0} ];
  stripRows.forEach(row=>{
    const spanW = 16;
    for(let i=0;i<row.count;i++){
      const c = i%2===0 ? 0x2de3ff : 0xff2ea6;
      const geo = new THREE.BoxGeometry(1.6*row.scale,0.08*row.scale,0.12*row.scale);
      const mat = new THREE.MeshStandardMaterial({ color:c, emissive:c, emissiveIntensity:2.5*row.scale, roughness:0.4 });
      const m = new THREE.Mesh(geo, mat);
      m.position.set(-spanW/2 + i*(spanW/(row.count-1)), row.y, row.z);
      stripGroup.add(m);
      addGlow(m.position, c, row.glow);
    }
  });
  scene.add(stripGroup);
  // ---- back wall: subtle vertical panel texture instead of flat matte ----
  function wallTexture(){
    const c = document.createElement('canvas'); c.width=256; c.height=64;
    const g = c.getContext('2d');
    g.fillStyle='#0d0818'; g.fillRect(0,0,256,64);
    g.strokeStyle='rgba(120,90,180,0.16)'; g.lineWidth=1;
    for(let x=0;x<=256;x+=32){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,64); g.stroke(); }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(6,2);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(30,8), new THREE.MeshStandardMaterial({ map:wallTexture(), color:0xffffff, roughness:0.9 }));
  wall.position.set(0,3.5,-5); scene.add(wall);

  // ---- lights ----
  scene.add(new THREE.AmbientLight(0x4a3a68, 1.3));
  const key = new THREE.PointLight(0xffffff, 1.6, 25); key.position.set(0,4,3); scene.add(key);
  const fill = new THREE.PointLight(0xd8cfff, 1.0, 20); fill.position.set(0,2.2,5.5); scene.add(fill);
  const rim = new THREE.PointLight(0xff2ea6, 0.9, 15); rim.position.set(-6,2,2); scene.add(rim);
  const rim2 = new THREE.PointLight(0x2de3ff, 0.9, 15); rim2.position.set(6,2,2); scene.add(rim2);

  // ---- cabinet builder ----
  const clickable = [];
  const n = CABINETS.length;
  const spacing = 1.9;
  const startX = -spacing*(n-1)/2;

  function addEdgeTrim(mesh, color){
    const edges = new THREE.EdgesGeometry(mesh.geometry);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.5 }));
    mesh.add(line);
  }

  // ---- attract-mode screen art: a small illustrated "screenshot" of each
  // game's actual look, instead of a generic icon + repeated name (which
  // just duplicated the marquee text above the cabinet) ----
  function drawAttractScreen(id, cg, blink, time){
    time = time||0;
    cg.fillStyle='#050311'; cg.fillRect(0,0,256,256);
    if(id==='claw'){
      const bob = Math.sin(time*2)*3;
      const g = cg.createLinearGradient(0,0,0,256);
      g.addColorStop(0,'#140a2a'); g.addColorStop(1,'#241040');
      cg.fillStyle=g; cg.fillRect(0,0,256,180);
      cg.fillStyle='rgba(255,240,200,0.9)';
      cg.beginPath(); cg.arc(190,50,26,0,Math.PI*2); cg.fill();
      for(let i=0;i<18;i++){
        cg.fillStyle = `rgba(255,255,255,${0.4+0.4*Math.abs(Math.sin(time*2+i))})`;
        cg.fillRect(20+((i*37)%216), 10+((i*53)%140), 2,2);
      }
      cg.fillStyle='#1a3a1a'; cg.fillRect(0,180,256,76);
      const beamPulse = 0.28+0.12*Math.abs(Math.sin(time*4));
      cg.fillStyle=`rgba(120,220,255,${beamPulse})`;
      cg.beginPath(); cg.moveTo(110,90+bob); cg.lineTo(146,90+bob); cg.lineTo(168,190); cg.lineTo(88,190); cg.closePath(); cg.fill();
      cg.fillStyle='#e8d8b8';
      cg.beginPath(); cg.ellipse(128,175,22,13,0,0,Math.PI*2); cg.fill();
      cg.fillStyle='#3a2418';
      cg.beginPath(); cg.ellipse(116,168,7,6,0,0,Math.PI*2); cg.fill();
      cg.beginPath(); cg.ellipse(140,170,6,5,0,0,Math.PI*2); cg.fill();
      cg.fillStyle='#8a6ad6';
      cg.beginPath(); cg.ellipse(128,85+bob,34,12,0,0,Math.PI*2); cg.fill();
      cg.fillStyle='rgba(200,230,255,0.9)';
      cg.beginPath(); cg.ellipse(128,72+bob,16,14,0,Math.PI,0); cg.fill();
      for(let i=0;i<7;i++){
        const on = Math.sin(time*6+i)>0;
        cg.fillStyle = on ? (i%2 ? '#ffd24d' : '#7de8ff') : 'rgba(255,255,255,0.25)';
        cg.beginPath(); cg.arc(100+i*9,88+bob,2,0,Math.PI*2); cg.fill();
      }
    } else if(id==='racing'){
      // top-down road, matching the game's actual overhead camera — the
      // road now fills almost the whole screen (3 real lanes, like the
      // actual game) instead of leaving big dark margins on both sides
      const g = cg.createLinearGradient(0,0,0,256);
      g.addColorStop(0,'#180a22'); g.addColorStop(1,'#0d0614');
      cg.fillStyle=g; cg.fillRect(0,0,256,256);
      const rx0=8, rx1=248, rw=rx1-rx0;
      cg.fillStyle='#221830'; cg.fillRect(rx0,0,rw,256);
      cg.strokeStyle='rgba(255,255,255,0.18)'; cg.lineWidth=3;
      cg.beginPath(); cg.moveTo(rx0,0); cg.lineTo(rx0,256); cg.moveTo(rx1,0); cg.lineTo(rx1,256); cg.stroke();
      // dashes scroll downward, like the road rushing past underneath
      const scroll = (time*70)%34;
      cg.fillStyle='#ffd24d';
      [rx0+rw/3, rx0+rw*2/3].forEach(lx=>{
        for(let y=-34+scroll;y<266;y+=34) cg.fillRect(lx-4,y,8,20);
      });
      function topCar(cx,cy,color){
        cg.fillStyle=color; cg.fillRect(cx-13,cy-19,26,38);
        cg.fillStyle='rgba(180,220,255,0.7)'; cg.fillRect(cx-8,cy-10,16,12);
      }
      const laneCx = [rx0+rw/6, rx0+rw/2, rx0+rw*5/6];
      const drift = Math.sin(time*1.6)*10;
      topCar(laneCx[0],56+drift,'#3b8bff');
      topCar(laneCx[2],122-drift,'#ffb62d');
      topCar(laneCx[1],198,'#e03030');
    } else if(id==='maze'){
      cg.fillStyle='#0a0d2e'; cg.fillRect(0,0,256,256);
      cg.fillStyle='#2a3a8a';
      for(let r=0;r<8;r++) for(let c=0;c<8;c++) if((r+c)%3===0) cg.fillRect(16+c*28, 16+r*28, 22,22);
      cg.fillStyle='#ffe89a';
      for(let r=0;r<8;r++) for(let c=0;c<8;c++) if((r+c)%3!==0){ cg.beginPath(); cg.arc(16+c*28+11,16+r*28+11,2.4,0,Math.PI*2); cg.fill(); }
      const mouth = 0.08+0.17*Math.abs(Math.sin(time*5));
      cg.fillStyle='#ffd24d';
      cg.beginPath(); cg.arc(128,128,14,mouth*Math.PI,(2-mouth)*Math.PI); cg.lineTo(128,128); cg.fill();
      const gx = 190+Math.sin(time*3)*10;
      cg.fillStyle='#ff6b9d';
      cg.beginPath(); cg.arc(gx,160,12,Math.PI,0);
      cg.lineTo(gx+12,178); cg.lineTo(gx+4,172); cg.lineTo(gx-4,178); cg.lineTo(gx-12,172); cg.lineTo(gx-12,160); cg.fill();
    } else if(id==='shooter'){
      cg.fillStyle='rgba(255,255,255,0.7)';
      for(let i=0;i<30;i++) cg.fillRect((i*53)%256, (i*97)%256, 1.6,1.6);
      [[70,60,'#c99bff',0],[170,90,'#ff9ecf',1.4],[120,40,'#5de8ff',2.7]].forEach(([ex,ey,c,ph])=>{
        cg.fillStyle=c;
        cg.beginPath(); cg.ellipse(ex,ey+Math.sin(time*2+ph)*4,16,7,0,0,Math.PI*2); cg.fill();
      });
      const laserY = 140+((time*90)%70);
      cg.fillStyle='#5de8ff'; cg.fillRect(126,laserY-20,4,26);
      const flick = 0.75+0.25*Math.abs(Math.sin(time*10));
      cg.fillStyle=`rgba(93,232,255,${flick})`;
      cg.beginPath(); cg.moveTo(122,232); cg.lineTo(128,246); cg.lineTo(134,232); cg.closePath(); cg.fill();
      cg.fillStyle='#3dff8a';
      cg.beginPath(); cg.moveTo(128,190); cg.lineTo(112,230); cg.lineTo(128,220); cg.lineTo(144,230); cg.closePath(); cg.fill();
    } else if(id==='brick'){
      cg.fillStyle='#0d1220'; cg.fillRect(0,0,256,256);
      const colors=['#ff5a5a','#ffb62d','#3dff8a','#5de8ff'];
      const rows=[0,1,2,3].filter(r=>!( (Math.floor(time/1.4)+r)%9===0 )); // bricks occasionally "pop" out and back
      for(let r=0;r<4;r++) for(let c=0;c<6;c++){ if(!rows.includes(r)) continue; cg.fillStyle=colors[r]; cg.fillRect(10+c*40, 30+r*20, 36,14); }
      const bx = 60+Math.abs(((time*100)%200)-100);
      const by = 150-Math.abs(Math.sin(time*3))*40;
      cg.fillStyle='#fff'; cg.beginPath(); cg.arc(bx,by,6,0,Math.PI*2); cg.fill();
      const px = 100+Math.sin(time*1.3)*30;
      cg.fillStyle='#9a9aa8'; cg.fillRect(px,220,56,10);
    }
    // best-score readout, bottom of screen — dark backing bar for contrast
    // regardless of what's drawn behind it, plus a blinking coin prompt
    // beneath it for a bit of attract-mode life instead of a static image
    const best = getHighScore(id);
    cg.fillStyle='rgba(5,3,17,0.78)'; cg.fillRect(0,204,256,52);
    cg.fillStyle='#ffd24d'; cg.font='bold 17px monospace';
    cg.textAlign='center'; cg.textBaseline='middle';
    cg.fillText('BEST '+best, 128, 222);
    if(blink){
      cg.fillStyle='#ffffff'; cg.font='bold 13px monospace';
      cg.fillText('INSERT COIN', 128, 244);
    }

    addGlow(new THREE.Vector3(group.position.x, 2.55, 0.1), cab.color, 1.15, 0.22);

    // screen: canvas texture with icon + name (this is the "attract mode"), with a bezel

    // control panel (angled, like a real cabinet)
    const panelMat = new THREE.MeshStandardMaterial({ color:0x1c1430, metalness:0.3, roughness:0.5 });
    const panel = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.08,0.55), panelMat);

    group.add(panel);

    // ---- per-game physical controls, mounted on the panel — painted to
    // match the actual in-game control colors (red joystick/hub, blue
    // buttons, chrome handles) rather than each cabinet's neon accent ----
    const redKnobMat = new THREE.MeshStandardMaterial({ color:0xff3b3b, emissive:0xff3b3b, emissiveIntensity:0.35, roughness:0.3 });
    const blueBtnMat = new THREE.MeshStandardMaterial({ color:0x3b8bff, emissive:0x3b8bff, emissiveIntensity:0.35, roughness:0.3 });
    const chromeMat = new THREE.MeshStandardMaterial({ color:0xc7ccd2, metalness:0.7, roughness:0.3 });
    const rimDarkMat = new THREE.MeshStandardMaterial({ color:0x2c2f34, metalness:0.3, roughness:0.65 });
    const darkMat = new THREE.MeshStandardMaterial({ color:0x141019, metalness:0.5, roughness:0.4 });

    function buildJoystick(x){
      const jg = new THREE.Group();
      jg.position.set(x, 0.05, 0);
      const b = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.08,0.03,16), darkMat);
      b.position.y = 0.015; jg.add(b);
      const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.014,0.014,0.18,8), new THREE.MeshStandardMaterial({ color:0x888888, metalness:0.7, roughness:0.3 }));
      stick.position.y = 0.1; jg.add(stick);

    function buildButton(x){
      const bg = new THREE.Group(); bg.position.set(x,0.05,0.05);
      const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,0.015,16), darkMat);
      ring.position.y=0.007; bg.add(ring);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.042,0.042,0.02,16), blueBtnMat);
      cap.position.y = 0.02; bg.add(cap);
      panel.add(bg);
    }
    function buildWheel(){
      const wg = new THREE.Group(); wg.position.set(0,0.24,0.2);
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.145,0.024,12,28), rimDarkMat);
      wg.add(rim);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.03,16), redKnobMat);
      hub.rotation.x = Math.PI/2; wg.add(hub);
      for(let s=0;s<3;s++){
        const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.15,0.02,0.02), rimDarkMat);
        spoke.rotation.z = (s*Math.PI*2)/3;
        wg.add(spoke);
      }
      panel.add(wg);
    }
    function buildPaddleTrack(){
      const pg = new THREE.Group(); pg.position.set(0,0.06,0.02);
      const track = new THREE.Mesh(new THREE.BoxGeometry(0.72,0.016,0.06), darkMat);
      pg.add(track);
      const handle = new THREE.Mesh(new THREE.BoxGeometry(0.17,0.035,0.08), chromeMat);
      handle.position.y = 0.026; pg.add(handle);
      panel.add(pg);
    }

    if(cab.ctl==='wheel'){
      buildWheel();
    } else if(cab.ctl==='paddle'){
      buildPaddleTrack();
    } else if(cab.ctl==='joy1'){
      buildJoystick(-0.3);
      buildButton(0.28);
    } else { // joy0
      buildJoystick(0);
    }

    group.userData.id = cab.id;
    base.userData.id = cab.id; upper.userData.id = cab.id; screen.userData.id = cab.id; marquee.userData.id = cab.id; marqueeFace.userData.id = cab.id; panel.userData.id = cab.id;
    clickable.push(base, upper, screen, marquee, marqueeFace, panel);
  });

  // ---- raycasting for tap/click, + drag-to-pan camera ----
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  function pick(clientX, clientY){
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((clientX-rect.left)/rect.width)*2-1;
    pointer.y = -((clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(clickable, false);
    if(hits.length){
      const id = hits[0].object.userData.id;
      if(id){ SFX.unlock(); SFX.cabinetSelect(); startGame(id); }
    }
  }

  const camRange = spacing*(n-1)/2 + 1.2; // lets every cabinet reach screen-center
  let camTargetX = 0, isDragging = false, dragStartClientX = 0, dragStartCamX = 0, dragMoved = 0, lastInteract = performance.now();

  renderer.domElement.addEventListener('pointerdown', e=>{
    isDragging = true; dragMoved = 0;
    dragStartClientX = e.clientX; dragStartCamX = camTargetX;
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener('pointermove', e=>{
    if(!isDragging) return;
    const dx = e.clientX - dragStartClientX;
    dragMoved = Math.max(dragMoved, Math.abs(dx));
    camTargetX = Math.max(-camRange, Math.min(camRange, dragStartCamX - dx*0.012));
    lastInteract = performance.now();
  });
  renderer.domElement.addEventListener('pointerup', e=>{
    isDragging = false;
    if(dragMoved < 6) pick(e.clientX, e.clientY); // treat as a tap, not a drag
    lastInteract = performance.now();
  });

  // ---- resize ----
  function onResize(){
    const w = container.clientWidth, h = container.clientHeight;
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  }
  window.addEventListener('resize', onResize);

  // ---- render loop: responsive drag-follow camera + gentle idle sway ----
  let t0 = performance.now(), running = true;
  function animate(t){
    if(!running) return;
    requestAnimationFrame(animate);
    const dt = (t-t0)/1000; t0=t;
    const idleFor = t - lastInteract;
    const sway = (!isDragging && idleFor>2500) ? Math.sin(t*0.00035)*0.5 : 0;
    const goal = camTargetX + sway;
    camera.position.x += (goal-camera.position.x) * (isDragging ? 0.35 : 0.12);
    camera.lookAt(camera.position.x*0.5, 1.5, 0);
    // marquees breathe gently, like warmed-up neon rather than a flat glow
    const breathe = 0.85 + 0.25*Math.sin(t*0.0012);
    for(const mm of marqueeMats) mm.emissiveIntensity = 1.1*breathe;
    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  // attract-mode screens redraw on a throttled timer (not every animation
  // frame — a 60fps canvas redraw for 5 small 2D scenes would be wasted
  // work). ~12fps is plenty smooth for these small, simple illustrations
  // and keeps the cost tiny; "INSERT COIN" blinks on its own slower beat.
  let blinkOn = true;
  let blinkAcc = 0;
  setInterval(()=>{
    if(!running) return;
    blinkAcc += 85;
    if(blinkAcc>=650){ blinkAcc=0; blinkOn=!blinkOn; }
    const t = performance.now()/1000;
    CABINETS.forEach(c=>refreshCabinetScreen(c.id, blinkOn, t));
  }, 85);

  hub3d = {
    pause(){ running=false; },
    resume(){ if(!running){ running=true; t0=performance.now(); requestAnimationFrame(animate); } },
    refreshScreen(id){ refreshCabinetScreen(id, blinkOn, performance.now()/1000); }
  };
  document.getElementById('hubLoading').style.display='none';
}

function resizeCanvas(){
  // Fill the whole cabinet screen edge-to-edge, exactly like the reference
  // (no letterboxing / black bars around the game). The internal drawing
  // buffer stays a fixed 360x520 logical grid so every game's coordinates
  // keep working unchanged; the CSS box is stretched to the container's
  // real size so it always covers 100% of the visible screen area.
  const wrap = document.getElementById('canvasWrap');
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  canvas.style.width = w+'px';
  canvas.style.height = h+'px';
  canvas.width = 360; canvas.height = 520;
  W=360; H=520;
}

  hudScore.textContent = 'SCORE: '+score;

/* ---------- Persistent per-cabinet high scores ---------- */
function getHighScore(id){
  try{ return parseInt(localStorage.getItem('neonArcadeHi_'+id)||'0',10) || 0; }catch(e){ return 0; }
}
function setHighScoreIfBetter(id, val){
  try{
    const cur = getHighScore(id);
    if(val>cur){ localStorage.setItem('neonArcadeHi_'+id, String(val)); return true; }
  }catch(e){}
  return false;
}

function showOverlay(title,text,btnLabel){
  setHighScoreIfBetter(currentGame, score);
  overTitle.textContent = title;
  overText.textContent = text;
  overBtn.textContent = btnLabel || 'ИГРАТЬ СНОВА';
  overlay.style.display='flex';
}

/* ---------- Control-scheme switching per cabinet ---------- */
function setControlScheme(kind){
  ctlJoystick.classList.add('hidden');
  ctlWheel.classList.add('hidden');
  ctlPaddle.classList.add('hidden');
  joyBtnCluster.innerHTML='';
  ctlJoystick.style.justifyContent='space-between';

  if(kind==='claw'){
    ctlJoystick.classList.remove('hidden');
    const b=document.createElement('div');
    b.className='actBtn btn-blue'; b.id='btnBeam';
    const mount=document.createElement('div');
    mount.className='actBtnMount'; mount.appendChild(b);
    joyBtnCluster.appendChild(mount);
    bindPressButton(b,'beam');
  } else if(kind==='maze'){
    ctlJoystick.classList.remove('hidden');
    ctlJoystick.style.justifyContent='center'; // no action button on this
                                                // cabinet, so center the
                                                // joystick instead of letting
                                                // it drift to the left edge
  } else if(kind==='shooter'){
    ctlJoystick.classList.remove('hidden');
    const b=document.createElement('div');
    b.className='actBtn btn-blue'; b.id='btnFire';
    const mount=document.createElement('div');
    mount.className='actBtnMount'; mount.appendChild(b);
    joyBtnCluster.appendChild(mount);
    bindPressButton(b,'fire');
  } else if(kind==='racing'){
    ctlWheel.classList.remove('hidden');
  } else if(kind==='brick'){
    ctlPaddle.classList.remove('hidden');
  }
}

function bindPressButton(el,name){
  const down=(e)=>{ e.preventDefault(); input[name]=true; el.style.transform='translateY(3px)'; };
  const up=(e)=>{ if(e)e.preventDefault(); input[name]=false; el.style.transform=''; };
  el.addEventListener('touchstart',down,{passive:false});
  el.addEventListener('touchend',up,{passive:false});
  el.addEventListener('mousedown',down);
  window.addEventListener('mouseup',up);
}

/* ---------- Joystick drag logic ---------- */
(function initJoystick(){
  let dragging=false;
  let touchId=null; // tracks the specific finger that grabbed the stick, so a
                     // second finger (e.g. holding FIRE/beam) never hijacks it
  let cachedRect=null; // cached at drag start — see wheel comment above
  function updateShaft(dx,dy,max){
    const dist = Math.hypot(dx,dy);
    const lean = 0.14 + (dist/max)*0.86; // resting nub -> full lean toward edge
    if(dist<0.5){ joyShaft.style.transform = `rotate(0deg) scaleY(0.14)`; return; }
    const angleDeg = Math.atan2(dy,dx)*180/Math.PI;
    joyShaft.style.transform = `rotate(${angleDeg-90}deg) scaleY(${lean})`;
  }
  function handleMove(clientX,clientY){
    const r = cachedRect || joyBase.getBoundingClientRect();
    const cx = r.left+r.width/2, cy = r.top+r.height/2;
    let dx = clientX-cx, dy=clientY-cy;
    const max = r.width/2 - 20;
    const dist = Math.hypot(dx,dy);
    if(dist>max){ dx = dx/dist*max; dy = dy/dist*max; }
    joyStick.style.left = (33+dx)+'px';
    joyStick.style.top = (33+dy)+'px';
    updateShaft(dx,dy,max);
    input.joy.x = dx/max; input.joy.y = dy/max; input.joy.active=true;
  }
  function reset(){
    dragging=false; touchId=null; input.joy.active=false; input.joy.x=0; input.joy.y=0;
    cachedRect=null;
    joyStick.style.left='33px'; joyStick.style.top='33px';
    joyShaft.style.transform = 'rotate(0deg) scaleY(0.14)';
  }
  joyBase.addEventListener('touchstart',e=>{
    e.preventDefault();
    const t=e.changedTouches[0];
    touchId = t.identifier;
    dragging=true; cachedRect=joyBase.getBoundingClientRect(); SFX.uiTick();
    handleMove(t.clientX,t.clientY);
  },{passive:false});
  joyBase.addEventListener('touchmove',e=>{
    if(!dragging) return;
    e.preventDefault();
    let t=null;
    for(let i=0;i<e.touches.length;i++){ if(e.touches[i].identifier===touchId){ t=e.touches[i]; break; } }
    if(!t) return; // our finger isn't in this event — ignore, don't snap to another touch
    handleMove(t.clientX,t.clientY);
  },{passive:false});
  joyBase.addEventListener('touchend',e=>{
    e.preventDefault();
    for(let i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===touchId){ reset(); break; }
    }
  },{passive:false});
  joyBase.addEventListener('touchcancel',e=>{
    e.preventDefault();
    for(let i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===touchId){ reset(); break; }
    }
  },{passive:false});
  joyBase.addEventListener('mousedown',e=>{ dragging=true; cachedRect=joyBase.getBoundingClientRect(); SFX.uiTick(); handleMove(e.clientX,e.clientY); });
  window.addEventListener('mousemove',e=>{ if(dragging && touchId===null) handleMove(e.clientX,e.clientY); });
  window.addEventListener('mouseup',()=>{ if(dragging && touchId===null) reset(); });
})();

/* ---------- Steering wheel drag logic ---------- */
(function initWheel(){
  let dragging=false, lastAngle=0, centerRAF=null;
  let cx=0, cy=0; // cached center — the wheel only rotates in place while
                  // dragging, so its screen center never moves; recomputing
                  // getBoundingClientRect() on every touchmove (expensive
                  // under the 3D-tilted panel) is what caused the jank.
  function angleFromPoint(clientX,clientY){
    return Math.atan2(clientY-cy, clientX-cx);
  }
  function start(clientX,clientY){
    const r = wheel.getBoundingClientRect();
    cx = r.left+r.width/2; cy = r.top+r.height/2;
    dragging=true; lastAngle=angleFromPoint(clientX,clientY);
    SFX.uiTick();
    if(centerRAF){ cancelAnimationFrame(centerRAF); centerRAF=null; }
  }
  function move(clientX,clientY){
    if(!dragging) return;
    const a = angleFromPoint(clientX,clientY);
    let delta = a-lastAngle;
    if(delta>Math.PI) delta-=2*Math.PI;
    if(delta<-Math.PI) delta+=2*Math.PI;
    input.wheelAngle += delta;
    input.wheelAngle = Math.max(-1.3,Math.min(1.3,input.wheelAngle));
    lastAngle = a;
    wheel.style.transform = `rotate(${input.wheelAngle}rad)`;
  }
  function end(){
    dragging=false;
    if(!centerRAF) centerRAF = requestAnimationFrame(springBack);
  }
  // eases the wheel back to dead-center once the finger lifts, instead of
  // staying wherever it was left
  function springBack(){
    input.wheelAngle *= 0.85;
    if(Math.abs(input.wheelAngle) < 0.01){ input.wheelAngle = 0; centerRAF = null; }
    else centerRAF = requestAnimationFrame(springBack);
    wheel.style.transform = `rotate(${input.wheelAngle}rad)`;
  }
  wheel.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:false});
  wheel.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.touches[0]; move(t.clientX,t.clientY); },{passive:false});
  wheel.addEventListener('touchend',e=>{ e.preventDefault(); end(); },{passive:false});
  wheel.addEventListener('mousedown',e=>start(e.clientX,e.clientY));
  window.addEventListener('mousemove',e=>{ if(dragging) move(e.clientX,e.clientY); });
  window.addEventListener('mouseup',end);


  // spring back toward center slowly each frame (applied in racing update)
})();

/* ---------- Paddle drag logic ---------- */
(function initPaddle(){
  let cachedRect=null;
  function setFromX(clientX){
    const r = cachedRect || paddleZone.getBoundingClientRect();
    let p = (clientX-r.left)/r.width;
    p = Math.max(0,Math.min(1,p));
    input.paddleX = p;
    paddleHandle.style.left = `calc(${p*100}% - 35px)`;
  }
  paddleZone.addEventListener('touchstart',e=>{ e.preventDefault(); cachedRect=paddleZone.getBoundingClientRect(); SFX.uiTick(); setFromX(e.touches[0].clientX); },{passive:false});
  paddleZone.addEventListener('touchmove',e=>{ e.preventDefault(); setFromX(e.touches[0].clientX); },{passive:false});
  paddleZone.addEventListener('touchend',()=>{ cachedRect=null; },{passive:false});
  paddleZone.addEventListener('mousedown',e=>{ cachedRect=paddleZone.getBoundingClientRect(); SFX.uiTick(); setFromX(e.clientX); });
  window.addEventListener('mousemove',e=>{ if(e.buttons===1) setFromX(e.clientX); });
  window.addEventListener('mouseup',()=>{ cachedRect=null; });
})();

/* =====================================================================
   GAME LAUNCHER
   ===================================================================== */
function startGame(id){
  currentGame = id;
  if(hub3d) hub3d.pause();
  hub.style.display='none';
  gameScreen.style.display='flex';
  resizeCanvas();
  SFX.musicStop();
  const kindMap = {claw:'claw',racing:'racing',maze:'maze',shooter:'shooter',brick:'brick'};
  setControlScheme(kindMap[id]);
  initGame(id);
}

function initGame(id){
  score=0; lives = (id==='claw')?5:3; prevLives = lives;
  setHUD(); hideOverlay();
  stopLoop();
  input.joy.x=0; input.joy.y=0; input.wheelAngle=0; input.paddleX=0.5;
  wheel.style.transform='rotate(0rad)';
  paddleHandle.style.left='calc(50% - 35px)';

  if(id==='claw') Claw.init();
  else if(id==='racing') Racing.init();
  else if(id==='maze') Maze.init();
  else if(id==='shooter') Shooter.init();
  else if(id==='brick') Brick.init();

  SFX.gameStart();
  loop();
}

let lastT=0;
function loop(t){
  raf = requestAnimationFrame(loop);
  const dt = Math.min(0.033, (t-lastT)/1000 || 0.016);
  lastT = t;
  ctx.clearRect(0,0,W,H);
  if(currentGame==='claw') Claw.update(dt), Claw.draw();
  else if(currentGame==='racing') Racing.update(dt), Racing.draw();
  else if(currentGame==='maze') Maze.update(dt), Maze.draw();
  else if(currentGame==='shooter') Shooter.update(dt), Shooter.draw();
  else if(currentGame==='brick') Brick.update(dt), Brick.draw();
}

/* =====================================================================
   PIXEL-ART SPRITE ENGINE — small bitmap grids drawn as solid blocks,
   scaled up with no smoothing, for a crisp retro look across all games.
   ===================================================================== */
function drawPixels(rows, x, y, px, palette, flipX){
  const w = rows[0].length;
  for(let ry=0; ry<rows.length; ry++){
    const row = rows[ry];
    for(let rx=0; rx<w; rx++){
      const ch = row[flipX ? w-1-rx : rx];
      if(ch==='.') continue;
      ctx.fillStyle = palette[ch];
      ctx.fillRect(Math.round(x+rx*px), Math.round(y+ry*px), px+0.5, px+0.5);
    }
  }
}
function pixelsSize(rows, px){ return { w: rows[0].length*px, h: rows.length*px }; }
function lerpColor(a,b,t){
  const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
  const ar=(pa>>16)&255, ag=(pa>>8)&255, ab=pa&255;
  const br=(pb>>16)&255, bg=(pb>>8)&255, bb=pb&255;
  const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), bl=Math.round(ab+(bb-ab)*t);
  return `rgb(${r},${g},${bl})`;
}
// lighten (amt>0) or darken (amt<0) a hex color — used to fake per-pixel
// shading (highlight/shadow tones) on sprites from a single base color
function shade(hex, amt){
  const n = parseInt(hex.replace('#',''),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if(amt>=0){ r+=(255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; }
  else { r+=r*amt; g+=g*amt; b+=b*amt; }
  r=Math.max(0,Math.min(255,Math.round(r))); g=Math.max(0,Math.min(255,Math.round(g))); b=Math.max(0,Math.min(255,Math.round(b)));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function hexToRgba(hex, a){
  const n = parseInt(hex.replace('#',''),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
// soft drop shadow drawn under a sprite before it's drawn — cheap but
// reads instantly as "grounded" instead of floating flat color
function drawShadow(cx, groundY, w, h){
  ctx.save();
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, groundY, w*0.42, h*0.16, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}
// directional car shadow: a soft blurred silhouette offset down-right,
// like the reference art (light from top-left) — not a flat ellipse
// stuck under the back bumper
function drawCarShadow(cx,cy,w,h,angle){
  ctx.save();
  ctx.translate(cx,cy);
  if(angle) ctx.rotate(angle);
  ctx.translate(w*0.16, h*0.14);
  ctx.filter = 'blur(5px)';
  ctx.globalAlpha = 0.4;
  drawRoundRect(-w*0.44,-h*0.47,w*0.88,h*0.94,w*0.32,'#000');
  ctx.restore();
}
function carPalette(base){
  return {
    D: shade(base,-0.55), b: shade(base,-0.12), B: shade(base,0.4),
    m: '#3a3a42', w:'#0a0f1a', W:'#2c5570', k:'#141414',
    y:'#ffe94d', t:'#ff3b3b'
  };
}
// smooth rounded top-down car (vector, not pixel-block) — matches the soft
// chibi-style silhouette of the reference art much better than hard grid pixels
function drawCarVector(cx,cy,w,h,bodyColor){
  const grad = ctx.createLinearGradient(cx-w/2,cy,cx+w/2,cy);
  grad.addColorStop(0, shade(bodyColor,-0.3));
  grad.addColorStop(0.5, shade(bodyColor,0.22));
  grad.addColorStop(1, shade(bodyColor,-0.3));
  drawCarBody(cx-w/2,cy-h/2,w,h, w*0.4, w*0.22, grad,'#1a1108',2.6);
  // wheels flush against the body edge (not poking out like legs)
  ctx.fillStyle='#181818';
  const ww=3, wh=h*0.15;
  drawRoundRect(cx-w/2-0.5, cy-h*0.3, ww, wh, 1, '#181818');
  drawRoundRect(cx+w/2-ww+0.5, cy-h*0.3, ww, wh, 1, '#181818');
  drawRoundRect(cx-w/2-0.5, cy+h*0.15, ww, wh, 1, '#181818');
  drawRoundRect(cx+w/2-ww+0.5, cy+h*0.15, ww, wh, 1, '#181818');
  // front bumper/grille line and rear bumper line
  ctx.strokeStyle='rgba(20,15,10,0.6)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx-w*0.32,cy-h*0.47); ctx.lineTo(cx+w*0.32,cy-h*0.47); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-w*0.32,cy+h*0.47); ctx.lineTo(cx+w*0.32,cy+h*0.47); ctx.stroke();
  // hood: two clean straight lines framing it (matching the reference),
  // no filled panel — a fill there was reading as a tapered "cone"
  // against the car's own curved nose
  ctx.strokeStyle='rgba(20,15,10,0.45)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(cx-w*0.34,cy-h*0.28); ctx.lineTo(cx+w*0.34,cy-h*0.28); ctx.stroke();
  // windshield
  const wsW=w*0.58, wsH=h*0.16, wsY=cy-h*0.16;
  const wg = ctx.createLinearGradient(cx,wsY-wsH/2,cx,wsY+wsH/2);
  wg.addColorStop(0,'#eef7ff'); wg.addColorStop(1,'#9fd0ee');
  drawRoundRect(cx-wsW/2,wsY-wsH/2,wsW,wsH,4,wg,'#1a1108',1.5);
  // side windows: thin tinted strips running along the cabin, between the
  // windshield and the rear window
  const sideY0=wsY+wsH/2+2, sideY1=cy+h*0.16;
  const sw = w*0.09;
  const sideGrad = ctx.createLinearGradient(0,sideY0,0,sideY1);
  sideGrad.addColorStop(0,'#8fc4e0'); sideGrad.addColorStop(1,'#3f6f8a');
  drawRoundRect(cx-w/2+ww+0.5, sideY0, sw, sideY1-sideY0, 2, sideGrad);
  drawRoundRect(cx+w/2-ww-0.5-sw, sideY0, sw, sideY1-sideY0, 2, sideGrad);
  // rear window, mirroring the windshield but smaller
  const rwW=w*0.46, rwH=h*0.12, rwY=cy+h*0.27;
  const rwg = ctx.createLinearGradient(cx,rwY-rwH/2,cx,rwY+rwH/2);
  rwg.addColorStop(0,'#9fd0ee'); rwg.addColorStop(1,'#eef7ff');
  drawRoundRect(cx-rwW/2,rwY-rwH/2,rwW,rwH,3,rwg,'#1a1108',1.3);
  // trunk seam below the rear window
  ctx.strokeStyle='rgba(20,15,10,0.4)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(cx-w*0.3,cy+h*0.36); ctx.lineTo(cx+w*0.3,cy+h*0.36); ctx.stroke();
  // small corner accent lights: yellow up front, red at the rear
  ctx.fillStyle='#ffe94d';
  ctx.beginPath(); ctx.arc(cx-w*0.36,cy-h*0.43,1.9,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+w*0.36,cy-h*0.43,1.9,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ff4d4d';
  ctx.beginPath(); ctx.arc(cx-w*0.36,cy+h*0.43,1.9,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+w*0.36,cy+h*0.43,1.9,0,Math.PI*2); ctx.fill();
  // gloss highlight
  ctx.save(); ctx.globalAlpha=0.22;
  ctx.beginPath(); ctx.ellipse(cx-w*0.14,cy-h*0.05,w*0.14,h*0.3,-0.2,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
}

let CAR_IMG_READY = false;
CAR_IMG.onload = () => { CAR_IMG_READY = true; };
function drawCarPhoto(cx,cy,w,h,tintColor){
  if(!CAR_IMG_READY){ drawCarVector(cx,cy,w,h,tintColor||'#e0332a'); return; }
  const iw = CAR_IMG.width, ih = CAR_IMG.height;
  const scale = h / ih;
  const dw = iw*scale, dh = h;
  ctx.save();
  if(tintColor){
    // offscreen buffer so the hue-shift only touches this car's own pixels
    const off = document.createElement('canvas');
    off.width = Math.ceil(dw); off.height = Math.ceil(dh);
    const octx = off.getContext('2d');
    octx.drawImage(CAR_IMG, 0, 0, dw, dh);
    octx.globalCompositeOperation = 'hue';
    octx.fillStyle = tintColor;
    octx.fillRect(0,0,dw,dh);
    octx.globalCompositeOperation = 'destination-in';
    octx.drawImage(CAR_IMG, 0, 0, dw, dh);
    ctx.drawImage(off, cx-dw/2, cy-dh/2, dw, dh);
  } else {
    ctx.drawImage(CAR_IMG, cx-dw/2, cy-dh/2, dw, dh);
  }
  ctx.restore();
}
// the photo's real on-screen width depends on the image's own aspect
// ratio (only `h` actually drives the scale in drawCarPhoto above) — the
// headlight beams need this true width, not the nominal lane-width value,
// or they land offset from the actual headlights
function carPhotoWidth(h){
  return CAR_IMG_READY ? CAR_IMG.width*(h/CAR_IMG.height) : h*0.6;
}
// headlight beams — shared by the player car and every NPC car, since
// it's night for everyone on the road, not just the player
function drawHeadlightBeams(cx,frontY,w,nightT,strength){
  if(nightT<=0.12) return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha = Math.min(1,nightT/0.7)*strength;
  const y1=frontY, y2=frontY-85;
  const beam = ctx.createLinearGradient(cx,y1,cx,y2);
  beam.addColorStop(0,'rgba(255,244,200,0.6)');
  beam.addColorStop(0.4,'rgba(255,244,200,0.28)');
  beam.addColorStop(1,'rgba(255,244,200,0)');
  ctx.fillStyle=beam;
  // measured from the actual sprite: headlights sit at ~0.33 of the car's
  // width out from the centerline, not an eyeballed 0.3
  [-1,1].forEach(side=>{
    const bx = cx+side*w*0.33;
    ctx.beginPath();
    ctx.moveTo(bx-side*2.5,y1);
    ctx.lineTo(bx+side*2.5,y1);
    ctx.lineTo(bx+side*24,y2);
    ctx.lineTo(bx+side*6,y2);
    ctx.closePath(); ctx.fill();
  });
  ctx.restore();
}

/* ---- smooth "kawaii" vector prize icons (Claw Machine), thick outline +
   glossy highlight, in the style of cute mobile claw-machine games ---- */
function drawRoundRect(x,y,w,h,r,fill,outline,lw){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  if(outline){ ctx.lineWidth=lw||2; ctx.strokeStyle=outline; ctx.stroke(); }
}
// like drawRoundRect but with a rounder nose and a slightly squarer tail —
// this asymmetry is what makes a shape read as "car" instead of "brick"
function drawCarBody(x,y,w,h,topR,botR,fill,outline,lw){
  ctx.beginPath();
  ctx.moveTo(x+topR,y);
  ctx.arcTo(x+w,y,x+w,y+topR,topR);
  ctx.lineTo(x+w,y+h-botR);
  ctx.arcTo(x+w,y+h,x+w-botR,y+h,botR);
  ctx.lineTo(x+botR,y+h);
  ctx.arcTo(x,y+h,x,y+h-botR,botR);
  ctx.lineTo(x,y+topR);
  ctx.arcTo(x,y,x+topR,y,topR);
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  if(outline){ ctx.lineWidth=lw||2; ctx.strokeStyle=outline; ctx.stroke(); }
}
function drawGloss(x,y,r){
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(x-r*0.35,y-r*0.42,r*0.26,r*0.15,-0.5,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fill();
  ctx.restore();
}
function drawBallPrize(x,y,r,base,groundY){
  drawShadow(x,groundY,r*2,8);
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=base; ctx.fill();
  ctx.lineWidth=Math.max(2,r*0.14); ctx.strokeStyle='#2a1508'; ctx.stroke();
  ctx.strokeStyle='rgba(42,21,8,0.75)'; ctx.lineWidth=Math.max(1.5,r*0.09);
  ctx.beginPath(); ctx.moveTo(x-r,y); ctx.lineTo(x+r,y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x,y+r); ctx.stroke();
  ctx.beginPath(); ctx.arc(x,y,r*0.72,0.35,2.8); ctx.stroke();
  drawGloss(x,y,r);
}
function drawGemPrize(x,y,r,base,groundY){
  drawShadow(x,groundY,r*2,8);
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=base; ctx.fill();
  ctx.lineWidth=Math.max(2,r*0.14); ctx.strokeStyle='#2a1508'; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1.4;
  for(let i=0;i<5;i++){
    const a=i*(Math.PI*2/5)-Math.PI/2;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(a)*r*0.88,y+Math.sin(a)*r*0.88); ctx.stroke();
  }
  drawGloss(x,y,r);
  ctx.fillStyle='#fff';
  ctx.beginPath();
  ctx.moveTo(x+r*0.42,y-r*0.55); ctx.lineTo(x+r*0.5,y-r*0.4); ctx.lineTo(x+r*0.65,y-r*0.46); ctx.lineTo(x+r*0.5,y-r*0.32);
  ctx.closePath(); ctx.fill();
}
function drawCubePrize(x,y,s,groundY){
  drawShadow(x,groundY,s*1.2,8);
  const colors=['#ff5a5a','#ffb62d','#3dff8a','#2de3ff','#ff2ea6','#fff2c9'];
  drawRoundRect(x-s/2,y-s/2,s,s,6,'#f0f0f0','#2a1508',3);
  const cell=s/3;
  for(let r=0;r<3;r++) for(let c=0;c<3;c++){
    ctx.fillStyle=colors[(r*3+c)%colors.length];
    drawRoundRect(x-s/2+c*cell+2,y-s/2+r*cell+2,cell-4,cell-4,2,colors[(r*3+c)%colors.length]);
  }
  ctx.lineWidth=3; ctx.strokeStyle='#2a1508'; ctx.strokeRect(x-s/2,y-s/2,s,s);
}
// diagonal light/dark gradient composited ONLY onto the pixels just drawn
// (source-atop) — turns any flat sprite into a lit, rounded-looking one
// without hand-authoring shading into every bitmap
function shadeOverlay(x,y,w,h){
  ctx.save();
  ctx.globalCompositeOperation = 'source-atop';
  const g = ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,'rgba(255,255,255,0.30)');
  g.addColorStop(0.5,'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(0,0,0,0.30)');
  ctx.fillStyle=g;
  ctx.fillRect(x,y,w,h);
  ctx.restore();
}
function drawSprite(rows,x,y,px,palette,flipX){
  // dark 1px outline underneath (draw the silhouette 4x offset in near-black,
  // then the real colors on top) — this single trick is what makes tiny
  // sprites read as "designed" instead of stray colored squares
  const outlinePal = {};
  for(const k in palette) outlinePal[k] = 'rgba(5,3,10,0.95)';
  drawPixels(rows, x-1, y,   px, outlinePal, flipX);
  drawPixels(rows, x+1, y,   px, outlinePal, flipX);
  drawPixels(rows, x,   y-1, px, outlinePal, flipX);
  drawPixels(rows, x,   y+1, px, outlinePal, flipX);
  drawPixels(rows,x,y,px,palette,flipX);
  const sz = pixelsSize(rows,px);
  shadeOverlay(x,y,sz.w,sz.h);
}

// visual rank tiers for the saucer — cosmetic upgrades that layer onto the
// existing hull as the player abducts more cows across the (endless) game
const SHIP_TIERS = [
  { at:0,   name:null },
  { at:10,  name:'РАЗВЕДЧИК' },
  { at:25,  name:'ОХОТНИК' },
  { at:50,  name:'КОММАНДОР' },
  { at:100, name:'ЛЕГЕНДА' },
];
const Claw = {
  ufo:{x:180,y:110,w:64,h:34}, beam:false, beamHeat:0, overheated:false,
  hitCd:0, cows:[], farmer:null, dog:null, tractor:null, projectiles:[],
  particles:[], stars:[], moonX:60, moonY:70, abducted:0, spawnCd:0, t:0,
  W:360, H:520, groundY:486,
  // combo and temporary beam upgrades
  combo:0, powerups:[], powerupCd:0,
  beamWideT:0, beamFastT:0, popups:[], shipTier:0,

    this.combo=0;
    this.powerups=[]; this.powerupCd=this.rand(10,16);
    this.beamWideT=0; this.beamFastT=0; this.popups=[]; this.shipTier=0;
    this.cows = [this.makeCow(), this.makeCow(), this.makeCow()];
    this.farmer = { x:80, y:452, vx:34, throwCd:2.2, hitFlash:0, throwing:false, throwT:0, throwDur:0.55, thrown:false };
    this.dog    = { x:260, y:440, vx:-26, barkCd:3.5, barking:0 };
    this.tractor= { x:-40, y:470, vx:22, smoke:0 };
    this.projectiles = []; this.particles = [];
    this.stars = [];
    for(let i=0;i<38;i++){

    }
