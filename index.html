  },

  spark(x,y,color,n){
    n = n||8;
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2, sp=this.rand(30,110);
      this.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.4+Math.random()*0.3,age:0,color});
    }
  },

  hurt(){
    if(this.hitCd>0) return;
    this.hitCd = 1.1;
    this.flashT = 0.28;
    this.combo = 0;
    lives--; setHUD();
    SFX.hit();
    this.spark(this.ufo.x,this.ufo.y,'#ff5a5a',14);
    if(lives<=0){
      SFX.gameOver();
      showOverlay('ИГРА ОКОНЧЕНА','Похищено коров: '+this.abducted+'  •  Счёт: '+score);
      stopLoop();
    }
  },

  update(dt){
    this.t += dt;
    if(this.hitCd>0) this.hitCd -= dt;
    if(this.flashT>0) this.flashT -= dt;

    // --- ship movement (full 2D flight via joystick) ---
    this.ufo.x += input.joy.x*170*dt;
    this.ufo.y += input.joy.y*140*dt;
    this.ufo.x = Math.max(30, Math.min(this.W-30, this.ufo.x));
    this.ufo.y = Math.max(50, Math.min(this.groundY-14, this.ufo.y));

    // --- tractor beam heat ---
    const beamWasOn = this.beam;
    this.beam = !!input.beam && !this.overheated;
    if(this.beam){
      const wasOverheated = this.overheated;
      this.beamHeat = Math.min(100, this.beamHeat + dt*16);
      SFX.beamStart(300 + this.beamHeat*1.6, 620 + this.beamHeat*4.5); // softer at rest, brightens as it charges up
      if(this.beamHeat>=100){ this.overheated=true; if(!wasOverheated) SFX.overheat(); }
    } else {
      if(beamWasOn) SFX.beamStop();
      this.beamHeat = Math.max(0, this.beamHeat - dt*26);
      if(this.overheated && this.beamHeat<=0) this.overheated=false;
    }

    // --- farmer: patrols, winds up and throws pitchforks upward ---
    const f=this.farmer;
    f.x += f.vx*dt;
    if(f.x<28||f.x>332){ f.vx*=-1; f.x=Math.max(28,Math.min(332,f.x)); }
    if(f.hitFlash>0) f.hitFlash-=dt;

    if(!f.throwing){
      f.throwCd -= dt;
      if(f.throwCd<=0){ f.throwing=true; f.throwT=0; f.thrown=false; }
    } else {
      f.throwT += dt;
      // release the fork at the peak of the forward swing, not at the start
      if(!f.thrown && f.throwT>=f.throwDur*0.72){
        f.thrown = true;
        const dx = this.ufo.x-f.x, dist=Math.max(60,Math.hypot(dx,f.y-this.ufo.y));
        this.projectiles.push({ x:f.x+14, y:f.y-30, vx:dx/dist*70, vy:-190, kind:'fork' });
        SFX.throwFork();
      }
      if(f.throwT>=f.throwDur){ f.throwing=false; f.throwCd=this.rand(1.6,2.6); }
    }
    // farmer collides with low-flying ship
    if(this.ufo.y>f.y-40 && Math.hypot(this.ufo.x-f.x,this.ufo.y-f.y)<34){ SFX.farmerBonk(); this.hurt(); }

    // --- dog: patrols, barks and panics nearby cows ---
    const d=this.dog;
    d.x += d.vx*dt;
    if(d.x<24||d.x>336){ d.vx*=-1; d.x=Math.max(24,Math.min(336,d.x)); }
    d.barkCd -= dt;
    if(d.barking>0) d.barking-=dt;
    if(d.barkCd<=0){
      d.barkCd = this.rand(3.2,5);
      d.barking = 0.9;
      SFX.bark();
      for(const c of this.cows){
        if(Math.abs(c.x-d.x)<130) c.panic = 2.2;
      }
    }
    if(this.ufo.y>d.y-36 && Math.hypot(this.ufo.x-d.x,this.ufo.y-d.y)<26) this.hurt();

    // --- tractor: slow heavy vehicle, immune to the beam ---
    const tr=this.tractor;
    tr.x += tr.vx*dt;
    if(tr.x>400){ tr.x=-60; }
    const trDist = Math.hypot(this.ufo.x-tr.x, this.ufo.y-tr.y);
    SFX.tractorRumble(trDist<160); // faint engine rumble when the UFO is near it
    if(this.ufo.y>tr.y-46 && trDist<40) this.hurt();
    if(this.beam && Math.abs(tr.x-this.ufo.x)<30 && tr.y>this.ufo.y){
      this.beamHeat = 100; this.overheated = true;
      this.spark(tr.x, tr.y-20, '#ffb62d', 4);
    }

    // fences at the field edges — don't clip them at low altitude
    const fenceHit = (this.ufo.y>420) && (this.ufo.x<48 || this.ufo.x>312);
    if(fenceHit) this.hurt();

    // --- projectiles ---
    for(const p of this.projectiles){
      p.x += p.vx*dt; p.y += p.vy*dt;
      if(Math.hypot(p.x-this.ufo.x,p.y-this.ufo.y)<20 && this.hitCd<=0){
        this.hurt(); p.dead=true;
      }
    }
    this.projectiles = this.projectiles.filter(p=>!p.dead && p.y>-20);

    // --- cows: wander, panic, get captured ---
    this.spawnCd -= dt;
    for(const c of this.cows){
      if(c.gone) continue;
      if(c.panic>0) c.panic -= dt;
      const speedMul = c.panic>0 ? 2.6 : 1;
      c.phase += dt;
      c.x += c.vx*speedMul*dt;
      if(c.x<30||c.x>330){ c.vx*=-1; c.x=Math.max(30,Math.min(330,c.x)); }

      const dx = Math.abs(c.x-this.ufo.x);
      const beamRadius = this.beamWideT>0 ? 55 : 30;
      const inBeam = this.beam && dx<beamRadius && c.y>this.ufo.y;
      if(inBeam){
        const rateBase = c.panic>0 ? 0.42 : 0.72;
        const rate = rateBase * (this.beamFastT>0 ? 1.8 : 1);
        c.captureT = Math.min(1, c.captureT + dt*rate);
        c.x += (this.ufo.x-c.x)*Math.min(1,dt*2.2);
        c.y -= 46*dt;
        c.vy = 0;
      } else {
        // beam let go mid-lift: the cow drops straight back down and
        // has to be captured completely from scratch
        if(c.captureT>0) c.captureT = 0;
        c.vy = (c.vy||0) + 320*dt;
        c.y = Math.min(c.restY, c.y + c.vy*dt);
        if(c.y>=c.restY){ c.y=c.restY; c.vy=0; }
      }

      if(c.captureT>=1){
        c.gone = true;
        this.combo++;
        const mult = Math.min(3, 1 + Math.floor(this.combo/3)*0.5);
        const gained = Math.round(100*mult);
        score += gained; this.abducted++;
        SFX.abduct();
        this.spark(this.ufo.x,this.ufo.y+10,'#7de8ff',16);
        this.popups.push({
          x:this.ufo.x, y:this.ufo.y-24, age:0, life:0.9,
          text:(this.combo>=3?('x'+mult.toFixed(1)+'  '):'')+'+'+gained,
          color:this.combo>=3?'#ffd24d':'#7de8ff'
        });
        // ship rank-up: a cosmetic milestone — the saucer gains a new
        // visual detail, no gameplay interruption
        const newTier = SHIP_TIERS.reduce((acc,t,i)=> this.abducted>=t.at ? i : acc, 0);
        if(newTier>this.shipTier){
          this.shipTier = newTier;
          SFX.quota();
          this.popups.push({
            x:this.ufo.x, y:this.ufo.y-46, age:0, life:2.2,
            text:'КОРАБЛЬ УЛУЧШЕН: '+SHIP_TIERS[newTier].name,
            color:'#ffd24d'
          });
        }
        setHUD();
      }
    }
    this.cows = this.cows.filter(c=>!c.gone);
    if(this.cows.length<3 && this.spawnCd<=0){
      this.spawnCd = 1.1;
      this.cows.push(this.makeCow());
    }

    // --- power-ups: falling pickups that temporarily widen or speed up the beam ---
    this.powerupCd -= dt;
    if(this.powerupCd<=0 && this.powerups.length===0){
      this.powerupCd = this.rand(16,22);
      const type = Math.random()<0.5 ? 'wide' : 'fast';
      this.powerups.push({ x:this.rand(50,310), y:-20, vy:this.rand(40,55), type, t:0 });
    }
    for(const p of this.powerups){
      p.t += dt; p.y += p.vy*dt;
      if(!p.dead && Math.hypot(p.x-this.ufo.x,p.y-this.ufo.y)<32){
        p.dead = true;
        if(p.type==='wide') this.beamWideT = 10; else this.beamFastT = 10;
        SFX.powerup();
        this.spark(p.x,p.y, p.type==='wide'?'#2de3ff':'#ffd24d', 12);
        this.popups.push({
          x:this.ufo.x, y:this.ufo.y-30, age:0, life:1.2,
          text:p.type==='wide'?'ШИРЕ ЛУЧ!':'БЫСТРЫЙ ЛУЧ!',
          color:p.type==='wide'?'#2de3ff':'#ffd24d'
        });
      }
    }
    this.powerups = this.powerups.filter(p=>!p.dead && p.y<this.H+20);
    if(this.beamWideT>0) this.beamWideT = Math.max(0,this.beamWideT-dt);
    if(this.beamFastT>0) this.beamFastT = Math.max(0,this.beamFastT-dt);

    // --- floating popups (combo/score text) ---
    for(const p of this.popups) p.age += dt;
    this.popups = this.popups.filter(p=>p.age<p.life);

    // --- ambient particles ---
    for(const p of this.particles){ p.age+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=200*dt; }
    this.particles = this.particles.filter(p=>p.age<p.life);

    input.beam = input.beam; // held button — no reset needed
  },

  drawMoonAndStars(){
    const g = ctx.createLinearGradient(0,0,0,this.H);
    g.addColorStop(0,'#141033'); g.addColorStop(0.55,'#231c4a'); g.addColorStop(1,'#3a2e63');
    ctx.fillStyle=g; ctx.fillRect(0,0,this.W,this.H);
    for(const s of this.stars){
      const a = 0.4+0.4*Math.abs(Math.sin(this.t*1.4+s.tw));
      ctx.globalAlpha=a; ctx.fillStyle='#fff';
      ctx.fillRect(s.x, s.y, s.r*2, s.r*2);
    }

    const mg = ctx.createRadialGradient(this.moonX-8,this.moonY-8,2,this.moonX,this.moonY,42);
    mg.addColorStop(0,'#e7e6ef'); mg.addColorStop(1,'#9a97b3');
    ctx.beginPath(); ctx.arc(this.moonX,this.moonY,42,0,Math.PI*2); ctx.fillStyle=mg; ctx.fill();
    ctx.globalAlpha=0.25; ctx.fillStyle='#7c7996';
    [[-14,-10,9],[10,6,6],[-4,16,5]].forEach(([ox,oy,r])=>{
      ctx.beginPath(); ctx.arc(this.moonX+ox,this.moonY+oy,r,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
  },

  drawHorizon(){
    // distant rolling hills silhouette, two layers for depth
    const hy = 300;
    ctx.fillStyle = '#241c46';
    ctx.beginPath();
    ctx.moveTo(0,hy+18);
    ctx.lineTo(0,hy+2);
    ctx.quadraticCurveTo(55,hy-20, 120,hy-6);
    ctx.quadraticCurveTo(190,hy+8, 250,hy-16);
    ctx.quadraticCurveTo(310,hy-30, this.W,hy-6);
    ctx.lineTo(this.W,hy+18);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#2c2456';
    ctx.beginPath();
    ctx.moveTo(0,hy+26);
    ctx.lineTo(0,hy+14);
    ctx.quadraticCurveTo(90,hy-2,165,hy+12);
    ctx.quadraticCurveTo(240,hy+24,this.W,hy+8);
    ctx.lineTo(this.W,hy+26);
    ctx.closePath(); ctx.fill();

    // small pine trees clustered on the left of the horizon
    const pine=(px,py,sc)=>{
      ctx.fillStyle='#152a1e';
      ctx.beginPath(); ctx.moveTo(px,py-17*sc); ctx.lineTo(px-8*sc,py-1*sc); ctx.lineTo(px+8*sc,py-1*sc); ctx.closePath(); ctx.fill();

  drawField(){
    const fg = ctx.createLinearGradient(0,300,0,this.H);
    fg.addColorStop(0,'#2b2350'); fg.addColorStop(1,'#171233');
    ctx.fillStyle=fg; ctx.fillRect(0,300,this.W,this.H-300);
    this.drawHorizon();
    ctx.fillStyle='rgba(255,255,255,.05)';
    for(let x=0;x<this.W;x+=18) ctx.fillRect(x,this.groundY+2,10,2);
    // small wooden fence posts near each edge — short, and the rails run
    // straight off the edge of the screen so the fence reads as continuing
    // beyond view rather than floating as an isolated island
    [14,346].forEach(fx=>{
      const outDir = fx<180 ? -1 : 1; // toward the screen edge (off-canvas)
      const inDir = -outDir;          // short stub back toward the field

      const postGrad = ctx.createLinearGradient(fx-3.5,0,fx+3.5,0);
      postGrad.addColorStop(0,'#6b5a3e'); postGrad.addColorStop(0.45,'#9a8560'); postGrad.addColorStop(1,'#6b5a3e');
      ctx.fillStyle=postGrad; ctx.fillRect(fx-3.5,436,7,36);
      ctx.strokeStyle='#3a3020'; ctx.lineWidth=1.1; ctx.strokeRect(fx-3.5,436,7,36);
      ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(fx-3.5,436,2,36);

      [[444,448],[462,466]].forEach(([ry1,ry2])=>{
        [ry1,ry2].forEach(ry=>{
          ctx.strokeStyle='#8a7550'; ctx.lineWidth=3; ctx.lineCap='butt';
          // short rail stub toward the field
          ctx.beginPath(); ctx.moveTo(fx+inDir*3.5,ry); ctx.lineTo(fx+inDir*22,ry); ctx.stroke();
          // rail running off the edge of the canvas
          ctx.beginPath(); ctx.moveTo(fx+outDir*3.5,ry); ctx.lineTo(fx+outDir*40,ry); ctx.stroke();
          ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=0.8;
          ctx.beginPath(); ctx.moveTo(fx-22,ry-1.2); ctx.lineTo(fx+22,ry-1.2); ctx.stroke();
        });
      });
    });
  },

  drawCow(c){
    if(c.captureT>0){ ctx.save(); ctx.globalAlpha = 1-c.captureT*0.3; }
    const bob = Math.sin(c.phase*3)*1.4;
    const x=c.x, y=c.y+bob, flip = c.vx<0?-1:1;
    drawShadow(x, c.restY+16, 38, 10);

    ctx.save(); ctx.translate(x,y); ctx.scale(flip,1);

    const bodyCol = '#faf6ea';

    // legs with a light walk cycle, dark hooves
    const swing = Math.sin(c.phase*5)*2.6;
    ctx.fillStyle='#33293f';
    [[-12,swing],[-4,-swing],[4,swing],[12,-swing]].forEach(([lx,off])=>{
      ctx.fillRect(lx-1.6,7+Math.max(0,off*0.4),3.2,9);
    });
    ctx.fillStyle='#1b1626';
    [-12,-4,4,12].forEach(lx=>ctx.fillRect(lx-2,15.5,4,2.4));

    // tail
    ctx.strokeStyle='#33293f'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-18,-4); ctx.quadraticCurveTo(-25,-1+Math.sin(this.t*4)*2,-23,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(-23,8,1.7,0,Math.PI*2); ctx.fillStyle='#33293f'; ctx.fill();

    // body with soft shading
    const bg = ctx.createLinearGradient(0,-11,0,10);
    bg.addColorStop(0, bodyCol); bg.addColorStop(1, shade(bodyCol,-0.12));
    drawRoundRect(-19,-11,38,21,10,bg,'#33293f',2);

    // Holstein-style black patches, positioned safely inside the body outline
    ctx.fillStyle='#332a3f';
    ctx.beginPath(); ctx.ellipse(-8,-3,5.6,4.6,0.15,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6,4,5,3.6,-0.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-1,7,3.2,2.4,0.1,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12,-6,3.1,2.4,0.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-14,3,2.6,2.1,0.2,0,Math.PI*2); ctx.fill();

    // belly highlight
    ctx.fillStyle='rgba(255,255,255,.18)';
    ctx.beginPath(); ctx.ellipse(-2,-7,12,3,0,0,Math.PI*2); ctx.fill();

    // neck + head
    drawRoundRect(14,-17,16,15,6,bodyCol,'#33293f',2);
    // snout
    drawRoundRect(24,-8,10,8,3,'#f0c6b8','#33293f',1.4);
    ctx.fillStyle='#33293f';
    ctx.beginPath(); ctx.arc(27.5,-4.5,0.9,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(31.5,-4.5,0.9,0,Math.PI*2); ctx.fill();
    // eye with catchlight
    ctx.fillStyle='#221b2c'; ctx.beginPath(); ctx.ellipse(22.5,-11,1.8,2.2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(23.2,-11.8,0.7,0,Math.PI*2); ctx.fill();
    // ear
    ctx.fillStyle='#f0a6b4';
    ctx.beginPath(); ctx.ellipse(16,-16,3.2,2,0.3,0,Math.PI*2); ctx.fill();
    // small horns + black patch on head/ear
    ctx.strokeStyle='#e8d9b0'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(18,-18); ctx.lineTo(15,-23); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(25,-18); ctx.lineTo(28,-23); ctx.stroke();
    ctx.fillStyle='#332a3f';
    ctx.beginPath(); ctx.ellipse(28,-14,4,3.6,0.2,0,Math.PI*2); ctx.fill();

    ctx.restore();

    if(c.panic>0){
      ctx.fillStyle='#ffde59'; ctx.font='bold 11px monospace'; ctx.textAlign='center';
      ctx.fillText('!', x, y-26);
      ctx.textAlign='left';
    }
    if(c.captureT>0){
      drawRoundRect(x-16,y-30,32,5,2,'#0a0a0a','#3a3350',1);
      ctx.fillStyle = '#2de3ff';
      ctx.fillRect(x-15,y-29,30*c.captureT,3);
    }
    if(c.captureT>0) ctx.restore();
  },

  drawFarmer(){
    const f=this.farmer, x=f.x, y=f.y, flip=f.vx<0?-1:1;
    drawShadow(x,y+24,30,8);
    const flash = f.hitFlash>0;
    ctx.save(); ctx.translate(x,y); ctx.scale(flip,1);

    // walking legs + boots
    const swing = Math.sin(this.t*7)*4;
    ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-3,8); ctx.lineTo(-3+swing,19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3,8); ctx.lineTo(3-swing,19); ctx.stroke();
    ctx.fillStyle='#241a10';
    ctx.beginPath(); ctx.ellipse(-3+swing,20.5,3.2,2,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3-swing,20.5,3.2,2,0,0,Math.PI*2); ctx.fill();

    // back arm swings opposite the legs for a natural walk cycle
    const overallsCol = flash ? '#ff8a8a' : '#3b6bd6';
    ctx.strokeStyle=overallsCol; ctx.lineWidth=4.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-7,-3); ctx.lineTo(-13-swing*0.6,4+swing*0.25); ctx.stroke();

    // overalls body with straps and pocket
    const bg = ctx.createLinearGradient(0,-9,0,10);
    bg.addColorStop(0, shade(overallsCol,0.15)); bg.addColorStop(1, shade(overallsCol,-0.2));
    drawRoundRect(-9,-9,18,19,5,bg,'#101033',2);
    ctx.strokeStyle=shade(overallsCol,-0.3); ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(-5,-9); ctx.lineTo(-5,-14); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5,-9); ctx.lineTo(5,-14); ctx.stroke();
    ctx.strokeStyle=shade(overallsCol,-0.35); ctx.lineWidth=1.4;
    ctx.strokeRect(-5,0,6,5);
    ctx.fillStyle='rgba(255,255,255,.15)';
    ctx.fillRect(-7,-8,3,17);

    // throw phase → rotation angle for the whole arm+pitchfork, pivoting at
    // the shoulder: pull back for the windup, then snap forward to release
    let throwAngle = 0;
    if(f.throwing){
      const p = Math.min(1, f.throwT/f.throwDur);
      if(p<0.55){
        const t=p/0.55; throwAngle = -0.95*(1-Math.pow(1-t,2));
      } else if(p<0.72){
        const t=(p-0.55)/0.17; throwAngle = -0.95 + 2.05*Math.min(1,t);
      } else {
        const t=(p-0.72)/0.28; throwAngle = 1.1*(1-Math.min(1,t));
      }
    }

    // front arm + pitchfork, rotated as one unit around the shoulder joint
    ctx.save();
    ctx.translate(8,-4); ctx.rotate(throwAngle); ctx.translate(-8,4);

    // upper arm + forearm (bent at the elbow), fist gripping the shaft
    ctx.strokeStyle=overallsCol; ctx.lineWidth=4.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(8,-4); ctx.lineTo(13,-10); ctx.stroke();
    ctx.strokeStyle='#e8b98a'; ctx.lineWidth=3.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(13,-10); ctx.lineTo(17,-15); ctx.stroke();
    ctx.fillStyle='#e8b98a'; ctx.beginPath(); ctx.arc(17,-15,2.7,0,Math.PI*2); ctx.fill();

    // pitchfork: shaft runs through the fist, a short butt below the grip
    // and a long haft up to the tines, so it reads as held rather than glued on
    ctx.strokeStyle='#8a6a3a'; ctx.lineWidth=2.3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(14,-9); ctx.lineTo(17,-15); ctx.lineTo(23.5,-33); ctx.stroke();
    // crossbar at the base of the tines
    ctx.strokeStyle='#9a9aa4'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(19.5,-34); ctx.lineTo(27,-34); ctx.stroke();
    // four fanned tines
    ctx.strokeStyle='#d3d3da'; ctx.lineWidth=1.5; ctx.lineCap='round';
    [-4,-1.4,1.4,4].forEach(o=>{
      ctx.beginPath(); ctx.moveTo(23.5+o*0.6,-33); ctx.lineTo(23.5+o,-41); ctx.stroke();
    });
    ctx.restore();

    // head
    ctx.fillStyle='#e8b98a';
    ctx.beginPath(); ctx.arc(0,-15,7.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.08)';
    ctx.beginPath(); ctx.ellipse(2,-13,4,5,0,0,Math.PI*2); ctx.fill();
    // angry brows + eyes
    ctx.strokeStyle='#5a3a20'; ctx.lineWidth=1.7; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-4.5,-18); ctx.lineTo(-1,-16.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4.5,-18); ctx.lineTo(1,-16.4); ctx.stroke();
    ctx.fillStyle='#2a1810';
    ctx.beginPath(); ctx.arc(-2,-15,0.9,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(2,-15,0.9,0,Math.PI*2); ctx.fill();
    // frown
    ctx.strokeStyle='#8a5a3a'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.arc(0,-9,2.4,0.2,Math.PI-0.2); ctx.stroke();

    // straw hat
    ctx.fillStyle='#d8a94a';
    drawRoundRect(-10,-23,20,5,2.4,'#d8a94a','#8a6a2a',1.4);
    drawRoundRect(-4.5,-29,9,7,3.5,'#e6bc63','#8a6a2a',1.4);

    ctx.restore();
  },

  drawDog(){
    const d=this.dog, x=d.x, y=d.y, flip=d.vx<0?-1:1;
    drawShadow(x,y+11,26,7);
    ctx.save(); ctx.translate(x,y); ctx.scale(flip,1);

    // wagging tail
    const wag = Math.sin(this.t*11)*9;
    ctx.strokeStyle='#8a5a34'; ctx.lineWidth=3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-11,-2); ctx.quadraticCurveTo(-18,-6+wag*0.35,-16,-13); ctx.stroke();

    // legs
    const trot = Math.sin(this.t*9)*2;
    ctx.fillStyle='#5a3a20';
    [[-8,trot],[-2,-trot],[4,trot],[9,-trot]].forEach(([lx,off])=>ctx.fillRect(lx-1.4,3+Math.max(0,off*0.4),2.8,7));

    // body with chest patch
    const bg = ctx.createLinearGradient(0,-7,0,4);
    bg.addColorStop(0,'#b47c46'); bg.addColorStop(1,'#8a5a34');
    drawRoundRect(-12,-8,24,12,6,bg,'#2a1810',1.6);
    ctx.fillStyle='#e8d8b8';
    ctx.beginPath(); ctx.ellipse(-7,-1,3.6,4.6,0,0,Math.PI*2); ctx.fill();

    // head
    ctx.fillStyle='#b47c46';
    ctx.beginPath(); ctx.ellipse(13,-6,6.6,5.8,0,0,Math.PI*2); ctx.fill();
    // ears
    ctx.fillStyle='#5a3a20';
    ctx.beginPath(); ctx.moveTo(9,-10); ctx.lineTo(6,-17); ctx.lineTo(12,-11); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(16,-10); ctx.lineTo(19,-16); ctx.lineTo(14,-11); ctx.closePath(); ctx.fill();
    // snout
    ctx.fillStyle='#d9a875';
    ctx.beginPath(); ctx.ellipse(18,-4,3.6,2.7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#241a10'; ctx.beginPath(); ctx.arc(20.8,-4,0.9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#241a10'; ctx.beginPath(); ctx.arc(14,-8,1.1,0,Math.PI*2); ctx.fill();
    // collar — a snug ring right at the neck (previously spanned almost to
    // the mouth on one end and into the body on the other, reading like a
    // leash/cord rather than a collar)
    ctx.strokeStyle='#c73a3a'; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.arc(10,-3,4.4,0.35,Math.PI-0.35); ctx.stroke();
    ctx.fillStyle='#ffd24d'; ctx.beginPath(); ctx.arc(10,1.4,1.2,0,Math.PI*2); ctx.fill();
    // open barking mouth
    if(d.barking>0){
      ctx.fillStyle='#2a1408';
      const mo = 1.6+Math.abs(Math.sin(this.t*22))*1.6;
      ctx.beginPath(); ctx.ellipse(19,-1,2.1,mo,0,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();

    if(d.barking>0){
      ctx.fillStyle='#fff'; ctx.font='bold 9px monospace'; ctx.textAlign='center';
      ctx.fillText('ГАВ!', x, y-20);
      ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.4;
      const r = (1-d.barking/0.9)*14+4;
      // sound-wave arc must face the same way the dog is facing — mirror
      // the angle span when flip<0, or the waves always point right even
      // while running (and barking) toward the left
      const baseAngle = flip>0 ? 0 : Math.PI;
      ctx.beginPath(); ctx.arc(x+flip*18,y-8,r,baseAngle-0.6,baseAngle+0.6); ctx.stroke();
      ctx.textAlign='left';
    }
  },

  drawTractor(){
    const tr=this.tractor, x=tr.x, y=tr.y;
    drawShadow(x,y+22,66,11);

    // big rear wheel (back of tractor) with deep tread
    const rwx=x-20, rwy=y+15, rwr=13.5;
    ctx.beginPath(); ctx.arc(rwx,rwy,rwr,0,Math.PI*2); ctx.fillStyle='#141414'; ctx.fill();
    ctx.strokeStyle='#050505'; ctx.lineWidth=1; ctx.stroke();
    ctx.strokeStyle='#000'; ctx.lineWidth=2.2;
    for(let i=0;i<11;i++){
      const a=i/11*Math.PI*2 + this.t*3;
      ctx.beginPath();
      ctx.moveTo(rwx+Math.cos(a)*(rwr-2.5), rwy+Math.sin(a)*(rwr-2.5));
      ctx.lineTo(rwx+Math.cos(a)*(rwr+1.4), rwy+Math.sin(a)*(rwr+1.4));
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(rwx,rwy,7.6,0,Math.PI*2); ctx.fillStyle='#9a9aa0'; ctx.fill();
    ctx.beginPath(); ctx.arc(rwx,rwy,3.6,0,Math.PI*2); ctx.fillStyle='#6b5a48'; ctx.fill();
    ctx.strokeStyle='#5a5a5e'; ctx.lineWidth=1.2;
    for(let i=0;i<6;i++){ const a=i/6*Math.PI*2+this.t*3; ctx.beginPath(); ctx.moveTo(rwx,rwy); ctx.lineTo(rwx+Math.cos(a)*7.6,rwy+Math.sin(a)*7.6); ctx.stroke(); }

    // small front wheel
    const fwx=x+27, fwy=y+18, fwr=6.6;
    ctx.beginPath(); ctx.arc(fwx,fwy,fwr,0,Math.PI*2); ctx.fillStyle='#141414'; ctx.fill();
    ctx.strokeStyle='#000'; ctx.lineWidth=1.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(fwx,fwy,2.8,0,Math.PI*2); ctx.fillStyle='#9a9aa0'; ctx.fill();

    // rear mudguard/fender arching over the big wheel
    ctx.strokeStyle='#a02824'; ctx.lineWidth=4.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(rwx,rwy-1,rwr+3,Math.PI*1.08,Math.PI*1.97); ctx.stroke();

    // chassis red gradient
    const bg = ctx.createLinearGradient(0,y-18,0,y+8);
    bg.addColorStop(0,'#e8645a'); bg.addColorStop(0.5,'#c73a3a'); bg.addColorStop(1,'#7a1818');

    // low frame connecting rear axle to hood (open, no cab walls)
    drawRoundRect(x-16,y-2,26,11,3,bg,'#5a1414',1.8);
    // hood
    drawRoundRect(x+6,y-16,26,17,4,bg,'#5a1414',2);
    ctx.fillStyle='rgba(255,255,255,.2)'; ctx.fillRect(x+8,y-14,20,2.4);
    // hood grille slats
    ctx.strokeStyle='#5a1414'; ctx.lineWidth=1.6;
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(x+11,y-10+i*4.2); ctx.lineTo(x+29,y-10+i*4.2); ctx.stroke(); }
    // headlight
    ctx.fillStyle='#ffe27a'; ctx.beginPath(); ctx.ellipse(x+31,y-7,2.1,2.8,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#5a1414'; ctx.lineWidth=1; ctx.stroke();

    // driver's seat
    drawRoundRect(x-13,y-13,9,8,2.4,'#3a2a20','#1a1210',1.4);
    ctx.fillStyle='#241810'; ctx.beginPath(); ctx.ellipse(x-9,y-15,4.4,2.4,0,Math.PI,0); ctx.fill();

    // steering wheel + column, angled toward the hood
    ctx.strokeStyle='#333'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-1,y-8); ctx.lineTo(x+5,y-19); ctx.stroke();
    ctx.beginPath(); ctx.arc(x+6,y-20,3.2,0,Math.PI*2); ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=1.6; ctx.stroke();

    // two canopy support poles + curved roof bar over the seat
    ctx.strokeStyle='#a02824'; ctx.lineWidth=2.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-14,y-11); ctx.lineTo(x-16,y-33); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-2,y-13); ctx.lineTo(x-1,y-33); ctx.stroke();
    ctx.strokeStyle='#7a6a52'; ctx.lineWidth=4.2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-18,y-33); ctx.quadraticCurveTo(x-8,y-40,x+3,y-32); ctx.stroke();

    // tall exhaust pipe with an elbow at the top
    drawRoundRect(x+2,y-26,3.2,15,1.4,'#7a7a80','#333',1);
    ctx.strokeStyle='#7a7a80'; ctx.lineWidth=3.2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x+3.6,y-26); ctx.quadraticCurveTo(x+3.6,y-31,x+7,y-30); ctx.stroke();
    tr.smoke += 0.03;
    for(let i=0;i<3;i++){
      const s=(tr.smoke+i*0.33)%1;
      ctx.globalAlpha=(1-s)*0.4; ctx.fillStyle='#aaa';
      ctx.beginPath(); ctx.arc(x+8,y-31-s*20,2.2+s*4,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  },

  drawProjectiles(){
    for(const p of this.projectiles){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Math.atan2(p.vy,p.vx)+Math.PI/2);
      // wooden shaft
      ctx.strokeStyle='#8a6a3a'; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,-2); ctx.lineTo(0,9); ctx.stroke();
      // crossbar at the base of the tines
      ctx.strokeStyle='#9a9aa4'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(-4,-5); ctx.lineTo(4,-5); ctx.stroke();
      // three fanned tines, clearly a pitchfork head rather than an arrowhead
      ctx.strokeStyle='#d3d3da'; ctx.lineWidth=1.5; ctx.lineCap='round';
      [-4,0,4].forEach(tx=>{
        ctx.beginPath(); ctx.moveTo(tx,-5); ctx.lineTo(tx*1.15,-12); ctx.stroke();
      });
      ctx.restore();
    }
  },

  drawBeam(){
    if(!this.beam) return;
    const wide = this.beamWideT>0;
    const topW = wide?30:18, botW = wide?58:34;
    const ux=this.ufo.x, uy=this.ufo.y+16, gy=this.groundY;
    const pulse = 0.55+0.15*Math.sin(this.t*10);
    const col = wide ? '170,225,255' : '120,220,255';
    const grad = ctx.createLinearGradient(0,uy,0,gy);
    grad.addColorStop(0,'rgba('+col+','+(0.55*pulse)+')');
    grad.addColorStop(1,'rgba('+col+',0.05)');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(ux-topW,uy); ctx.lineTo(ux+topW,uy);
    ctx.lineTo(ux+botW,gy); ctx.lineTo(ux-botW,gy);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(200,240,255,.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(ux,gy,botW,8,0,0,Math.PI*2); ctx.stroke();
  },

  drawPowerups(){
    for(const p of this.powerups){
      const pulse = 0.7+0.3*Math.sin(p.t*8);
      const col = p.type==='wide' ? '#2de3ff' : '#ffd24d';
      ctx.save(); ctx.translate(p.x,p.y);
      const glow = ctx.createRadialGradient(0,0,2,0,0,20);
      glow.addColorStop(0, hexToRgba(col,0.6*pulse));
      glow.addColorStop(1, hexToRgba(col,0));
      ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
      ctx.rotate(p.t*2);
      ctx.fillStyle=col;
      ctx.beginPath();
      ctx.moveTo(0,-9); ctx.lineTo(3,-3); ctx.lineTo(9,0); ctx.lineTo(3,3);
      ctx.lineTo(0,9); ctx.lineTo(-3,3); ctx.lineTo(-9,0); ctx.lineTo(-3,-3);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
      ctx.restore();
      ctx.fillStyle=col; ctx.font='bold 7px monospace'; ctx.textAlign='center';
      ctx.fillText(p.type==='wide'?'Ш':'Б', p.x, p.y+3);
      ctx.textAlign='left';
    }
  },

  drawPopups(){
    for(const p of this.popups){
      const t = p.age/p.life;
      ctx.globalAlpha = Math.max(0,1-t);
      ctx.fillStyle = p.color||'#fff';
      ctx.font='bold 10px monospace'; ctx.textAlign='center';
      ctx.fillText(p.text, p.x, p.y - t*22);
      ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
  },

  drawLevelHUD(){
    let y=16;
    if(this.shipTier>0){
      ctx.fillStyle='#ffd24d'; ctx.font='8px monospace'; ctx.textAlign='left';
      ctx.fillText('РАНГ: '+SHIP_TIERS[this.shipTier].name, 8, y); y+=11;
    }
    if(this.combo>1){
      const mult = Math.min(3, 1 + Math.floor(this.combo/3)*0.5);
      ctx.fillStyle='#ffd24d'; ctx.font='8px monospace'; ctx.textAlign='left';
      ctx.fillText('COMBO x'+mult.toFixed(1)+' ('+this.combo+')', 8, y); y+=11;
    }
    if(this.beamWideT>0){ ctx.fillStyle='#2de3ff'; ctx.font='8px monospace'; ctx.textAlign='left'; ctx.fillText('ШИРЕ ЛУЧ '+this.beamWideT.toFixed(1)+'с', 8, y); y+=11; }
    if(this.beamFastT>0){ ctx.fillStyle='#ffd24d'; ctx.font='8px monospace'; ctx.textAlign='left'; ctx.fillText('БЫСТРЫЙ ЛУЧ '+this.beamFastT.toFixed(1)+'с', 8, y); }
  },

  drawUFO(){
    const x=this.ufo.x, y=this.ufo.y;
    const tier = this.shipTier; // cosmetic rank — layers extra detail onto the same hull
    const bob = Math.sin(this.t*3)*2;
    ctx.save(); ctx.translate(x,y+bob);
    drawShadow(0, this.groundY-y+bob, 46, 11);

    // soft under-glow, tinted red while overheated
    const glow = ctx.createRadialGradient(0,11,2,0,11,28);
    glow.addColorStop(0, this.overheated?'rgba(255,90,90,.35)':'rgba(120,220,255,.32)');
    glow.addColorStop(1,'rgba(120,220,255,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.ellipse(0,11,28,11,0,0,Math.PI*2); ctx.fill();

    // tier 3+: a slow-orbiting halo of golden sparks, peeking out from
    // behind the hull — drawn before the body so it reads as "behind" it
    if(tier>=3){
      const spin = this.t*1.2;
      for(let i=0;i<10;i++){
        const a = (i/10)*Math.PI*2 + spin;
        const hx = Math.cos(a)*46, hy = 10+Math.sin(a)*15;
        const pulse = 0.5+0.5*Math.sin(this.t*5+i);
        ctx.beginPath(); ctx.arc(hx,hy,1.8,0,Math.PI*2);
        ctx.fillStyle = `rgba(255,214,120,${0.35+0.45*pulse})`;
        ctx.fill();
      }
    }

    // dark rim underside
    ctx.beginPath(); ctx.ellipse(0,10,31,7.5,0,0,Math.PI*2);
    ctx.fillStyle='#241640'; ctx.fill();

    // main saucer hull, glossy gradient
    const bodyGrad = ctx.createLinearGradient(0,-5,0,10);
    bodyGrad.addColorStop(0,'#ede2ff'); bodyGrad.addColorStop(0.45,'#ab80e6'); bodyGrad.addColorStop(1,'#5a3894');
    ctx.beginPath(); ctx.ellipse(0,3,37,12.5,0,0,Math.PI*2);
    ctx.fillStyle=bodyGrad; ctx.fill();
    // tier 4: the hull trim reads gold instead of plain dark plum
    ctx.strokeStyle = tier>=4 ? '#ffd24d' : '#241640'; ctx.lineWidth=2; ctx.stroke();
    // top sheen streak
    ctx.fillStyle='rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(-7,-2,17,4.6,-0.18,0,Math.PI*2); ctx.fill();
    // small greeble rivets along the hull
    ctx.fillStyle='rgba(36,22,64,.5)';
    for(let i=-2;i<=2;i++) if(i!==0){ ctx.beginPath(); ctx.arc(i*13,6,1.3,0,Math.PI*2); ctx.fill(); }

    // tier 2+: small sensor pods bolted to the hull's widest point
    if(tier>=2){
      [-1,1].forEach(side=>{
        const px=side*35, py=5;
        const podGrad = ctx.createLinearGradient(px,py-5,px,py+5);
        podGrad.addColorStop(0,'#c9b8ef'); podGrad.addColorStop(1,'#4a2f7a');
        ctx.beginPath(); ctx.ellipse(px,py,7,4.5,0,0,Math.PI*2);
        ctx.fillStyle=podGrad; ctx.fill();
        ctx.strokeStyle='#241640'; ctx.lineWidth=1.4; ctx.stroke();
        const pulse=0.5+0.5*Math.sin(this.t*5+side);
        ctx.beginPath(); ctx.arc(px+side*3,py,1.6,0,Math.PI*2);
        ctx.fillStyle=`rgba(125,232,255,${0.5+0.5*pulse})`;
        ctx.fill();
      });
    }

    // rim of colourful blinking lights
    const litColors=['#ff6a9e','#ffd24d','#7de8ff','#9dff7d'];
    for(let i=0;i<9;i++){
      const a = (i/9)*Math.PI*2;
      const lx = Math.cos(a)*31, ly = 9+Math.sin(a)*4.6;
      const on = Math.sin(this.t*6+i*0.8)>0.1;
      ctx.beginPath(); ctx.arc(lx,ly,2.1,0,Math.PI*2);
      ctx.fillStyle = on ? litColors[i%4] : 'rgba(255,255,255,.18)';
      ctx.fill();
    }

    // tier 1+: a finer trim ring of static chrome studs, just outside the
    // main light ring — reads as "upgraded plating" without adding noise
    if(tier>=1){
      ctx.fillStyle='rgba(224,224,238,.55)';
      for(let i=0;i<14;i++){
        const a=(i/14)*Math.PI*2;
        const lx=Math.cos(a)*34.5, ly=9.6+Math.sin(a)*5.1;
        ctx.beginPath(); ctx.arc(lx,ly,1,0,Math.PI*2); ctx.fill();
      }
    }

    // tractor-beam emitter nozzle
    const nozGrad = ctx.createLinearGradient(0,10,0,17);
    const nozCol = this.overheated ? '#ff5a5a' : '#7de8ff';
    nozGrad.addColorStop(0, nozCol); nozGrad.addColorStop(1, shade(nozCol,-0.3));
    drawRoundRect(-10,10,20,7,3,nozGrad,'#241640',1.4);

    // dome glass
    const domeGrad = ctx.createLinearGradient(0,-31,0,3);
    domeGrad.addColorStop(0,'rgba(232,255,255,.96)');
    domeGrad.addColorStop(0.55,'rgba(150,228,255,.78)');
    domeGrad.addColorStop(1,'rgba(96,182,222,.6)');
    ctx.beginPath(); ctx.ellipse(0,-2,20,21,0,Math.PI,0); ctx.fillStyle=domeGrad; ctx.fill();

    // alien riding inside, clipped to the dome
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0,-2,19.4,20.4,0,Math.PI,0); ctx.clip();
    const alienGrad = ctx.createLinearGradient(0,-16,0,8);
    alienGrad.addColorStop(0,'#8dffbc'); alienGrad.addColorStop(1,'#2fa860');
    const wave = Math.sin(this.t*4)*3;
    ctx.strokeStyle='#2fa860'; ctx.lineWidth=2.4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-8,3); ctx.lineTo(-14,1-wave); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8,3); ctx.lineTo(14,1+wave); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,4,9,11,0,0,Math.PI*2); ctx.fillStyle=alienGrad; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,-8,8.4,7.4,0,0,Math.PI*2); ctx.fillStyle=alienGrad; ctx.fill();
    ctx.fillStyle='#0c2016';
    ctx.beginPath(); ctx.ellipse(-3.7,-8.4,2.7,3.5,-0.15,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3.7,-8.4,2.7,3.5,0.15,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(-4.6,-9.6,0.85,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(2.9,-9.6,0.85,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // dome rim outline + glass glint on top
    ctx.strokeStyle='#241640'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(0,-2,20,21,0,Math.PI,0); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.ellipse(-7,-13,5,10,-0.3,0,Math.PI*2); ctx.fill();

    // tier 4: a small crest antenna with a pulsing gem — the mark of a legend
    if(tier>=4){
      ctx.strokeStyle='#ffd24d'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,-23); ctx.lineTo(0,-34); ctx.stroke();
      const pulse=0.6+0.4*Math.sin(this.t*6);
      const gemGlow = ctx.createRadialGradient(0,-34,0,0,-34,8*pulse);
      gemGlow.addColorStop(0,`rgba(255,214,120,${0.8*pulse})`);
      gemGlow.addColorStop(1,'rgba(255,214,120,0)');
      ctx.fillStyle=gemGlow; ctx.beginPath(); ctx.arc(0,-34,8*pulse,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-34,3,0,Math.PI*2); ctx.fillStyle='#ffd24d'; ctx.fill();
      ctx.strokeStyle='#7a5210'; ctx.lineWidth=1; ctx.stroke();
    }

    ctx.restore();
  },

  drawSpeechBubble(){
    const cx=this.ufo.x+52, cy=this.ufo.y-64;
    if(cx>this.W-24 || this.t%6>2.6) return;
    const w=106, h=58;
    const tailX=this.ufo.x+16, tailY=this.ufo.y-38;

    // curved swoosh tail back toward the saucer, drawn first so the
    // rounded bubble body overlaps and hides the seam
    ctx.beginPath();
    ctx.moveTo(cx-w/2+16, cy+h/2-8);
    ctx.quadraticCurveTo(cx-w/2-16, cy+h/2+16, tailX, tailY);
    ctx.quadraticCurveTo(cx-w/2, cy+h/2+4, cx-w/2+24, cy+h/2-2);
    ctx.closePath();
    ctx.fillStyle='#fdf6d8'; ctx.fill();
    ctx.strokeStyle='#2a1a4a'; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();

    // rounded, cloud-style bubble body (full ellipse instead of a boxy rect)
    ctx.beginPath(); ctx.ellipse(cx,cy,w/2,h/2,0,0,Math.PI*2);
    ctx.fillStyle='#fdf6d8'; ctx.fill();
    ctx.strokeStyle='#2a1a4a'; ctx.lineWidth=2; ctx.stroke();

    ctx.fillStyle='#2a1a4a'; ctx.font='bold 8px monospace'; ctx.textAlign='center';
    ctx.fillText('ОТВЕДИ МЕНЯ',cx,cy-11);
    ctx.fillText('К СВОЕЙ',cx,cy+1);
    ctx.fillText('КОРОВЕ!',cx,cy+13);
    ctx.textAlign='left';
  },

  drawHeatGauge(){
    drawRoundRect(120,6,120,14,4,'#0a0a0a','#3a3350',2);
    const w = 116*this.beamHeat/100;
    ctx.fillStyle = this.overheated ? '#ff5a5a' : '#2de3ff';
    ctx.fillRect(122,8,w,10);
    ctx.fillStyle='#cfcfe0'; ctx.font='7px monospace'; ctx.textAlign='center';
    ctx.fillText(this.overheated?'ПЕРЕГРЕВ ЛУЧА':'ЛУЧ', 180, 16);
    ctx.textAlign='left';
  },

  draw(){
    this.drawMoonAndStars();
    this.drawField();
    this.drawTractor();
    this.drawDog();
    this.drawFarmer();
    for(const c of this.cows) this.drawCow(c);
    this.drawPowerups();
    this.drawBeam();
    this.drawProjectiles();
    this.drawUFO();
    this.drawSpeechBubble();
    for(const p of this.particles){
      const t=1-p.age/p.life;
      ctx.globalAlpha=Math.max(0,t); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,3*t+1,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    this.drawPopups();
    this.drawHeatGauge();
    this.drawLevelHUD();
    if(this.flashT>0){
      ctx.fillStyle = `rgba(255,50,50,${Math.min(0.35,this.flashT*1.3)})`;
      ctx.fillRect(0,0,this.W,this.H);
    }
  }
};

/* =====================================================================
   GAME 2 — HIGHWAY RUSH  (steering wheel controls lane position)
   ===================================================================== */
const Racing = {
  carX:180, speed:260, obstacles:[], dist:0, roadOffset:0, level:1,
  crashing:false, crashTimer:0, t:0,
  // weather cycles through clear/rain/fog; police chase fires periodically
  // as an alternative high-tension mode layered on top of normal traffic
  weather:'clear', weatherTimer:0, rainDrops:[],
  chase:{active:false, cd:0, car:null, timer:0},
  banner:null, bonusScore:0,
  init(){
    this.carX=180; this.obstacles=[]; this.dist=0; this.roadOffset=0; this.speed=260; this.level=1;
    this.crashing=false; this.crashTimer=0; this.gearCooldown=0; this.t=0;
    this.weather='clear'; this.weatherTimer=this.rand(16,24); this.rainDrops=[];
    this.chase = { active:false, cd:this.rand(22,32), car:null, timer:0 };
    this.banner=null; this.bonusScore=0;
  },
  rand(a,b){ return a+Math.random()*(b-a); },
  spawnObstacle(){
    // guarantee there's always at least one lane the player can actually
    // drive through — check a wider "danger zone" (not just right at the
    // spawn point) and refuse to fill the last remaining open lane
    const laneXs = [90,180,270];
    const nearY = 240;
    const occupied = laneXs.map(lx => this.obstacles.some(o => Math.abs(o.x-lx)<20 && o.y<nearY));
    const openLanes = [0,1,2].filter(i=>!occupied[i]);
    if(openLanes.length<=1) return; // spawning here would leave zero passable lanes — skip until traffic clears
    const lane = openLanes[Math.floor(Math.random()*openLanes.length)];
    const lx = laneXs[lane];
    const blockedNearSpawn = this.obstacles.some(o => Math.abs(o.x-lx)<20 && o.y<100);
    if(!blockedNearSpawn){
      this.obstacles.push({x:lx,y:-50,w:46,h:68});
    }
  },
  update(dt){
    this.t += dt;
    if(this.banner) { this.banner.age += dt; if(this.banner.age>=this.banner.life) this.banner=null; }

    // --- weather: cycles between clear / rain / fog, changing feel and difficulty ---
    this.weatherTimer -= dt;
    if(this.weatherTimer<=0){
      const options = ['clear','rain','fog'];
      let next = options[Math.floor(Math.random()*options.length)];
      if(next===this.weather) next = options[(options.indexOf(next)+1)%options.length];
      this.weather = next;
      this.weatherTimer = this.rand(18,28);
      if(this.weather==='rain'){
        this.rainDrops = [];
        for(let i=0;i<64;i++) this.rainDrops.push({x:Math.random()*W, y:Math.random()*H, len:this.rand(10,22), sp:this.rand(520,720)});
        this.banner = {text:'ДОЖДЬ — ДОРОГА СКОЛЬЗКАЯ', age:0, life:2, color:'#7de8ff'};
      } else if(this.weather==='fog'){
        this.banner = {text:'ТУМАН — ВИДИМОСТЬ ХУЖЕ', age:0, life:2, color:'#cfd0da'};
      }
    }
    if(this.weather==='rain'){
      for(const d of this.rainDrops){
        d.y += d.sp*dt; d.x -= 34*dt;
        if(d.y>H){ d.y=-20; d.x=Math.random()*W; }
        if(d.x<0) d.x += W;
      }
    }

    // frozen crash beat: car stopped dead in place, brief red flash,
    // then respawns back at the starting lane/position — instead of
    // silently ghosting through the car that hit it
    if(this.crashing){
      this.crashTimer -= dt;
      if(this.crashTimer<=0){
        this.crashing=false;
        this.carX = 180;
        // clear traffic right around the respawn point so the player
        // doesn't immediately crash again the instant play resumes
        this.obstacles = this.obstacles.filter(o => Math.abs(o.y-440)>140);
      }
      return;
    }
    // wheel angle controls steering velocity, spring back slightly —
    // rain makes the car noticeably less responsive (wet tyres)
    const steer = input.wheelAngle;
    const steerMul = this.weather==='rain' ? 0.68 : 1;
    this.carX += steer*220*steerMul*dt;
    this.carX = Math.max(45,Math.min(315,this.carX));
    this.speed += dt*4*(this.weather==='fog' ? 0.7 : 1);
    this.dist += this.speed*dt;
    this.roadOffset = (this.roadOffset + this.speed*dt) % 40;
    const newLevel = 1 + Math.floor(this.dist/1200);
    this.gearCooldown = Math.max(0, this.gearCooldown-dt);
    if(newLevel>this.level && this.gearCooldown<=0){ SFX.gearShift(); this.gearCooldown = 4.5; }
    this.level = newLevel;

    if(Math.random() < dt*(1.3+this.level*0.15)) this.spawnObstacle();
    for(const o of this.obstacles) o.y += this.speed*dt;
    this.obstacles = this.obstacles.filter(o=>o.y<H+60);

    for(const o of this.obstacles){
      // near miss: car passes close alongside the obstacle without hitting it —
      // one-shot whoosh, flagged so it never repeats for the same obstacle
      if(!o.hit && !o.near && Math.abs(o.y-440)<46 && Math.abs(o.x-this.carX)>=30 && Math.abs(o.x-this.carX)<58){
        o.near = true;
        SFX.nearMiss();
      }
      if(!o.hit && Math.abs(o.x-this.carX)<30 && Math.abs(o.y-440)<46){
        o.hit=true; lives--; setHUD();
        SFX.crash();
        SFX.policeSiren(false);
        this.chase.active=false; this.chase.cd=this.rand(24,34);
        if(lives<=0){ SFX.gameOver(); showOverlay('АВАРИЯ!','Дистанция: '+Math.floor(this.dist)+'  •  Уровень '+this.level); stopLoop(); return; }
        this.crashing=true; this.crashTimer=0.9;
        return;
      }
    }

    // --- police chase: an alternative high-tension mode that fires
    // periodically once traffic gets busy — a cruiser closes in from
    // behind and the player has to outrun it instead of just dodging ---
    if(!this.chase.active){
      this.chase.cd -= dt;
      if(this.chase.cd<=0 && this.level>=2 && !this.crashing){
        this.chase.active = true;
        this.chase.timer = 0;
        this.chase.car = { x:this.carX, y:660, gap:220 };
        this.banner = {text:'🚓 ПОЛИЦИЯ НА ХВОСТЕ!', age:0, life:1.8, color:'#ff3b3b'};
      }
    } else {
      const c = this.chase.car;
      this.chase.timer += dt;
      SFX.policeSiren(true, 640+140*Math.sin(this.t*6));
      // closes the gap over time, but easing off a bit as it nears striking distance
      const closeRate = c.gap>90 ? 15 : 6;
      c.gap = Math.max(30, c.gap - closeRate*dt);
      c.x += (this.carX-c.x)*Math.min(1,dt*1.4);
      c.y = 440 + c.gap;
      if(c.gap<=32){
        SFX.busted(); SFX.policeSiren(false);
        lives--; setHUD();
        this.chase.active=false; this.chase.cd=this.rand(28,38);
        if(lives<=0){ SFX.gameOver(); showOverlay('ЗАДЕРЖАН ПОЛИЦИЕЙ!','Дистанция: '+Math.floor(this.dist)+'  •  Уровень '+this.level); stopLoop(); return; }
        this.crashing=true; this.crashTimer=0.9;
        return;
      }
      if(this.chase.timer>=13){
        this.bonusScore += 300;
        SFX.chaseEscape(); SFX.policeSiren(false);
        this.chase.active=false; this.chase.cd=this.rand(28,38);
        this.banner = {text:'УШЁЛ ОТ ПОГОНИ! +300', age:0, life:1.8, color:'#3dff8a'};
      }
    }

    score = Math.floor(this.dist/10) + this.bonusScore; setHUD();
  },
  drawBushVector(x,y,r){
    drawShadow(x,y+r*0.75,r*2,6);
    const blobs = [[0,0,r],[-r*0.5,r*0.15,r*0.65],[r*0.5,r*0.15,r*0.65],[0,-r*0.35,r*0.6]];
    for(const [ox,oy,br] of blobs){
      const g = ctx.createRadialGradient(x+ox-br*0.3,y+oy-br*0.3,0,x+ox,y+oy,br);
      g.addColorStop(0,'#5fd06c'); g.addColorStop(1,'#1f6b2c');
      ctx.beginPath(); ctx.arc(x+ox,y+oy,br,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
    }
    ctx.strokeStyle='rgba(20,50,20,0.4)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(x,y,r*0.95,0,Math.PI*2); ctx.stroke();
  },
  drawRain(){
    if(this.weather!=='rain') return;
    ctx.strokeStyle='rgba(200,220,255,0.35)'; ctx.lineWidth=1.3; ctx.lineCap='round';
    for(const d of this.rainDrops){
      ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-7,d.y+d.len); ctx.stroke();
    }
    ctx.fillStyle='rgba(140,170,220,0.06)'; ctx.fillRect(30,0,300,H);
  },
  drawFog(){
    if(this.weather!=='fog') return;
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'rgba(205,208,218,0.55)');
    g.addColorStop(0.42,'rgba(205,208,218,0.16)');
    g.addColorStop(1,'rgba(205,208,218,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  },
  drawPolice(){
    if(!this.chase.active || !this.chase.car) return;
    const c=this.chase.car, w=48, h=74;
    const nightT = Math.min(1,(this.level-1)*0.22);
    drawCarShadow(c.x,c.y,w,h,0);
    drawHeadlightBeams(c.x,c.y-h*0.46, carPhotoWidth(h), nightT, 0.45);
    drawCarPhoto(c.x,c.y,w,h,'#1c3fc9');
    const flashOn = Math.sin(this.t*14)>0;
    ctx.save(); ctx.translate(c.x, c.y-h*0.5);
    ctx.fillStyle = flashOn ? '#ff3b3b' : '#3b8bff';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
    drawRoundRect(-9,-4,18,7,2, flashOn?'#ff3b3b':'#3b8bff');
    ctx.restore();
  },
  drawChaseHUD(){
    if(!this.chase.active || !this.chase.car) return;
    const flashOn = Math.sin(this.t*10)>0;
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(50,70,260,24);
    ctx.fillStyle = flashOn ? '#ff3b3b' : '#3b8bff';
    ctx.font='bold 12px monospace'; ctx.textAlign='center';
    ctx.fillText('🚓 УХОДИ ОТ ПОГОНИ!', 180, 87);
    ctx.textAlign='left';
    drawRoundRect(90,96,180,7,3,'#0a0a0a','#3a3350',1.4);
    const pct = Math.max(0,Math.min(1,(this.chase.car.gap-30)/(220-30)));
    ctx.fillStyle = pct<0.3 ? '#ff3b3b' : '#ffd24d';
    ctx.fillRect(92,97.5,176*pct,4);
  },
  drawBanner(){
    if(!this.banner) return;
    const t = this.banner.age/this.banner.life;
    ctx.globalAlpha = Math.max(0, 1-t*t);
    ctx.fillStyle = this.banner.color||'#fff';
    ctx.font='bold 13px monospace'; ctx.textAlign='center';
    ctx.fillText(this.banner.text, 180, 140 - t*14);
    ctx.textAlign='left'; ctx.globalAlpha=1;
  },
  drawWeatherIcon(){
    if(this.weather==='clear') return;
    ctx.fillStyle='rgba(0,0,0,.4)'; ctx.fillRect(270,6,84,18);
    ctx.fillStyle = this.weather==='rain' ? '#7de8ff' : '#cfd0da';
    ctx.font='bold 9px monospace'; ctx.textAlign='center';
    ctx.fillText(this.weather==='rain'?'ДОЖДЬ':'ТУМАН', 312, 18);
    ctx.textAlign='left';
  },
  draw(){
    // road/sky darkens into "night driving" as the level climbs
    const nightT = Math.min(1, (this.level-1)*0.22);
    const sky = lerpColor('#0d0d16','#03030a', nightT);
    const roadLight = lerpColor('#4a4a56','#2f2f3a', nightT);
    const roadDark = lerpColor('#2e2e38','#1c1c24', nightT);
    const grassLight = lerpColor('#4fae5a','#245a2e', nightT);
    const grassDark = lerpColor('#2f7d3a','#173a1c', nightT);
    ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

    // grass shoulders — soft gradient + organic mottled patches instead of a pixel grid
    const gg = ctx.createLinearGradient(0,0,30,0);
    gg.addColorStop(0,grassDark); gg.addColorStop(1,grassLight);
    ctx.fillStyle=gg; ctx.fillRect(0,0,30,H);
    const gg2 = ctx.createLinearGradient(330,0,360,0);
    gg2.addColorStop(0,grassLight); gg2.addColorStop(1,grassDark);
    ctx.fillStyle=gg2; ctx.fillRect(330,0,30,H);
    for(let ty=10; ty<H; ty+=26){
      const wob = Math.sin(ty*0.3+this.dist*0.01)*4;
      ctx.beginPath(); ctx.ellipse(14+wob,ty,7,4,0.3,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fill();
      ctx.beginPath(); ctx.ellipse(346-wob,ty+13,7,4,-0.3,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fill();
    }
    // scrolling roadside bushes, now soft rounded blobs
    [[10,0,10],[20,140,8],[340,70,11],[350,210,9]].forEach(([bx,phase,r])=>{
      const by = ((this.dist*0.5 + phase) % (H+80)) - 40;
      this.drawBushVector(bx,by,r);
    });

    // road surface with a soft center highlight
    const rg = ctx.createLinearGradient(30,0,330,0);
    rg.addColorStop(0,roadDark); rg.addColorStop(0.5,roadLight); rg.addColorStop(1,roadDark);
    ctx.fillStyle=rg; ctx.fillRect(30,0,300,H);
    // streetlights: pole + glowing lamp, casting a soft pool of light onto
    // the road once it's dark enough to matter
    if(nightT>0.12){
      [[36,0],[324,220],[36,440],[324,660]].forEach(([lx,phase])=>{
        const ly = ((this.dist*0.5+phase) % (H+140)) - 70;
        const onLeft = lx<180;
        ctx.save();
        ctx.globalCompositeOperation='lighter'; // additive: overlapping glows brighten, never band/cut each other
        ctx.globalAlpha = Math.min(1,nightT/0.7);
        // pool of light on the road surface
        const pool = ctx.createRadialGradient(lx+(onLeft?40:-40),ly,0,lx+(onLeft?40:-40),ly,55);
        pool.addColorStop(0,'rgba(255,224,150,0.35)'); pool.addColorStop(1,'rgba(255,224,150,0)');
        ctx.fillStyle=pool; ctx.beginPath(); ctx.arc(lx+(onLeft?40:-40),ly,55,0,Math.PI*2); ctx.fill();
        // lamp glow
        const lampGlow = ctx.createRadialGradient(lx,ly-20,0,lx,ly-20,10);
        lampGlow.addColorStop(0,'rgba(255,234,180,0.9)'); lampGlow.addColorStop(1,'rgba(255,234,180,0)');
        ctx.fillStyle=lampGlow; ctx.beginPath(); ctx.arc(lx,ly-20,10,0,Math.PI*2); ctx.fill();
        ctx.restore();
        // pole + lamp head drawn separately, normal blending (solid, not a light source)
        ctx.fillStyle='#3a3a3a'; ctx.fillRect(lx-1.5,ly-18,3,26);
        ctx.fillStyle='#ffe9a8'; ctx.beginPath(); ctx.arc(lx,ly-20,3,0,Math.PI*2); ctx.fill();
      });
    }
    // reflector posts: soft glowing capsules along the shoulder edge
    for(let y=-40+(this.roadOffset%40); y<H+40; y+=40){
      ctx.save(); ctx.shadowColor='#fff'; ctx.shadowBlur=4;
      drawRoundRect(25,y,7,16,3.5,'#f4f4fa');
      drawRoundRect(328,y,7,16,3.5,'#f4f4fa');
      ctx.restore();
    }
    // lane dashes as soft rounded pills
    ctx.fillStyle='#ffb62d';
    const dashOff = this.roadOffset%40;
    for(let y=-40+dashOff; y<H+20; y+=40){
      drawRoundRect(133,y,4,20,2,'#ffb62d');
      drawRoundRect(223,y,4,20,2,'#ffb62d');
    }
    // obstacles — smooth rounded cars with a soft ground shadow
    for(const o of this.obstacles){
      const w=48, h=74;
      const baseColor = o.pal || (o.pal = ['#ff3b3b','#ff8a2e','#c93bff','#3b8bff','#eeeeee'][Math.floor(Math.random()*5)]);
      drawCarShadow(o.x, o.y, w, h, 0); // soft offset shadow like the reference, not a flat ellipse
      drawHeadlightBeams(o.x, o.y-h*0.46, carPhotoWidth(h), nightT, 0.4);
      drawCarPhoto(o.x,o.y,w,h,baseColor);
    }
    // police cruiser, chasing from behind (drawn with the other traffic)
    this.drawPolice();

    // player car
    const pw=48, ph=74;
    drawCarShadow(this.carX, 440, pw, ph, input.wheelAngle*0.3); // soft offset shadow like the reference, not a flat ellipse
    ctx.save();
    ctx.translate(this.carX,440);
    ctx.rotate(input.wheelAngle*0.3);
    drawHeadlightBeams(0, -ph*0.46, carPhotoWidth(ph), nightT, 0.55); // beams drawn in the same rotated frame as the car, so they turn with it
    drawCarPhoto(0,0,pw,ph,null); // player drives the exact uploaded car — no tint, original red
    ctx.restore();

    // rain streaks / fog haze sit above the road scene but below the HUD
    this.drawRain();
    this.drawFog();

    // level banner (progression: highway gets busier as you go)
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(120,46,120,20);
    ctx.fillStyle='#ffb62d'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
    ctx.fillText('LEVEL '+this.level, 180, 60);
    ctx.textAlign='left';
    this.drawWeatherIcon();
    this.drawChaseHUD();
    this.drawBanner();

    // crash flash: red vignette that fades out over the respawn pause
    if(this.crashing){
      const t = this.crashTimer/0.9;
      ctx.fillStyle = `rgba(255,40,40,${0.35*t})`;
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#fff'; ctx.font='bold 20px monospace'; ctx.textAlign='center';
      ctx.fillText('СТОЛКНОВЕНИЕ!', 180, 250);
      ctx.textAlign='left';
    }
  }
};

/* =====================================================================
   GAME 3 — DOT MUNCHER  (original maze-chase, joystick only)
   ===================================================================== */
// three distinct maze layouts, cycled by level (1 = wall, 0 = dot,
// 2 = empty tunnel mouth, 3 = power pellet)
const MAZE_LAYOUTS = [
[
"111111111111111",

"101101101101101",

"100000010000001",
"101110101011101",
