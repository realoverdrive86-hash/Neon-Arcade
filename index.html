"110010111010011",
"111111111111111"
],
[
"111111111111111",
"100000010000001",
"101011111110101",
"103010000010301",
"101010111010101",
"100010101010001",
"111010101010111",
"000010001010000",
"111011101110111",
"200000000000002",
"111011101110111",
"000010001010000",
"111010101010111",
"100010101010001",
"103010111010301",
"100000010000001",
"111111111111111"
],
[
"111111111111111",
"100010000010001",
"101010111010101",
"103010100010301",
"101000100010101",
"101111101111101",
"100000000000001",
"110111010111011",
"110100000010011",
"200100010010002",
"110100010010011",
"110111010111011",
"100000000000001",
"101111101111101",
"101000100010101",
"103010100010301",
"111111111111111"
]
];
// classic fruit progression — value (and flavor) escalates by level, just
// like the arcade original, instead of a flat random pick every time
const FRUITS = [
  {name:'вишня',    color:'#ff3b3b', value:100},
  {name:'клубника', color:'#ff5fa8', value:300},
  {name:'апельсин', color:'#ffb62d', value:500},
  {name:'яблоко',   color:'#3dff8a', value:700},
  {name:'дыня',     color:'#7de84f', value:1000},
  {name:'звезда',   color:'#4fd3ff', value:2000},
  {name:'колокол',  color:'#ffe94d', value:3000},
  {name:'ключ',     color:'#c99bff', value:5000},
];
const Maze = {
  cols:15, rows:17, tile:24, grid:[], player:{x:1,y:1,dir:{x:0,y:0},wantDir:{x:0,y:0}},
  enemies:[], dotsLeft:0, moveTimer:0, speed:6, level:1,
  layout:null, fruit:null, dotsSinceFruit:0,
  // ghost hunt/scatter AI + tunnel portal fx
  mode:'scatter', modeIdx:0, modeTimer:0, modeDurations:[7,20,7,20,5,20,5,9999],
  scatterCorners:[], tunnelRow:-1, warpParticles:[],
  // eaten-ghost chain bonus + floating score popups
  ghostChain:0, popups:[],
  init(){
    this.level = 1;
    this.setupLevel();
  },
  // find the nearest open (non-wall) cell to (cx,cy), searching outward in
  // rings — used to place/target the ghost home box safely, since (7,8)
  // happens to fall inside a wall block in one of the maze layouts
  findOpenNear(cx,cy){
    if(!this.isWall(cx,cy)) return {x:cx,y:cy};
    const maxR = Math.max(this.cols,this.rows);
    for(let r=1;r<maxR;r++){
      for(let dy=-r;dy<=r;dy++){
        for(let dx=-r;dx<=r;dx++){
          if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue; // ring perimeter only
          const y=cy+dy; if(y<0||y>=this.rows) continue;
          const x=((cx+dx)+this.cols)%this.cols;
          if(!this.isWall(x,y)) return {x,y};
        }
      }
    }
    return {x:1,y:1};
  },
  setupLevel(){
    const L = MAZE_LAYOUTS[(this.level-1) % MAZE_LAYOUTS.length].map(row=>row.split('').map(Number));
    this.layout = L;
    this.grid = L.map(r=>r.slice());
    this.tunnelRow = L.findIndex(row=>row[0]===2);
    this.warpParticles = [];
    this.player = {x:1,y:1,dir:{x:0,y:0},wantDir:{x:0,y:0}};
    // the ghost home box — where eaten ghosts respawn — must actually be
    // reachable in whichever maze is active, so it's found fresh per level
    // rather than hardcoded, and the 4th ghost's spawn/scatter point reuses it
    this.ghostHome = this.findOpenNear(7,8);
    const enemyColors = ['#ff6b9d','#3ddc84','#4fd3ff','#ffa94d'];
    const enemyStarts = [{x:13,y:1},{x:13,y:15},{x:1,y:15},this.ghostHome];
    this.scatterCorners = enemyStarts;
    const count = Math.min(2+this.level, 4);
    this.enemies = [];
    for(let i=0;i<count;i++){
      this.enemies.push({x:enemyStarts[i].x, y:enemyStarts[i].y, color:enemyColors[i], dir:{x:-1,y:0}, eaten:false, eatenTicks:0});
    }
    this.speed = 6.5; // player stays responsive regardless of level
    this.dotsLeft = 0;
    for(const row of this.grid) for(const c of row) if(c===0||c===3) this.dotsLeft++;
    this.moveTimer=0;
    this.power=0;
    this.fruit=null; this.dotsSinceFruit=0;
    this.ghostChain=0; this.popups=[];
    this.joyReady = true;
    // ghosts open in scatter mode (retreat to their corners) before the
    // first hunt phase kicks in, matching the classic alternating rhythm
    this.mode='scatter'; this.modeIdx=0; this.modeTimer=this.modeDurations[0];
    this.computeWallComponents();
  },
  // group connected wall cells into shapes (BFS) so each distinct wall
  // "piece" gets one consistent color — the outer perimeter is its own
  // shape and always reads white/bright, exactly like the reference
  computeWallComponents(){
    const rows=this.rows, cols=this.cols;
    const compId = Array.from({length:rows},()=>new Array(cols).fill(-1));
    const borderById = [];
    let nextId = 0;
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        if(this.layout[y][x]!==1 || compId[y][x]!==-1) continue;
        const id = nextId++;
        let touchesBorder = (x===0||y===0||x===cols-1||y===rows-1);
        const stack=[[x,y]];
        compId[y][x]=id;
        while(stack.length){
          const [cx,cy]=stack.pop();
          for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
            const nx=cx+dx, ny=cy+dy;
            if(nx<0||ny<0||nx>=cols||ny>=rows) continue;
            if(this.layout[ny][nx]===1 && compId[ny][nx]===-1){
              compId[ny][nx]=id;
              if(nx===0||ny===0||nx===cols-1||ny===rows-1) touchesBorder=true;
              stack.push([nx,ny]);
            }
          }
        }
        borderById[id] = touchesBorder;
      }
    }
    // classic arcade style: every wall is the same blue, no rainbow patchwork
    this.wallCompId = compId;
    this.wallCompColor = borderById.map(() => '#2626f2');
  },
  isWall(x,y){
    if(y<0||y>=this.rows) return true;
    const row=this.grid[y]; if(!row) return true;
    const v = row[((x%this.cols)+this.cols)%this.cols];
    return v===1;
  },
  update(dt){
    // continuous movement: as long as the stick is held past the deadzone,
    // keep walking that direction every tick; release the stick (or let it
    // fall back to center) and the character stops immediately
    const mag = Math.hypot(input.joy.x, input.joy.y);
    if(mag > 0.35){
      let dir;
      if(Math.abs(input.joy.x) > Math.abs(input.joy.y)) dir = {x:Math.sign(input.joy.x), y:0};
      else dir = {x:0, y:Math.sign(input.joy.y)};
      this.heldDir = dir;
    } else {
      this.heldDir = null;
    }

    // player and ghosts (and the power-pellet timer) all run on the same
    // steady clock now, so the player advances one tile per tick while the
    // stick stays pushed, with no held-in-place delay
    this.moveTimer += dt;
    const stepTime = 1/this.speed;
    if(this.moveTimer>=stepTime){
      this.moveTimer=0;
      if(this.heldDir) this.tryPlayerStep(this.heldDir);
      this.stepGhosts();
      if(this.power>0) this.power = Math.max(0,this.power-stepTime);
      if(this.fruit){ this.fruit.life -= stepTime; if(this.fruit.life<=0) this.fruit=null; }
      this.checkCollisions();
    }

    // ghost hunt/scatter cycle — runs on the real clock, independent of the
    // step tick, so it doesn't drift with speed changes across levels
    if(this.power<=0){
      this.modeTimer -= dt;
      if(this.modeTimer<=0 && this.modeIdx<this.modeDurations.length-1){
        this.modeIdx++;
        this.mode = (this.mode==='scatter') ? 'chase' : 'scatter';
        this.modeTimer = this.modeDurations[this.modeIdx];
      }
    }

    for(const wp of this.warpParticles) wp.age += dt;
    this.warpParticles = this.warpParticles.filter(wp=>wp.age<wp.life);
    for(const pu of this.popups) pu.age += dt;
    this.popups = this.popups.filter(pu=>pu.age<pu.life);
  },
  tryPlayerStep(dir){
    const p=this.player;
    if(this.isWall(p.x+dir.x,p.y+dir.y)) return; // blocked — stay put, no partial slide
    p.dir = dir;
    p.x = ((p.x+dir.x)+this.cols)%this.cols;
    p.y += dir.y;

    // stepping through a portal tunnel — flash a warp burst at both mouths
    if(dir.x!==0 && p.y===this.tunnelRow &&
       ((dir.x===1 && p.x===0) || (dir.x===-1 && p.x===this.cols-1))){
      SFX.warp();
      for(let i=0;i<10;i++) this.warpParticles.push({x: p.x===0 ? this.cols-1 : 0, y:p.y, age:0, life:0.4, side: p.x===0?1:-1});
    }

    const cell = this.grid[p.y] ? this.grid[p.y][p.x] : 2;
    if(cell===0){
      this.grid[p.y][p.x]=2; score+=10; this.dotsLeft--; setHUD();
      SFX.chomp();
      this.dotsSinceFruit++;
      if(this.dotsSinceFruit>=24 && !this.fruit){
        const k = FRUITS[Math.min(this.level-1, FRUITS.length-1)];
        this.fruit = {x:7,y:5,color:k.color,value:k.value,life:8};
        this.dotsSinceFruit=0;
      }
    } else if(cell===3){
      this.grid[p.y][p.x]=2; score+=50; this.dotsLeft--; setHUD(); this.power=6;
      this.ghostChain=0; // a fresh pellet always restarts the 200/400/800/1600 chain
      SFX.powerPellet();
    }

    if(this.fruit && this.fruit.x===p.x && this.fruit.y===p.y){
      score+=this.fruit.value; setHUD();
      this.popups.push({x:p.x,y:p.y,age:0,life:1,text:'+'+this.fruit.value,color:this.fruit.color});
      this.fruit=null; SFX.fruitBonus();
    }

    this.checkCollisions();
    if(this.dotsLeft<=0){
      this.level++;
      score += 300; setHUD();
      SFX.levelUp();
      this.setupLevel();
    }
  },
  // per-ghost chase target, echoing the original quartet's distinct
  // personalities instead of every ghost beelining for the same tile
  chaseTarget(gi, p, e){
    if(gi===0) return {x:p.x, y:p.y}; // direct pursuer
    if(gi===1) return {x:p.x+p.dir.x*4, y:p.y+p.dir.y*4}; // ambushes a few tiles ahead
    if(gi===2) return {x:p.x+(p.dir.y||0)*4, y:p.y+(p.dir.x||0)*4}; // cuts across at an angle
    // shy: closes in like the others from a distance, but peels off toward
    // its home corner once it gets close
    const dist = Math.hypot(e.x-p.x, e.y-p.y);
    return dist>6 ? {x:p.x,y:p.y} : (this.scatterCorners[gi]||{x:1,y:this.rows-2});
  },
  stepGhosts(){
    const p=this.player;
    // eaten ghosts ("eyes") always scurry home every tick, faster than the
    // rest of the pack, and ignore the hunt/scatter cycle entirely
    for(const e of this.enemies){
      if(!e.eaten) continue;
      const home = this.ghostHome || {x:1,y:1};
      if(e.x===home.x && e.y===home.y){ e.eaten=false; e.eatenTicks=0; continue; }
      // failsafe: if the eyes haven't made it home after a long stretch
      // (topology-dependent oscillation near a dead end), just snap them
      // there rather than let them wander in place forever
      e.eatenTicks = (e.eatenTicks||0)+1;
      if(e.eatenTicks>70){ e.x=home.x; e.y=home.y; e.eaten=false; e.eatenTicks=0; continue; }
      const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      const valid = dirs.filter(d=> !this.isWall(e.x+d.x,e.y+d.y) && !(d.x===-e.dir.x&&d.y===-e.dir.y));
      let choice;
      if(valid.length===0) choice = {x:-e.dir.x,y:-e.dir.y};
      else {
        valid.sort((a,b)=>{
          const da=Math.hypot((e.x+a.x)-home.x,(e.y+a.y)-home.y);
          const db=Math.hypot((e.x+b.x)-home.x,(e.y+b.y)-home.y);
          return da-db;
        });
        choice = valid[0];
      }
      e.dir = choice;
      e.x = ((e.x+choice.x)+this.cols)%this.cols;
      e.y += choice.y;
    }

    // ghosts step less often than the player at low levels so they read
    // as slower; ramps toward every-tick by level 4+
    this.ghostTick = (this.ghostTick||0) + 1;
    const ghostEvery = Math.max(1, 3 - Math.floor((this.level-1)/1.5));
    if(this.ghostTick % ghostEvery !== 0) return;
    for(let gi=0; gi<this.enemies.length; gi++){
      const e = this.enemies[gi];
      if(e.eaten) continue; // handled above, on its own faster clock
      const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
      const valid = dirs.filter(d=> !this.isWall(e.x+d.x,e.y+d.y) && !(d.x===-e.dir.x&&d.y===-e.dir.y));
      let choice;
      if(valid.length===0) choice = {x:-e.dir.x,y:-e.dir.y};
      else if(this.power>0){
        // frightened: flee, semi-randomly, away from the player
        if(Math.random()<0.6){
          valid.sort((a,b)=>{
            const da=Math.hypot((e.x+a.x)-p.x,(e.y+a.y)-p.y);
            const db=Math.hypot((e.x+b.x)-p.x,(e.y+b.y)-p.y);
            return db-da;
          });
          choice = valid[0];
        } else choice = valid[Math.floor(Math.random()*valid.length)];
      } else {
        // scatter: retreat toward an assigned home corner; chase: hunt the
        // player using each ghost's own targeting personality
        const target = this.mode==='scatter' ? (this.scatterCorners[gi]||{x:p.x,y:p.y}) : this.chaseTarget(gi,p,e);
        if(Math.random()<0.75){
          valid.sort((a,b)=>{
            const da=Math.hypot((e.x+a.x)-target.x,(e.y+a.y)-target.y);
            const db=Math.hypot((e.x+b.x)-target.x,(e.y+b.y)-target.y);
            return da-db;
          });
          choice = valid[0];
        } else choice = valid[Math.floor(Math.random()*valid.length)];
      }
      e.dir = choice;
      e.x = ((e.x+choice.x)+this.cols)%this.cols;
      e.y += choice.y;
    }
  },
  checkCollisions(){
    const p=this.player;
    for(const e of this.enemies){
      if(e.eaten) continue; // eyes pass through the player harmlessly on the way home
      if(e.x===p.x && e.y===p.y){
        if(this.power>0){
          e.eaten = true; e.eatenTicks = 0;
          this.ghostChain = (this.ghostChain||0)+1;
          const pts = Math.min(1600, 200*Math.pow(2,this.ghostChain-1));
          score += pts; setHUD();
          SFX.eatGhost();
          this.popups.push({x:e.x,y:e.y,age:0,life:0.9,text:'+'+pts,color:'#7de8ff'});
        }
        else {
          lives--; setHUD();
          SFX.ghostDeath();
          if(lives<=0){ SFX.gameOver(); showOverlay('ИГРА ОКОНЧЕНА','Счёт: '+score); stopLoop(); return; }
          p.x=1;p.y=1;p.dir={x:0,y:0};
        }
      }
    }
  },
  wallColor(x,y){
    const id = this.wallCompId && this.wallCompId[y] ? this.wallCompId[y][x] : -1;
    return (id!=null && this.wallCompColor[id]) || '#2de3ff';
  },
  drawBrickBlock(px,py,s){
    const off = 3; // how far the side face peeks out — this is what
    // actually reads as a second visible face, not just a blurred shadow
    // darker side/base face, offset down-right
    const g2 = ctx.createLinearGradient(px,py,px,py+s);
    g2.addColorStop(0,'#7480b0'); g2.addColorStop(1,'#4c5690');
    drawRoundRect(px+off, py+off, s-off, s-off, 3, g2);
    // lighter top face on top, with the woven "X" stitch pattern
    const g = ctx.createLinearGradient(px,py,px,py+s-off);
    g.addColorStop(0,'#eef1fb'); g.addColorStop(1,'#b6c0e4');
    drawRoundRect(px, py, s-off, s-off, 3, g);
    ctx.strokeStyle='rgba(70,80,140,0.5)'; ctx.lineWidth=1.1;
    ctx.beginPath();
    ctx.moveTo(px+2,py+2); ctx.lineTo(px+s-off-3,py+s-off-3);
    ctx.moveTo(px+s-off-3,py+2); ctx.lineTo(px+2,py+s-off-3);
    ctx.stroke();
    ctx.strokeStyle='rgba(40,46,90,0.5)'; ctx.lineWidth=1;
    ctx.strokeRect(px+0.5,py+0.5,s-off-2,s-off-2);
  },
  drawPortals(){
    if(this.tunnelRow==null || this.tunnelRow<0) return;
    const ox = (W - this.cols*this.tile)/2;
    const oy = (H - this.rows*this.tile)/2;
    const ty = oy + this.tunnelRow*this.tile + this.tile/2;
    const pulse = 0.6+0.3*Math.sin(performance.now()/260);
    [ox-2, ox+this.cols*this.tile+2].forEach(tx=>{
      const g = ctx.createRadialGradient(tx,ty,1,tx,ty,16);
      g.addColorStop(0,'rgba(160,120,255,'+(0.65*pulse)+')');
      g.addColorStop(1,'rgba(160,120,255,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(tx,ty,16,0,Math.PI*2); ctx.fill();
    });
    for(const wp of this.warpParticles){
      const t = 1-wp.age/wp.life;
      const px = ox + wp.x*this.tile + this.tile/2 + wp.side*(1-t)*18;
      ctx.globalAlpha = Math.max(0,t);
      ctx.fillStyle='#c99bff';
      ctx.beginPath(); ctx.arc(px, ty, 2.4*t+1, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  },
  draw(){
    // deep navy board, like the reference — not pure black
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#1c2454'); bg.addColorStop(1,'#12173a');
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    const ox = (W - this.cols*this.tile)/2;
    const oy = (H - this.rows*this.tile)/2;
    const tile = this.tile, rows=this.rows, cols=this.cols;

    // brick-block walls: individual lifted tiles with a woven texture and
    // drop shadow, matching the reference's basket-weave brick look
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        if(this.layout[y][x]!==1) continue;
        this.drawBrickBlock(ox+x*tile+1, oy+y*tile+1, tile-2);
      }
    }

    this.drawPortals();

    // dots and power pellets — glossy red marbles, like the reference
    ctx.save();
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        const v=this.grid[y][x];
        const px=ox+x*tile+tile/2, py=oy+y*tile+tile/2;
        if(v===0){
          ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=2;
          ctx.fillStyle='#e63946';
          ctx.beginPath(); ctx.arc(px,py,4,0,Math.PI*2); ctx.fill();
          ctx.shadowBlur=0;
          ctx.fillStyle='rgba(255,255,255,.55)';
          ctx.beginPath(); ctx.arc(px-1.2,py-1.2,1.2,0,Math.PI*2); ctx.fill();
        } else if(v===3){
          const pulse = 6+Math.sin(performance.now()/180)*1.2;
          ctx.shadowColor='#e63946'; ctx.shadowBlur=8;
          ctx.fillStyle='#e63946';
          ctx.beginPath(); ctx.arc(px,py,pulse,0,Math.PI*2); ctx.fill();
          ctx.shadowBlur=0;
          ctx.fillStyle='rgba(255,255,255,.6)';
          ctx.beginPath(); ctx.arc(px-1.6,py-1.6,1.8,0,Math.PI*2); ctx.fill();
        }
      }
    }
    ctx.restore();

    // bonus fruit, like the strawberry/cherry row on the reference cabinet
    if(this.fruit){
      const fx=ox+this.fruit.x*tile+tile/2, fy=oy+this.fruit.y*tile+tile/2;
      ctx.save();
      ctx.shadowColor=this.fruit.color; ctx.shadowBlur=8;
      ctx.fillStyle=this.fruit.color;
      ctx.beginPath(); ctx.arc(fx,fy,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.arc(fx-2,fy-2,2,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#3dff8a'; ctx.lineWidth=2; ctx.shadowBlur=0;
      ctx.beginPath(); ctx.moveTo(fx,fy-7); ctx.lineTo(fx+2,fy-11); ctx.stroke();
      ctx.restore();
    }

    // player: pixel "muncher" — chunky circle built from blocks with a mouth wedge, glowing
    const p=this.player;
    const pcolor = this.power>0 ? '#3dff8a' : '#ffe94d';
    const cx = ox+p.x*this.tile+this.tile/2, cy = oy+p.y*this.tile+this.tile/2;
    const r = this.tile/2-2;
    const mouthAngle = 0.9;
    let facing = 0;
    if(p.dir.x===1) facing=0; else if(p.dir.x===-1) facing=Math.PI;
    else if(p.dir.y===1) facing=Math.PI/2; else if(p.dir.y===-1) facing=-Math.PI/2;
    ctx.save();
    ctx.fillStyle = pcolor;
    ctx.beginPath();
    ctx.arc(cx,cy,r, facing+mouthAngle, facing-mouthAngle+Math.PI*2);
    ctx.lineTo(cx,cy);
    ctx.fill();
    ctx.restore();
    // enemies, glowing
    for(const e of this.enemies){
      const ex=ox+e.x*this.tile+this.tile/2, ey=oy+e.y*this.tile+this.tile/2;
      if(e.eaten){
        // eaten ghosts scurry home as a pair of drifting eyes — no body
        const dx = e.dir.x*2.4, dy = e.dir.y*2.4;
        ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.ellipse(ex-4+dx*0.3, ey-1+dy*0.3, 3.2,4,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(ex+4+dx*0.3, ey-1+dy*0.3, 3.2,4,0,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#1a2a6e';
        ctx.beginPath(); ctx.arc(ex-4+dx, ey-1+dy, 1.5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex+4+dx, ey-1+dy, 1.5,0,Math.PI*2); ctx.fill();
        continue;
      }
      const ghostColor = this.power>0 ? '#3b8bff' : e.color;
      const px = (this.tile-4) / SPR.ghost[0].length;
      const sz = pixelsSize(SPR.ghost, px);
      drawSprite(SPR.ghost, ex-sz.w/2, ey-sz.h/2, px, { g:ghostColor, w:'#ffffff', d:'#0a0612' });
    }
    // floating score popups (ghost-chain bonus, fruit value)
    for(const pu of this.popups){
      const t = pu.age/pu.life;
      const pux = ox+pu.x*this.tile+this.tile/2, puy = oy+pu.y*this.tile+this.tile/2;
      ctx.globalAlpha = Math.max(0,1-t);
      ctx.fillStyle = pu.color;
      ctx.font='bold 10px monospace'; ctx.textAlign='center';
      ctx.fillText(pu.text, pux, puy - t*16);
      ctx.textAlign='left';
    }
    ctx.globalAlpha=1;
    // level badge + ghost mode indicator
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(ox,oy-2,84,16);
    ctx.fillStyle='#ffb62d'; ctx.font='bold 11px monospace'; ctx.textAlign='left';
    const modeLabel = this.power>0 ? 'БЕГСТВО' : (this.mode==='scatter' ? 'РАССЕЯНИЕ' : 'ОХОТА');
    ctx.fillText('LVL '+this.level+'  '+modeLabel, ox+4, oy+10);
  }
};

/* =====================================================================
   GAME 4 — ASTROBLASTERS  (joystick moves ship, FIRE button shoots)
   ===================================================================== */
const Shooter = {
  ship:{x:180,y:470}, bullets:[], enemies:[], fireTimer:0, spawnTimer:0, wave:1, killsThisWave:0,
  stars:[], nebulae:[], thrust:[],
  // enemy variety, weapon upgrades, enemy fire, and full multi-phase bosses
  eBullets:[], powerups:[], fanT:0, shieldHp:0, boss:null, bossesDefeated:0, hitFlashT:0,
  init(){
    this.ship={x:180,y:470}; this.bullets=[]; this.enemies=[]; this.fireTimer=0; this.spawnTimer=0; this.wave=1; this.killsThisWave=0;
    this.thrust=[];
    this.eBullets=[]; this.powerups=[]; this.fanT=0; this.shieldHp=0; this.boss=null; this.bossesDefeated=0; this.hitFlashT=0;
    // deterministic starfield/nebula generated once per session (not every frame)
    this.stars = [];
    for(let i=0;i<70;i++){
      this.stars.push({ x:Math.random()*W, y:Math.random()*H, r:0.6+Math.random()*1.8, phase:Math.random()*10 });
    }
    this.nebulae = [
      {x:90,y:120,r:130,color:'56,60,140'},
      {x:280,y:260,r:110,color:'120,50,110'},
      {x:150,y:420,r:100,color:'40,90,120'},
    ];
  },
  spawnBoss(){
    const maxHp = 16 + this.wave*3;
    const types = ['cruiser','core','sentinel'];
    const type = types[(this.bossesDefeated||0) % types.length];
    this.boss = { x:180, y:-70, targetY:90, hp:maxHp, maxHp, shootCd:1.2, t:0, entering:true, type };
    SFX.bossWarn();
  },
  update(dt){
    this.ship.x += input.joy.x*220*dt;
    this.ship.x = Math.max(24,Math.min(336,this.ship.x));
    if(this.hitFlashT>0) this.hitFlashT = Math.max(0,this.hitFlashT-dt);

    // thruster particles trailing the ship
    this.thrust.push({x:this.ship.x+(Math.random()-0.5)*6, y:this.ship.y+16, vy:80+Math.random()*40, life:0.35, age:0});
    for(const p of this.thrust){ p.age+=dt; p.y+=p.vy*dt; }
    this.thrust = this.thrust.filter(p=>p.age<p.life);

    this.fireTimer -= dt;
    if(input.fire && this.fireTimer<=0){
      if(this.fanT>0){
        this.bullets.push({x:this.ship.x,y:this.ship.y-20,vx:0});
        this.bullets.push({x:this.ship.x,y:this.ship.y-14,vx:-150});
        this.bullets.push({x:this.ship.x,y:this.ship.y-14,vx:150});
      } else {
        this.bullets.push({x:this.ship.x,y:this.ship.y-20,vx:0});
      }
      this.fireTimer = 0.22;
      SFX.shoot();
    }
    for(const b of this.bullets){ b.y -= 400*dt; if(b.vx) b.x += b.vx*dt; }
    this.bullets = this.bullets.filter(b=>b.y>-20 && b.x>-20 && b.x<W+20);
    if(this.fanT>0) this.fanT = Math.max(0,this.fanT-dt);

    // --- weapon/shield power-up capsules, dropped by fallen enemies ---
    for(const p of this.powerups){
      p.y += p.vy*dt;
      if(!p.dead && Math.hypot(p.x-this.ship.x,p.y-this.ship.y)<26){
        p.dead = true;
        if(p.type==='fan'){ this.fanT = 12; } else { this.shieldHp = Math.min(3,this.shieldHp+3); }
        SFX.powerup();
      }
    }
    this.powerups = this.powerups.filter(p=>!p.dead && p.y<H+20);

    this.spawnTimer -= dt;
    if(this.spawnTimer<=0 && !this.boss){
      this.spawnTimer = Math.max(0.3, 1.05-this.wave*0.05);
      // every 8th kill in a wave sends a tougher, bigger saucer
      const isTough = this.killsThisWave>0 && this.killsThisWave % 8 === 7;
      if(isTough) SFX.bossWarn();
      // enemy variety opens up as waves progress: straight drifters give
      // way to zigzaggers, ships that dive at the player, and shooters
      const pool = this.wave>=3 ? ['drifter','zigzag','diver','shooter']
                 : this.wave>=2 ? ['drifter','zigzag','diver']
                 : ['drifter','zigzag'];
      const type = isTough ? 'drifter' : pool[Math.floor(Math.random()*pool.length)];
      this.enemies.push({
        x:30+Math.random()*300, y:-20, vy:(isTough?40:60)+Math.random()*40,
        hp: isTough?3:1, boss:isTough, wob:Math.random()*10, type, shootCd:1.2+Math.random()*0.6, diving:false
      });
    }
    for(const e of this.enemies){
      e.y += e.vy*dt;
      if(e.type==='zigzag'){ e.x += Math.sin((e.y+e.wob*20)*0.045)*70*dt; e.x = Math.max(20,Math.min(340,e.x)); }
      else if(e.type==='diver'){
        if(!e.diving && e.y>70){ e.diving=true; }
        if(e.diving){
          e.x += Math.sign(this.ship.x-e.x)*100*dt;
          e.vy = Math.min(e.vy+120*dt, 260);
        }
      } else if(e.type==='shooter'){
        e.shootCd -= dt;
        if(e.shootCd<=0 && e.y>10 && e.y<H-70){
          e.shootCd = 1.7;
          this.eBullets.push({x:e.x,y:e.y+16,vx:0,vy:190});
        }
      }
    }
    this.enemies = this.enemies.filter(e=>{
      if(e.y>H+20){ return false; }
      return true;
    });

    // --- boss: multi-phase fight that pauses normal spawning ---
    if(this.boss){
      const b=this.boss;
      b.t += dt;
      if(b.entering){
        b.y = Math.min(b.targetY, b.y+80*dt);
        if(b.y>=b.targetY) b.entering=false;
      } else {
        // each boss type has its own fixed movement and attack pattern —
        // no phases, no recoloring, just three distinct standalone fights
        if(b.type==='core'){
          b.x = 180 + Math.sin(b.t*1.1)*80 + Math.sin(b.t*3.7)*14;
        } else if(b.type==='sentinel'){
          // smooth continuous drift — previously used Math.floor() to snap
          // between positions, which teleported the boss each beat and
          // read as jerky stutter/lag rather than deliberate movement
          b.x = 180 + Math.sin(b.t*0.5)*95;
        } else {
          b.x = 180 + Math.sin(b.t*0.6)*120;
        }
        b.shootCd -= dt;
        if(b.shootCd<=0){
          if(b.type==='cruiser'){
            b.shootCd = 1.1;
            this.eBullets.push({x:b.x-30,y:b.y+22,vx:0,vy:210});
            this.eBullets.push({x:b.x+30,y:b.y+22,vx:0,vy:210});
          } else if(b.type==='core'){
            b.shootCd = 1.5;
            for(let i=0;i<6;i++){
              const a=(i/6)*Math.PI*2 + b.t;
              this.eBullets.push({x:b.x,y:b.y, vx:150*Math.cos(a), vy:150*Math.sin(a)+80});
            }
          } else {
            b.shootCd = 0.95;
            const dx=this.ship.x-b.x, dy=this.ship.y-b.y, d=Math.hypot(dx,dy)||1;
            this.eBullets.push({x:b.x,y:b.y+30, vx:230*dx/d, vy:230*dy/d});
          }
          SFX.shoot();
        }
        if(Math.hypot(b.x-this.ship.x,b.y-this.ship.y)<40){
          if(this.shieldHp>0){ this.shieldHp--; SFX.shieldHit(); }
          else {
            lives--; setHUD(); SFX.explosion(); this.hitFlashT=0.3;
            if(lives<=0){ SFX.gameOver(); showOverlay('КОРАБЛЬ УНИЧТОЖЕН','Счёт: '+score+'  •  Волна '+this.wave); stopLoop(); return; }
          }
          b.y -= 50;
        }
      }
      for(const bl of this.bullets){
        if(!bl.dead && !b.entering && Math.hypot(bl.x-b.x,bl.y-b.y)<38){
          bl.dead = true; b.hp--; SFX.shieldHit();
          if(b.hp<=0){
            score += 1000; setHUD();
            SFX.explosion();
            this.boss = null;
            this.bossesDefeated = (this.bossesDefeated||0) + 1;
            this.wave++; this.killsThisWave=0;
            SFX.waveStart();
          }
        }
      }
      this.bullets = this.bullets.filter(bl=>!bl.dead);
    }

    // enemy/boss bullets: move, then check against the ship
    for(const b of this.eBullets){ b.x += (b.vx||0)*dt; b.y += b.vy*dt; }
    this.eBullets = this.eBullets.filter(b=>b.y>-30 && b.y<H+30 && b.x>-30 && b.x<W+30);
    for(const b of this.eBullets){
      if(!b.dead && Math.hypot(b.x-this.ship.x,b.y-this.ship.y)<15){
        b.dead = true;
        if(this.shieldHp>0){ this.shieldHp--; SFX.shieldHit(); }
        else {
          lives--; setHUD(); SFX.explosion(); this.hitFlashT=0.3;
          if(lives<=0){ SFX.gameOver(); showOverlay('КОРАБЛЬ УНИЧТОЖЕН','Счёт: '+score+'  •  Волна '+this.wave); stopLoop(); return; }
        }
      }
    }
    this.eBullets = this.eBullets.filter(b=>!b.dead);

    // collisions bullets/enemies
    for(const b of this.bullets){
      for(const e of this.enemies){
        if(!e.dead && Math.hypot(b.x-e.x,b.y-e.y)<(e.boss?26:18)){
          e.hp--; b.y=-999;
          if(e.hp<=0){
            e.dead=true;
            score += e.boss?150:20; setHUD();
            SFX.explosion();
            this.killsThisWave++;
            if(Math.random()<0.16){
              this.powerups.push({x:e.x,y:e.y,vy:75,type: Math.random()<0.5?'fan':'shield'});
            }
            if(this.killsThisWave>0 && this.killsThisWave%15===0){
              this.killsThisWave=0;
              if((this.wave+1)%3===0 && !this.boss) this.spawnBoss();
              else { this.wave++; SFX.waveStart(); }
            }
          }
        }
      }
    }
    this.enemies = this.enemies.filter(e=>!e.dead);
    this.bullets = this.bullets.filter(b=>b.y>-900);

    // enemy hits ship
    for(const e of this.enemies){
      if(Math.hypot(e.x-this.ship.x,e.y-this.ship.y)<(e.boss?28:22)){
        e.dead=true;
        if(this.shieldHp>0){ this.shieldHp--; SFX.shieldHit(); }
        else {
          lives--; setHUD();
          SFX.explosion(); this.hitFlashT=0.3;
          if(lives<=0){ SFX.gameOver(); showOverlay('КОРАБЛЬ УНИЧТОЖЕН','Счёт: '+score+'  •  Волна '+this.wave); stopLoop(); return; }
        }
      }
    }
    this.enemies = this.enemies.filter(e=>!e.dead);
  },
  drawSpaceBG(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#050818'); g.addColorStop(0.6,'#0a0e28'); g.addColorStop(1,'#03040e');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // soft colored nebula clouds
    for(const n of this.nebulae){
      const ng = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r);
      ng.addColorStop(0,`rgba(${n.color},0.28)`); ng.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=ng; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill();
    }
    // glowing sun near the top, like the reference
    const sg = ctx.createRadialGradient(180,70,0,180,70,90);
    sg.addColorStop(0,'rgba(255,214,140,0.9)'); sg.addColorStop(0.35,'rgba(255,170,60,0.5)'); sg.addColorStop(1,'rgba(255,170,60,0)');
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(180,70,90,0,Math.PI*2); ctx.fill();
    // twinkling stars
    const t = performance.now()/500;
    for(const s of this.stars){
      ctx.globalAlpha = 0.4 + 0.6*Math.abs(Math.sin(t+s.phase));
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  },
  drawSaucer(e){
    const r = e.boss?34:19;
    const typeColors = {drifter:'#c99bff', zigzag:'#ff9ecf', diver:'#ff6a6a', shooter:'#5de8ff'};
    const baseCol = e.boss ? '#ffb62d' : (typeColors[e.type] || '#c99bff');
    const bob = Math.sin(performance.now()/300+e.wob)*2;
    const cx=e.x, cy=e.y+bob;
    // under-glow
    const ug = ctx.createRadialGradient(cx,cy+r*0.3,0,cx,cy+r*0.3,r*1.3);
    ug.addColorStop(0,`${baseCol}55`); ug.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ug; ctx.beginPath(); ctx.arc(cx,cy+r*0.3,r*1.3,0,Math.PI*2); ctx.fill();
    // saucer body (wide ellipse) with metallic gradient
    const bg = ctx.createLinearGradient(cx,cy-r*0.3,cx,cy+r*0.35);
    bg.addColorStop(0, shade(baseCol,0.35)); bg.addColorStop(0.5, baseCol); bg.addColorStop(1, shade(baseCol,-0.4));
    ctx.beginPath(); ctx.ellipse(cx,cy,r,r*0.42,0,0,Math.PI*2);
    ctx.fillStyle=bg; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#1a1220'; ctx.stroke();
    // rim lights around the edge
    const lights = e.boss?8:6;
    for(let i=0;i<lights;i++){
      const a = (i/lights)*Math.PI*2 + performance.now()/400;
      const lx = cx+Math.cos(a)*r*0.85, ly = cy+Math.sin(a)*r*0.42*0.85;
      ctx.fillStyle = (i%2===0)?'#fff8d8':baseCol;
      ctx.beginPath(); ctx.arc(lx,ly,e.boss?2.6:1.8,0,Math.PI*2); ctx.fill();
    }
    // glass dome
    const dg = ctx.createRadialGradient(cx-r*0.15,cy-r*0.32,1,cx,cy-r*0.22,r*0.5);
    dg.addColorStop(0,'#eaf6ff'); dg.addColorStop(0.6,'#8fd0ff'); dg.addColorStop(1,'#3a7ab0');
    ctx.beginPath(); ctx.ellipse(cx,cy-r*0.18,r*0.5,r*0.36,0,Math.PI,0);
    ctx.fillStyle=dg; ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle='#1a1220'; ctx.stroke();
    if(e.boss){
      for(let i=0;i<e.hp;i++){ ctx.fillStyle='#ffb62d'; ctx.fillRect(e.x-14+i*10, cy-r-14, 6,4); }
    }
  },
  drawBossCruiser(b){
    // alien war-cruiser: elongated wedge hull, cyan engine flare, pulsing red viewports, panel greebles
    const w=104, h=52;
    ctx.save(); ctx.translate(b.x,b.y);
    const eg = ctx.createRadialGradient(0,-h*0.5,2,0,-h*0.5,44);
    eg.addColorStop(0,'rgba(93,232,255,0.5)'); eg.addColorStop(1,'rgba(93,232,255,0)');
    ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(0,-h*0.5,44,0,Math.PI*2); ctx.fill();
    const flick = 0.8+0.2*Math.sin(b.t*12);
    ctx.fillStyle='rgba(220,250,255,'+(0.55*flick)+')';
    ctx.beginPath(); ctx.ellipse(0,-h*0.53,6*flick,15*flick,0,0,Math.PI*2); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0,-h*0.55);
    ctx.lineTo(w*0.42,-h*0.1);
    ctx.lineTo(w*0.5,h*0.4);
    ctx.lineTo(w*0.18,h*0.55);
    ctx.lineTo(-w*0.18,h*0.55);
    ctx.lineTo(-w*0.5,h*0.4);
    ctx.lineTo(-w*0.42,-h*0.1);
    ctx.closePath();
    const hullGrad = ctx.createLinearGradient(0,-h*0.5,0,h*0.5);
    hullGrad.addColorStop(0,'#d7deec'); hullGrad.addColorStop(0.5,'#7d8aa8'); hullGrad.addColorStop(1,'#2b2f42');
    ctx.fillStyle=hullGrad; ctx.fill();
    ctx.strokeStyle='#14151f'; ctx.lineWidth=2.4; ctx.stroke();

    // panel greebles for detail
    ctx.strokeStyle='rgba(20,21,31,0.5)'; ctx.lineWidth=1;
    [[-w*0.28,-h*0.02,14,8],[w*0.14,-h*0.02,14,8],[-w*0.2,h*0.24,10,6],[w*0.1,h*0.24,10,6]].forEach(([x,y,ww,hh])=>{
      ctx.strokeRect(x,y,ww,hh);
    });

    ctx.strokeStyle='#5de8ff'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(0,-h*0.5); ctx.lineTo(0,h*0.5); ctx.stroke();

    for(let i=0;i<5;i++){
      const yy = -h*0.25 + i*(h*0.5/4);
      ctx.beginPath(); ctx.arc(0, yy, 2.6, 0, Math.PI*2);
      ctx.fillStyle = Math.sin(b.t*5+i)>0 ? '#ff5a5a' : '#7a1c1c';
      ctx.fill();
    }
    [-1,1].forEach(side=>{
      ctx.fillStyle='#2a2e3c';
      ctx.fillRect(side*w*0.42-4, h*0.08, 8, 18);
      ctx.strokeStyle='#0e0f16'; ctx.lineWidth=1.4; ctx.strokeRect(side*w*0.42-4, h*0.08, 8, 18);
      ctx.fillStyle='#5de8ff';
      ctx.beginPath(); ctx.arc(side*w*0.42, h*0.08+18, 2, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  },
  drawBossCore(b){
    // shattered planetoid core: jagged rock body with irregular glowing fissures, orbited by debris
    const r=44;
    ctx.save(); ctx.translate(b.x,b.y);
    const glow = ctx.createRadialGradient(0,0,0,0,0,r*1.6);
    glow.addColorStop(0,'rgba(255,120,60,0.38)'); glow.addColorStop(1,'rgba(255,120,60,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,r*1.6,0,Math.PI*2); ctx.fill();

    for(let i=0;i<4;i++){
      const a = b.t*0.7 + i*(Math.PI*2/4)+0.4;
      ctx.save(); ctx.translate(Math.cos(a)*r*1.3, Math.sin(a)*r*0.95); ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(-6,-5); ctx.lineTo(6,-7); ctx.lineTo(8,4); ctx.lineTo(-3,8); ctx.lineTo(-8,3);
      ctx.closePath(); ctx.fillStyle='#5a5450'; ctx.fill();
      ctx.strokeStyle='#221f1c'; ctx.lineWidth=1; ctx.stroke();
      ctx.restore();
    }

    // jagged asteroid silhouette — two sine harmonics break up the symmetry
    // so it doesn't read as a clean hexagon
    ctx.beginPath();
    const bumps=13;
    for(let i=0;i<=bumps;i++){
      const a=(i/bumps)*Math.PI*2;
      const rr = r*(0.72 + 0.16*Math.sin(a*3+1.1) + 0.11*Math.sin(a*5+b.t*0.2+2.4));
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    const bodyGrad = ctx.createRadialGradient(-r*0.28,-r*0.3,2,0,0,r*1.05);
    bodyGrad.addColorStop(0,'#8a7a6c'); bodyGrad.addColorStop(0.55,'#4a3f38'); bodyGrad.addColorStop(1,'#18130f');
    ctx.fillStyle=bodyGrad; ctx.fill();
    ctx.strokeStyle='#0e0b09'; ctx.lineWidth=2; ctx.stroke();

    // crater shading for texture
    ctx.fillStyle='rgba(0,0,0,0.22)';
    [[-r*0.3,r*0.15,7],[r*0.22,-r*0.28,5],[r*0.05,r*0.35,4]].forEach(([cx,cy,cr])=>{
      ctx.beginPath(); ctx.arc(cx,cy,cr,0,Math.PI*2); ctx.fill();
    });

    // molten fissures — irregular golden-angle spacing avoids a symmetric
    // "plus sign" look; double stroke fakes a glow without shadowBlur
    const fissureAngles = [0.4, 2.8, 3.6, 5.1, 1.7, 4.6];
    for(let i=0;i<fissureAngles.length;i++){
      const a = fissureAngles[i] + b.t*0.15;
      const len = r*(0.55+0.22*Math.sin(i*2.1+b.t*0.35));
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*0.12, Math.sin(a)*r*0.12);
      ctx.lineTo(Math.cos(a)*len, Math.sin(a)*len);
      ctx.strokeStyle='rgba(255,138,61,0.32)'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.stroke();
      ctx.strokeStyle='#ffb066'; ctx.lineWidth=1.8; ctx.lineCap='round'; ctx.stroke();
    }
    ctx.restore();
  },
  drawBossSentinel(b){
    // ring-shaped guardian satellite: segmented armored ring with a radar
    // sweep, glowing seams, and a pulsing core eye — all glow is faked with
    // layered radial gradients instead of ctx.shadowBlur, which is costly
    // to recompute every frame on lower-end mobile browsers
    const r=42;
    ctx.save(); ctx.translate(b.x,b.y);
    const glow = ctx.createRadialGradient(0,0,0,0,0,r*1.7);
    glow.addColorStop(0,'rgba(160,255,180,0.32)'); glow.addColorStop(1,'rgba(160,255,180,0)');
    ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(0,0,r*1.7,0,Math.PI*2); ctx.fill();

    // segmented armored ring, with glowing node caps
    ctx.save(); ctx.rotate(b.t*0.4);
    for(let i=0;i<8;i++){
      const a0=(i/8)*Math.PI*2, a1=a0+(Math.PI*2/8)*0.7;
      ctx.beginPath(); ctx.arc(0,0,r,a0,a1); ctx.strokeStyle='#33443d'; ctx.lineWidth=11; ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,r,a0,a1); ctx.strokeStyle='#8fffb0'; ctx.lineWidth=2.4; ctx.stroke();
      const nx=Math.cos(a1)*r, ny=Math.sin(a1)*r;
      ctx.beginPath(); ctx.arc(nx,ny,2.6,0,Math.PI*2); ctx.fillStyle='#c8ffdc'; ctx.fill();
    }
    ctx.restore();

    // slow radar sweep line across the ring
    ctx.save(); ctx.rotate(-b.t*0.7);
    const sweepGrad = ctx.createLinearGradient(0,0,r*0.88,0);
    sweepGrad.addColorStop(0,'rgba(143,255,176,0.55)'); sweepGrad.addColorStop(1,'rgba(143,255,176,0)');
    ctx.strokeStyle=sweepGrad; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(r*0.88,0); ctx.stroke();
    ctx.restore();

    ctx.strokeStyle='#3a4a44'; ctx.lineWidth=3;
    for(let i=0;i<4;i++){
      const a=(i/4)*Math.PI*2 + b.t*0.4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*0.46, Math.sin(a)*r*0.46);
      ctx.lineTo(Math.cos(a)*r*0.88, Math.sin(a)*r*0.88);
      ctx.stroke();
    }

    const hubGrad = ctx.createRadialGradient(-5,-5,2,0,0,r*0.5);
    hubGrad.addColorStop(0,'#e8fff0'); hubGrad.addColorStop(0.5,'#4fd88a'); hubGrad.addColorStop(1,'#1e5c3a');
    ctx.beginPath(); ctx.arc(0,0,r*0.46,0,Math.PI*2);
    ctx.fillStyle=hubGrad; ctx.fill();
    ctx.strokeStyle='#0e1c14'; ctx.lineWidth=2; ctx.stroke();

    // pulsing eye — radial-gradient halo instead of shadowBlur
    const eyePulse = 0.6+0.4*Math.sin(b.t*4);
    const eg = ctx.createRadialGradient(0,0,1,0,0,16*eyePulse);
    eg.addColorStop(0,'rgba(143,255,176,0.85)'); eg.addColorStop(1,'rgba(143,255,176,0)');
    ctx.fillStyle=eg; ctx.beginPath(); ctx.arc(0,0,16*eyePulse,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fillStyle='#8fffb0'; ctx.fill();
    ctx.strokeStyle='#0e1c14'; ctx.lineWidth=1.6; ctx.stroke();
    ctx.restore();
  },
  drawBoss(){
    const b=this.boss; if(!b) return;
    if(b.type==='core') this.drawBossCore(b);
    else if(b.type==='sentinel') this.drawBossSentinel(b);
    else this.drawBossCruiser(b);
    // health bar + name — fixed color per boss, no phase/recolor
    const names = {cruiser:'КРЕЙСЕР', core:'ЯДРО', sentinel:'СТРАЖ'};
    const barCol = {cruiser:'#5de8ff', core:'#ff8a3d', sentinel:'#8fffb0'}[b.type] || '#fff';
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(60,26,240,16);
    ctx.fillStyle=barCol; ctx.fillRect(64,29,232*Math.max(0,b.hp/b.maxHp),10);
    ctx.fillStyle='#fff'; ctx.font='bold 9px monospace'; ctx.textAlign='center';
    ctx.fillText(names[b.type]||'БОСС', 180, 38);
    ctx.textAlign='left';
  },
  drawEnemyBullets(){
    for(const b of this.eBullets){
      ctx.save();
      ctx.shadowColor='#ff5a8a'; ctx.shadowBlur=7;
      ctx.fillStyle='#ff5a8a';
      ctx.beginPath(); ctx.arc(b.x,b.y,3.4,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  },
  drawPowerups(){
    for(const p of this.powerups){
      const pulse = 0.7+0.3*Math.sin(p.y*0.1);
      const col = p.type==='fan' ? '#2de3ff' : '#3dff8a';
      ctx.save(); ctx.translate(p.x,p.y);
      const g = ctx.createRadialGradient(0,0,2,0,0,20);
      g.addColorStop(0, hexToRgba(col,0.6*pulse)); g.addColorStop(1, hexToRgba(col,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
      ctx.rotate(Math.sin(p.y*0.06)*0.2);
      if(p.type==='shield'){
        // shield emblem: rounded pentagon with a cross, same reading as the ship's shield ring
        ctx.beginPath();
        ctx.moveTo(0,-10); ctx.lineTo(7.5,-5.5); ctx.lineTo(7.5,3);
        ctx.quadraticCurveTo(7.5,9,0,11);
        ctx.quadraticCurveTo(-7.5,9,-7.5,3);
        ctx.lineTo(-7.5,-5.5); ctx.closePath();
        ctx.fillStyle=col; ctx.fill();
        ctx.strokeStyle='#0a0a12'; ctx.lineWidth=1.4; ctx.stroke();
        ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1.6; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(0,-5); ctx.lineTo(0,6); ctx.moveTo(-4,0.5); ctx.lineTo(4,0.5); ctx.stroke();
      } else {
        // fan-shot emblem: three scattered bolts spreading out, echoing the actual spread fire
        ctx.strokeStyle=col; ctx.lineWidth=2.6; ctx.lineCap='round';
        [-0.5,0,0.5].forEach(a=>{
          ctx.beginPath();
          ctx.moveTo(Math.sin(a)*2, 8);
          ctx.lineTo(Math.sin(a)*10, -8);
          ctx.stroke();
        });
      }
      ctx.restore();
    }
  },
  drawShip(){
    const x=this.ship.x, y=this.ship.y;
    // thruster particles
    for(const p of this.thrust){
      const f = 1-p.age/p.life;
      ctx.globalAlpha = f*0.7;
      ctx.fillStyle = f>0.5?'#fff8d8':'#3dff8a';
      ctx.beginPath(); ctx.arc(p.x,p.y,3*f+1,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
    // shield bubble, when active — a soft, thin, translucent sphere big
    // enough to fit the whole ship inside (not a tight ring clipping the
    // wings, and not a literal soap-bubble look — just gentle transparency)
    if(this.shieldHp>0){
      ctx.save();
      const cx = x, cy = y+4, r = 42;
      const pulse = 0.5+0.5*Math.sin(performance.now()/500);

      // barely-there fill
      const fillGrad = ctx.createRadialGradient(cx,cy,4,cx,cy,r);
      fillGrad.addColorStop(0,'rgba(61,255,138,0.06)');
      fillGrad.addColorStop(0.75,'rgba(61,255,138,0.04)');
      fillGrad.addColorStop(1,'rgba(61,255,138,0.10)');
      ctx.fillStyle=fillGrad;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();

      // single soft rim, gently pulsing
      ctx.globalAlpha = 0.32+0.14*pulse;
      ctx.strokeStyle='#3dff8a'; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();

      ctx.globalAlpha=1;
      ctx.restore();
    }
    if(!SHIP_SHEET_READY){
      // fallback vector silhouette while the sprite loads
      const hg = ctx.createLinearGradient(x-16,y,x+16,y);
      hg.addColorStop(0,'#1f9e5c'); hg.addColorStop(0.5,'#5dffa8'); hg.addColorStop(1,'#1f9e5c');
      ctx.beginPath();
      ctx.moveTo(x,y-22); ctx.lineTo(x+5,y-4); ctx.lineTo(x+20,y+12); ctx.lineTo(x+8,y+10);
      ctx.lineTo(x+3,y+16); ctx.lineTo(x-3,y+16); ctx.lineTo(x-8,y+10); ctx.lineTo(x-20,y+12); ctx.lineTo(x-5,y-4);
      ctx.closePath();
      ctx.fillStyle=hg; ctx.fill();
      return;
    }
    // engine flame flicker chooses between the idle and lit-engine frames;
    // a hit briefly swaps to the damage-sparks frame for feedback
    let col, row;
    if(this.hitFlashT>0 && Math.floor(this.hitFlashT*16)%2===0){ col=1; row=2; }
    else if(Math.sin(performance.now()/90)>0){ col=1; row=0; }
    else { col=0; row=0; }
    const fr = shipFrameRect(col,row);
    const dh = 58, dw = dh*(fr.sw/fr.sh);
    ctx.drawImage(SHIP_SHEET, fr.sx, fr.sy, fr.sw, fr.sh, x-dw/2, y-dh/2+4, dw, dh);
  },
  draw(){
    this.drawSpaceBG();
    // bullets: glowing laser bolts
    for(const b of this.bullets){
      ctx.save();
      ctx.shadowColor='#5de8ff'; ctx.shadowBlur=8;
      const bg = ctx.createLinearGradient(b.x,b.y-9,b.x,b.y+5);
      bg.addColorStop(0,'#ffffff'); bg.addColorStop(0.5,'#5de8ff'); bg.addColorStop(1,'rgba(93,232,255,0)');
      ctx.fillStyle=bg;
      drawRoundRect(b.x-2,b.y-9,4,14,2,bg);
      ctx.restore();
    }
    this.drawEnemyBullets();
    this.drawPowerups();
    // enemies — glossy flying saucers
    for(const e of this.enemies) this.drawSaucer(e);
    this.drawBoss();
    // ship
    this.drawShip();
    // wave banner
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(130,46,100,18);
    ctx.fillStyle='#2de3ff'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
    ctx.fillText('WAVE '+this.wave, 180,59);
    ctx.textAlign='left';
    // active upgrade timers, bottom-left
    let hy=H-14;
    if(this.fanT>0){ ctx.fillStyle='#2de3ff'; ctx.font='8px monospace'; ctx.textAlign='left'; ctx.fillText('ВЕЕР '+this.fanT.toFixed(1)+'с', 8, hy); hy-=11; }
    if(this.shieldHp>0){ ctx.fillStyle='#3dff8a'; ctx.font='8px monospace'; ctx.textAlign='left'; ctx.fillText('ЩИТ x'+this.shieldHp, 8, hy); }
  }
};

/* =====================================================================
   GAME 5 — BRICK BUSTER  (drag paddle horizontally)
   ===================================================================== */
// four brick-field shapes, cycled by level, on top of the classic full grid
const BRICK_SHAPES = [
  (r,rows,c,cols)=> true,
  (r,rows,c,cols)=>{ const half = Math.floor((rows-1-r) * (cols/2) / Math.max(1,rows-1)); return c>=half && c<=cols-1-half; },
  (r,rows,c,cols)=>{ const cy=(rows-1)/2, cx=(cols-1)/2; return Math.abs(r-cy)/(rows/2) + Math.abs(c-cx)/(cols/2) <= 1.05; },
  (r,rows,c,cols)=> (r+c)%2===0,
  (r,rows,c,cols)=> ((c + r*2) % 5) < 3,
];
const Brick = {
  paddle:{w:70,h:12,y:480}, balls:[], bricks:[], level:1, speedMul:1,
  particles:[], hiScore:0, powerups:[], lasers:[], laserT:0, laserCd:0, fireT:0,
  init(){
    this.level = 1; this.speedMul = 1; this.particles=[]; this.powerups=[]; this.lasers=[];
    this.laserT=0; this.laserCd=0; this.fireT=0;
    this.paddle={w:70,h:12,y:480};
    this.setupLevel();
  },
  makeBall(vx){
    return {x:180,y:460,vx: vx!=null?vx:140*this.speedMul*(Math.random()<0.5?1:-1), vy:-220*this.speedMul, trail:[]};
  },
  setupLevel(){
    this.balls=[this.makeBall()];
    this.bricks=[];
    // alternating steel-blue / brass-gold metallic tube colors, like riveted machine bricks
    const colors=['#4fc9e8','#e8a838'];
    const rows = Math.min(5+this.level-1, 8);
    const cols=8, bw=38, bh=15, gap=3, ox=(360-(cols*(bw+gap)-gap))/2, oy=64;
    const shapeFn = BRICK_SHAPES[(this.level-1) % BRICK_SHAPES.length];
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(!shapeFn(r,rows,c,cols)) continue;
        // from level 2 on, a few bricks need two hits (marked 'hard')
        const hard = this.level>1 && Math.random()<0.15;
        this.bricks.push({x:ox+c*(bw+gap), y:oy+r*(bh+gap), w:bw, h:bh, alive:true, hp:hard?2:1, hard, color:colors[r%colors.length]});
      }
    }
  },
  explode(x,y,color){
    for(let i=0;i<10;i++){
      const a = Math.random()*Math.PI*2, spd = 60+Math.random()*120;
      this.particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:0.4+Math.random()*0.2,age:0,color: Math.random()<0.5?color:'#ffb62d'});
    }
  },
  breakBrick(b){
    b.alive=false; score+=b.hard?30:15; this.explode(b.x+b.w/2,b.y+b.h/2,b.color);
    if(this.bricks.every(bb=>!bb.alive || bb===b)) SFX.lastBrick();
    // occasional power-up capsule drops from the broken brick — kept fairly
    // rare so the field doesn't get cluttered with capsules
    if(Math.random()<0.07){
      const types=['multi','laser','fire'];
      this.powerups.push({x:b.x+b.w/2, y:b.y+b.h/2, vy:90, type:types[Math.floor(Math.random()*types.length)]});
    }
    setHUD();
  },
  update(dt){
    this.paddle.x = input.paddleX*W;
    this.paddle.x = Math.max(this.paddle.w/2, Math.min(W-this.paddle.w/2, this.paddle.x));

    if(this.fireT>0) this.fireT = Math.max(0,this.fireT-dt);

    // --- laser power-up: paddle auto-fires twin bolts while active ---
    if(this.laserT>0){
      this.laserT = Math.max(0,this.laserT-dt);
      this.laserCd -= dt;
      if(this.laserCd<=0){
        this.laserCd = 0.38;
        this.lasers.push({x:this.paddle.x-16,y:this.paddle.y-4});
        this.lasers.push({x:this.paddle.x+16,y:this.paddle.y-4});
        SFX.shoot();
      }
    }
    for(const l of this.lasers) l.y -= 340*dt;
    for(const l of this.lasers){
      if(l.dead) continue;
      for(const b of this.bricks){
        if(!b.alive) continue;
        if(l.x>b.x-4 && l.x<b.x+b.w+4 && l.y>b.y-4 && l.y<b.y+b.h+4){
          l.dead=true; b.hp--; SFX.brickHit();
          if(b.hp<=0) this.breakBrick(b); else { score+=5; setHUD(); }
          break;
        }
      }
    }
    this.lasers = this.lasers.filter(l=>!l.dead && l.y>-10);

    // --- balls: one or more once a multi-ball power-up has been caught ---
    for(const ball of this.balls){
      ball.x += ball.vx*dt;
      ball.y += ball.vy*dt;
      ball.trail = ball.trail || [];
      ball.trail.push({x:ball.x,y:ball.y}); if(ball.trail.length>10) ball.trail.shift();
      if(ball.x<8){ ball.x=8; ball.vx*=-1; SFX.wallHit(); }
      if(ball.x>W-8){ ball.x=W-8; ball.vx*=-1; SFX.wallHit(); }
      if(ball.y<8){ ball.y=8; ball.vy*=-1; SFX.wallHit(); }

      if(ball.y>this.paddle.y-8 && ball.y<this.paddle.y+this.paddle.h &&
         Math.abs(ball.x-this.paddle.x)<this.paddle.w/2+6 && ball.vy>0){
        ball.vy*=-1;
        const off=(ball.x-this.paddle.x)/(this.paddle.w/2);
        ball.vx = off*220*this.speedMul;
        SFX.paddleHit();
      }

      for(const b of this.bricks){
        if(!b.alive) continue;
        if(ball.x>b.x-8 && ball.x<b.x+b.w+8 && ball.y>b.y-8 && ball.y<b.y+b.h+8){
          b.hp--;
          SFX.brickHit();
          // fireball punches straight through without bouncing, so it can
          // clear several bricks in a single pass instead of just one
          if(this.fireT<=0) ball.vy*=-1;
          if(b.hp<=0) this.breakBrick(b); else { score+=5; setHUD(); }
          if(this.fireT<=0) break;
        }
      }
    }
    // balls that fell off the bottom are removed; lose a life only once none remain
    this.balls = this.balls.filter(ball=>ball.y<H+20);
    if(this.balls.length===0){
      lives--; setHUD();
      if(lives<=0){ SFX.gameOver(); showOverlay('ИГРА ОКОНЧЕНА','Счёт: '+score+'  •  Уровень '+this.level); stopLoop(); return; }
      this.balls = [this.makeBall()];
      this.laserT=0; this.fireT=0; this.lasers=[];
    }

    // --- power-up capsules (multi-ball / laser / fireball), caught by the paddle ---
    for(const p of this.powerups){
      p.y += p.vy*dt;
      if(!p.dead && p.y>this.paddle.y-6 && p.y<this.paddle.y+this.paddle.h && Math.abs(p.x-this.paddle.x)<this.paddle.w/2+10){
        p.dead = true;
        SFX.powerup();
        if(p.type==='multi'){
          const base = this.balls[0] || this.makeBall();
          this.balls.push(this.makeBall(-Math.abs(base.vx||140)-40));
          this.balls.push(this.makeBall(Math.abs(base.vx||140)+40));
        } else if(p.type==='laser'){
          this.laserT = 10; this.laserCd = 0;
        } else if(p.type==='fire'){
          this.fireT = 8;
        }
      }
    }
    this.powerups = this.powerups.filter(p=>!p.dead && p.y<H+20);

    // fading explosion particles
    for(const p of this.particles){ p.age+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=300*dt; }
    this.particles = this.particles.filter(p=>p.age<p.life);

    if(score>this.hiScore) this.hiScore=score;
    if(this.bricks.every(b=>!b.alive)){
      this.level++;
      this.speedMul = Math.min(1.6, 1 + (this.level-1)*0.12);
      score += 100; setHUD();
      SFX.levelUp();
      this.setupLevel();
    }
  },
  drawPowerupCapsule(p){
    const cols = {multi:'#ffd24d', laser:'#5de8ff', fire:'#ff6a3d'};
    const col = cols[p.type];
    ctx.save(); ctx.translate(p.x,p.y);
    const g = ctx.createRadialGradient(0,0,2,0,0,18);
    g.addColorStop(0, hexToRgba(col,0.55)); g.addColorStop(1, hexToRgba(col,0));
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.fill();
    drawRoundRect(-14,-9,28,18,5,'#1a1510',col,1.6);
    if(p.type==='laser'){
      // lightning-bolt icon
      ctx.beginPath();
      ctx.moveTo(2,-7); ctx.lineTo(-5,1); ctx.lineTo(0,1); ctx.lineTo(-2,7); ctx.lineTo(6,-1); ctx.lineTo(1,-1);
      ctx.closePath(); ctx.fillStyle=col; ctx.fill();
    } else if(p.type==='fire'){
      // flame icon, with a lighter inner tongue
      ctx.beginPath();
      ctx.moveTo(0,-8);
      ctx.quadraticCurveTo(6,-2,3,2);
      ctx.quadraticCurveTo(7,3,4,8);
      ctx.quadraticCurveTo(0,10,-4,7);
      ctx.quadraticCurveTo(-7,3,-3,0);
      ctx.quadraticCurveTo(-5,-4,0,-8);
      ctx.closePath(); ctx.fillStyle=col; ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,3,2,3.2,0,0,Math.PI*2); ctx.fillStyle='#fff2c9'; ctx.fill();
    } else {
      // multi-ball icon: a small cluster of three balls
      [[-6,3],[6,3],[0,-5]].forEach(([dx,dy])=>{
        ctx.beginPath(); ctx.arc(dx,dy,3.4,0,Math.PI*2);
        ctx.fillStyle=col; ctx.fill();
        ctx.strokeStyle='#1a1510'; ctx.lineWidth=1; ctx.stroke();
      });
    }
    ctx.restore();
  },
  draw(){
    this.drawIndustrialBG();

    for(const b of this.bricks){
      if(!b.alive) continue;
      this.drawMetalBrick(b);
    }

    for(const p of this.powerups) this.drawPowerupCapsule(p);

    // laser bolts fired by the paddle while the laser power-up is active
    for(const l of this.lasers){
      ctx.save();
      ctx.shadowColor='#5de8ff'; ctx.shadowBlur=7;
      ctx.fillStyle='#5de8ff';
      drawRoundRect(l.x-1.5,l.y-8,3,12,1.5,'#5de8ff');
      ctx.restore();
    }

    // particle explosions
    for(const p of this.particles){
      const t = 1-p.age/p.life;
      ctx.globalAlpha = Math.max(0,t);
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,3*t+1,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }

    // green energy baseline just above the paddle, like the reference
    const baseY = this.paddle.y+this.paddle.h+18;
    ctx.save();
    ctx.shadowColor='#3dff8a'; ctx.shadowBlur=12;
    ctx.strokeStyle='#3dff8a'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(0,baseY); ctx.lineTo(W,baseY); ctx.stroke();
    ctx.restore();

    // paddle: brushed-metal bar
    const pxp = Math.round(this.paddle.x-this.paddle.w/2), pyp = Math.round(this.paddle.y);
    drawShadow(this.paddle.x, pyp+this.paddle.h+3, this.paddle.w, 6);
    const pgrad = ctx.createLinearGradient(pxp,pyp,pxp,pyp+this.paddle.h);
    pgrad.addColorStop(0,'#e8e8ee'); pgrad.addColorStop(0.5,'#9a9aa8'); pgrad.addColorStop(1,'#5a5a68');
    drawRoundRect(pxp,pyp,this.paddle.w,this.paddle.h,4,pgrad,'#2a2a34',2);
    ctx.fillStyle='rgba(255,255,255,.6)'; ctx.fillRect(pxp+4,pyp+2,this.paddle.w-8,2);
    ctx.fillStyle='#3dff8a'; ctx.fillRect(pxp+this.paddle.w/2-6,pyp+this.paddle.h-4,12,3);

    // ball(s): glowing comet with fading trail — fireball glows hot orange
    for(const ball of this.balls){
      const trail = ball.trail||[];
      for(let i=0;i<trail.length;i++){
        const tp=trail[i], f=i/trail.length;
        ctx.globalAlpha = f*0.5;
        ctx.fillStyle = this.fireT>0 ? '#ff5a3d' : '#ffb62d';
        ctx.beginPath(); ctx.arc(tp.x,tp.y,4*f,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
      const core = this.fireT>0 ? ['#fff2d8','#ff8a3d','#c9401a'] : ['#fff8d8','#ffd24d','#e8922a'];
      const bg = ctx.createRadialGradient(ball.x-2,ball.y-2,0,ball.x,ball.y,7);
      bg.addColorStop(0,core[0]); bg.addColorStop(0.5,core[1]); bg.addColorStop(1,core[2]);
      ctx.save(); ctx.shadowColor=core[1]; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(ball.x,ball.y,6,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
      ctx.restore();
    }

    // LED-style readout panel, like the reference's SCORE / LEVEL / HI-SCORE displays
    this.drawLEDPanel(8,6,110,34,'SCORE',score,'#ffb62d');
    this.drawLEDPanel(125,6,110,34,'LEVEL',this.level,'#3dff8a');
    this.drawLEDPanel(242,6,110,34,'HI-SCORE',this.hiScore,'#ff6a6a');

    // active power-up timers
    let hy=H-14;
    if(this.laserT>0){ ctx.fillStyle='#5de8ff'; ctx.font='8px monospace'; ctx.textAlign='left'; ctx.fillText('ЛАЗЕР '+this.laserT.toFixed(1)+'с', 8, hy); hy-=11; }
    if(this.fireT>0){ ctx.fillStyle='#ff6a3d'; ctx.font='8px monospace'; ctx.textAlign='left'; ctx.fillText('ОГОНЬ '+this.fireT.toFixed(1)+'с', 8, hy); hy-=11; }
    if(this.balls.length>1){ ctx.fillStyle='#ffd24d'; ctx.font='8px monospace'; ctx.textAlign='left'; ctx.fillText('МЯЧЕЙ x'+this.balls.length, 8, hy); }
  },
  drawIndustrialBG(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1c1712'); g.addColorStop(1,'#2e2620');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // converging wall panel lines for a pseudo-3D tunnel feel
    ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1;
    const vpx=W/2, vpy=-60;
    for(let i=0;i<=8;i++){
      const x = i*(W/8);
      ctx.beginPath(); ctx.moveTo(x,H); ctx.lineTo(vpx+(x-vpx)*0.25,0); ctx.stroke();
    }
    for(let y=40; y<H; y+=46){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }
    // subtle panel blocks
    for(let ty=0; ty<H; ty+=46){
      for(let tx=0; tx<W; tx+=46){
        if(((tx/46+ty/46))%3===0){ ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fillRect(tx,ty,44,44); }
      }
    }
  },
  drawMetalBrick(b){
    const x=Math.round(b.x), y=Math.round(b.y), w=b.w, h=b.h;
    const col = b.hard && b.hp>1 ? '#c9c9d0' : b.color;
    // horizontal metal-tube gradient: dark-light-dark, rounded ends
    const grad = ctx.createLinearGradient(x,0,x+w,0);
    grad.addColorStop(0, shade(col,-0.45));
    grad.addColorStop(0.5, shade(col,0.3));
    grad.addColorStop(1, shade(col,-0.45));
    drawRoundRect(x,y,w,h,h/2,grad,'#1a1510',2);
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.fillRect(x+4,y+2,w-8,2);
    // rivets at the ends like the reference tube-bricks
    ctx.fillStyle='rgba(0,0,0,.4)';
    ctx.beginPath(); ctx.arc(x+6,y+h/2,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+w-6,y+h/2,2,0,Math.PI*2); ctx.fill();
    if(b.hard && b.hp>1){
      ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x+4,y+3); ctx.lineTo(x+w/2,y+h-4); ctx.lineTo(x+w-4,y+3); ctx.stroke();
    }
  },
  drawLEDPanel(x,y,w,h,label,value,color){
    drawRoundRect(x,y,w,h,4,'#0a0a0a','#4a4238',2);
    ctx.textAlign='center';
    ctx.fillStyle='#8a8078'; ctx.font='8px monospace';
    ctx.fillText(label, x+w/2, y+11);
    ctx.save();
    ctx.shadowColor=color; ctx.shadowBlur=6;
    ctx.fillStyle=color; ctx.font='bold 15px monospace';
    ctx.fillText(String(value).padStart(6,'0'), x+w/2, y+h-7);
    ctx.restore();
    ctx.textAlign='left';
  }
};

resizeCanvas();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</body>
